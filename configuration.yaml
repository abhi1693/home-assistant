# Loads Home Assistant's default integrations.
default_config:

homeassistant:
  # G3-012, Indiabulls Centrum Park, Sector 103, Gurugram, Haryana, India - 122006
  name: Home
  latitude: 28.4978819
  longitude: 76.9830822
  elevation: 211
  radius: 100
  packages: !include_dir_named packages
  unit_system: metric
  currency: INR
  country: IN
  time_zone: Asia/Kolkata

recorder:
  db_url: !env_var HOME_ASSISTANT_RECORDER_DB_URL
  purge_keep_days: 10
  exclude:
    entities:
      - person.abhimanyu
      - person.krishna
      - person.manisha
    entity_globs:
      - device_tracker.*
      - sensor.*health_connect*
      - sensor.*sleep*
      - sensor.*heart_rate*
      - sensor.*oxygen_saturation*
      - sensor.*respiratory_rate*
      - sensor.*blood_glucose*
      - sensor.*blood_pressure*
      - sensor.*body_fat*
      - sensor.*body_temperature*
      - sensor.*body_water_mass*
      - sensor.*basal_body_temperature*
      - sensor.*basal_metabolic_rate*
      - sensor.*bone_mass*
      - sensor.*lean_body_mass*
      - sensor.*weight*
      - sensor.*vo2_max*
      - sensor.*daily_hydration*

frontend:
  themes: !include_dir_merge_named themes

family_dashboard_guard:

family_camera_streams:

family_room_registry:

sensor:
  - platform: family_announcements
    access_file: /config/access/family-dashboard.json
  - platform: family_camera_events
    access_file: /config/access/family-dashboard.json
    streams_file: /config/access/protect-streams.json
  - platform: family_jellyfin_sessions
  - platform: family_music_assistant_sessions
  - platform: family_seerr_requests
    base_url: http://jellyseerr.media.svc.cluster.local:10241
    external_url: http://requests.media.home
    api_key: !env_var SEERR_API_KEY

lovelace:
  resource_mode: yaml
  resources:
    - url: /local/community/bubble-card/bubble-card.js?v=3.2.5
      type: module
    - url: /local/community/button-card/button-card.js?v=7.0.1
      type: module
    - url: /local/community/navbar-card/navbar-card.js?v=1.6.1
      type: module
    - url: /local/community/card-mod/card-mod.js?v=4.2.1
      type: module
    - url: /local/community/kiosk-mode/kiosk-mode.js?v=14.0.2
      type: module
    - url: /local/community/auto-entities/auto-entities.js?v=1.16.1
      type: module
    - url: /local/family-announcements-card.js?v=2.3.0
      type: module
    - url: /local/family-responsive-grid-card.js?v=1.1.0
      type: module
    - url: /local/family-fan-card.js?v=3.3.1
      type: module
    - url: /local/family-agenda-card.js?v=1.1.0
      type: module
    - url: /local/family-seerr-requests-card.js?v=1.1.0
      type: module
    - url: /local/family-room-card.js?v=1.2.0
      type: module
    - url: /local/family-room-summary-card.js?v=1.0.0
      type: module
    - url: /local/family-appliance-card.js?v=1.0.0
      type: module
    - url: /local/family-media-card.js?v=1.0.0
      type: module
    - url: /local/family-rooms-card.js?v=1.0.0
      type: module
    - url: /local/family-camera-wall-card.js?v=2.1.0
      type: module
    - url: /local/family-camera-events-card.js?v=1.3.0
      type: module
    - url: /local/community/todo-swipe-card/todo-swipe-card.js?v=3.6.0
      type: module
  dashboards: !include dashboards/lovelace-dashboards.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
