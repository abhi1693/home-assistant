# Loads Home Assistant's default integrations.
default_config:

homeassistant:
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  resources:
    - url: /local/community/bubble-card/bubble-card.js?v=3.2.5
      type: module
  dashboards: !include dashboards/lovelace-dashboards.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
