                        const message = entity.attributes.message;
                        if (!message) return 'No upcoming events';
                        return message;
                      ]]]
                    styles:
                      card:
                        - --status-accent: var(--green)
                  - type: custom:button-card
                    template: family_washer_status
                    label: |
                      [[[
                        if (!entity || entity.state === 'unavailable') {
                          return 'Connects automatically when powered on';
                        }
                        const remaining = states['sensor.front_load_washer_remaining_time'];
                        if (remaining && !['unknown', 'unavailable'].includes(remaining.state)) {
                          const end = new Date(remaining.state);
                          const minutes = Math.ceil((end.getTime() - Date.now()) / 60000);
                          if (Number.isFinite(minutes) && minutes > 0) {
                            if (minutes < 60) return `${minutes} min remaining`;
                            const hours = Math.floor(minutes / 60);
                            const rest = minutes % 60;
                            return `${hours} hr${hours === 1 ? '' : 's'}${rest ? ` ${rest} min` : ''} remaining`;
                          }
                        }
                        const total = states['sensor.front_load_washer_total_time'];
                        const minutes = Number(total?.state);
                        return Number.isFinite(minutes) && minutes > 0
                          ? `${minutes} min cycle`
                          : 'No active cycle';
                      ]]]
