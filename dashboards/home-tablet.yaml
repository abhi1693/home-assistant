kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  family_status:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 10px
      card:
        - background: var(--contrast2)
        - border-radius: 20px
        - box-shadow: none
        - padding: 12px 14px
        - height: 74px
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 30px
        - height: 30px
        - border-radius: 12px
        - background: var(--contrast4)
      icon:
        - width: 17px
        - color: var(--status-accent, var(--blue))
      name:
        - align-self: end
        - justify-self: start
        - color: var(--contrast10)
        - font-size: 11px
        - font-weight: 500
      state:
        - align-self: start
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 16px
        - font-weight: 650
        - line-height: 18px

  family_temperature:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state} °C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)} °C`;
      ]]]

  family_fans_status:
    template: family_status
    state_display: |
      [[[
        const ids = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
          'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
          'fan.dining_fan', 'fan.living_room_fan_1',
          'fan.living_room_fan_2'];
        const fans = ids.map((id) => states[id]).filter(Boolean);
        const available = fans.filter((fan) => fan.state !== 'unavailable');
        if (!available.length) return 'Unavailable';
        const running = available.filter((fan) => fan.state === 'on').length;
        return running ? `${running} running` : 'All off';
      ]]]

  family_shopping_status:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const count = Number(entity.state);
        if (!Number.isFinite(count)) return entity.state;
        return count === 1 ? '1 item' : `${count} items`;
      ]]]

  family_media:
    template: family_status
    state_display: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state === 'playing') {
          return entity.attributes.media_title || 'Playing now';
        }
        if (entity.state === 'paused') return 'Paused';
        return 'Ready';
      ]]]
    styles:
      card:
        - height: 82px
        - background: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--purple)'
                : 'var(--contrast2)';
            ]]]
      icon:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--black)'
                : 'var(--purple)';
            ]]]
      name:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
      state:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]

  family_room:
    show_icon: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state !== 'on') return 'Fan is off';
        const speed = entity.attributes.percentage;
        return speed == null ? 'Running' : `Running · ${speed}%`;
      ]]]
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: |
            [[[
              if (entity && entity.state === 'on') return variables.accent;
              return 'var(--contrast2)';
            ]]]
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 136px
      img_cell:
        - align-self: start
        - justify-self: end
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - background: |
            [[[
              if (entity && entity.state === 'on') return 'rgba(0, 0, 0, 0.13)';
              return 'var(--contrast4)';
            ]]]
      icon:
        - width: 21px
        - color: |
            [[[
              if (entity && entity.state === 'on') return 'var(--black)';
              if (entity && entity.state === 'unavailable') return 'var(--red)';
              return 'var(--contrast16)';
            ]]]
      name:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]
        - font-size: 16px
        - font-weight: 650
      label:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
        - font-size: 12px
        - font-weight: 500
        - padding-top: 4px

views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # {{ 'Good morning' if now().hour < 12 else 'Good afternoon' if now().hour < 17 else 'Good evening' }}, family
          It is **{{ now().strftime('%A') }}**. Outside is **{{ states('weather.home') | replace('_', ' ') | title }}** at **{{ states('sensor.home_temperature') }} °C**, with {{ states('sensor.home_humidity') }}% humidity.
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 40px; letter-spacing: -1.4px; margin-bottom: 8px; }
            p { color: var(--contrast11); font-size: 16px; line-height: 1.5; }
    badges:
      - type: entity
        entity: person.abhimanyu_saharan
        name: Abhimanyu
        show_name: true
        show_state: true
        color: green
      - type: entity
        entity: sensor.home_temperature
        name: Outside
        show_name: true
        show_state: true
        color: amber
      - type: entity
        entity: sensor.home_humidity
        name: Humidity
        show_name: true
        show_state: true
        color: blue
      - type: entity
        entity: media_player.living_room_speaker
        name: Music
        show_name: true
        show_state: true
        color: purple
    sections:
      - type: grid
        column_span: 3
        cards:
          - &family_navigation
            type: custom:navbar-card
            grid_options:
              columns: 1
              rows: 1
            desktop:
              position: left
              min_width: 768
              show_labels: true
            routes:
              - icon: mdi:home-outline
                icon_selected: mdi:home-heart
                url: /home-tablet/home
                label: Home
              - icon: mdi:sofa-outline
                icon_selected: mdi:sofa
                url: /home-tablet/rooms
                label: Rooms
                badge:
                  show: |
                    [[[
                      const fans = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
                        'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
                        'fan.dining_fan', 'fan.living_room_fan_1',
                        'fan.living_room_fan_2'];
                      return fans.some((id) => states[id]?.state === 'on');
                    ]]]
                  count: |
                    [[[
                      const fans = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
                        'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
                        'fan.dining_fan', 'fan.living_room_fan_1',
                        'fan.living_room_fan_2'];
                      return fans.filter((id) => states[id]?.state === 'on').length;
                    ]]]
                  color: var(--yellow)
              - icon: mdi:cctv
                icon_selected: mdi:video
                url: /home-tablet/cameras
                label: Cameras
              - icon: mdi:music-note-outline
                icon_selected: mdi:music
                url: /home-tablet/music
                label: Music
                badge:
                  show: |
                    [[[
                      return ['media_player.abhimanyu_s_echo_2',
                        'media_player.abhimanyu_s_echo_dot_2',
                        'media_player.living_room_speaker']
                        .some((id) => states[id]?.state === 'playing');
                    ]]]
                  color: var(--green)
            styles: |
              .navbar {
                --navbar-primary-color: var(--purple);
                background: var(--contrast2);
                border: 1px solid var(--contrast4);
                border-radius: 30px;
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
              }
          - type: grid
            square: false
            columns: 6
            cards:
              - type: custom:button-card
                template: family_temperature
                entity: sensor.home_temperature
                name: Outside
                icon: mdi:thermometer
                styles:
                  card:
                    - --status-accent: var(--orange)
              - type: custom:button-card
                template: family_temperature
                entity: sensor.home_apparent_temperature
                name: Feels like
                icon: mdi:sun-thermometer-outline
                styles:
                  card:
                    - --status-accent: var(--yellow)
              - type: custom:button-card
                template: family_status
                entity: sensor.home_humidity
                name: Humidity
                icon: mdi:water-percent
                styles:
                  card:
                    - --status-accent: var(--blue)
              - type: custom:button-card
                template: family_fans_status
                entity: fan.living_room_fan_1
                name: Fans
                icon: mdi:fan
                styles:
                  card:
                    - --status-accent: var(--teal)
              - type: custom:button-card
                template: family_status
                entity: media_player.living_room_speaker
                name: Music
                icon: mdi:music-note
                styles:
                  card:
                    - --status-accent: var(--purple)
              - type: custom:button-card
                template: family_shopping_status
                entity: todo.shopping_list
                name: Shopping
                icon: mdi:cart-outline
                styles:
                  card:
                    - --status-accent: var(--pink)
            grid_options:
              columns: 36
              rows: 2
          - type: heading
            heading: Camera wall
            heading_style: title
            icon: mdi:cctv
