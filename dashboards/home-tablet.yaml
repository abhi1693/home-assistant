                color: green
                tap_action:
                  action: navigate
                  navigation_path: /home-tablet/cameras
          - type: grid
            square: false
            columns: 3
            cards:
              - type: picture-entity
                entity: camera.living_room_high_resolution_channel
                name: Living room
                camera_view: auto
                fit_mode: cover
                aspect_ratio: "16:9"
