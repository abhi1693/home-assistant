kiosk_mode:
  hide_header: true

button_card_templates:
  family_status:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 10px
      card:
        - background: var(--contrast2)
        - border-radius: 20px
        - box-shadow: none
        - padding: 12px 14px
        - height: 68px
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 30px
        - height: 30px
        - border-radius: 12px
        - background: var(--contrast4)
      icon:
        - width: 17px
        - color: var(--status-accent, var(--blue))
      name:
        - align-self: end
        - justify-self: start
        - color: var(--contrast10)
        - font-size: 10px
        - font-weight: 500
      state:
        - align-self: start
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 14px
        - font-weight: 650
        - line-height: 18px

  family_room:
    show_icon: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state !== 'on') return 'Fan is off';
        const speed = entity.attributes.percentage;
        return speed == null ? 'Running' : `Running · ${speed}%`;
      ]]]
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: |
            [[[
              if (entity && entity.state === 'on') return variables.accent;
              return 'var(--contrast2)';
            ]]]
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 136px
      img_cell:
        - align-self: start
        - justify-self: end
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - background: |
            [[[
              if (entity && entity.state === 'on') return 'rgba(0, 0, 0, 0.13)';
              return 'var(--contrast4)';
            ]]]
      icon:
        - width: 21px
        - color: |
            [[[
              if (entity && entity.state === 'on') return 'var(--black)';
              if (entity && entity.state === 'unavailable') return 'var(--red)';
              return 'var(--contrast16)';
            ]]]
      name:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]
        - font-size: 15px
        - font-weight: 650
      label:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
        - font-size: 11px
        - font-weight: 500
        - padding-top: 4px

views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # {{ 'Good morning' if now().hour < 12 else 'Good afternoon' if now().hour < 17 else 'Good evening' }}, family
          It is **{{ now().strftime('%A') }}**. Outside is **{{ states('weather.home') | replace('_', ' ') | title }}** at **{{ states('sensor.home_temperature') }}°**, with {{ states('sensor.home_humidity') }}% humidity.
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 32px; letter-spacing: -1.2px; margin-bottom: 6px; }
            p { color: var(--contrast11); font-size: 14px; }
    badges:
      - type: entity
        entity: person.abhimanyu_saharan
        name: Abhimanyu
        show_name: true
        show_state: true
        color: green
      - type: entity
        entity: sensor.home_temperature
        name: Outside
        show_name: true
        show_state: true
        color: amber
      - type: entity
        entity: sensor.home_humidity
        name: Humidity
        show_name: true
        show_state: true
        color: blue
      - type: entity
        entity: sensor.jellyfin_5876476948_vc8dc_active_clients
        name: Jellyfin
        show_name: true
        show_state: true
        color: purple
    sections:
      - type: grid
        column_span: 3
        cards:
          - &family_navigation
            type: custom:navbar-card
            desktop:
              position: left
              min_width: 768
              show_labels: true
            routes:
              - icon: mdi:home-outline
                icon_selected: mdi:home-heart
                url: /home-tablet/home
                label: Home
              - icon: mdi:sofa-outline
                icon_selected: mdi:sofa
                url: /home-tablet/rooms
                label: Rooms
                badge:
                  show: |
                    [[[
                      const fans = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
                        'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
                        'fan.dining_fan', 'fan.living_room_fan_1',
                        'fan.living_room_fan_2'];
                      return fans.some((id) => states[id]?.state === 'on');
                    ]]]
                  count: |
                    [[[
                      const fans = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
                        'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
                        'fan.dining_fan', 'fan.living_room_fan_1',
                        'fan.living_room_fan_2'];
                      return fans.filter((id) => states[id]?.state === 'on').length;
                    ]]]
                  color: var(--yellow)
              - icon: mdi:cctv
                icon_selected: mdi:video
                url: /home-tablet/cameras
                label: Cameras
              - icon: mdi:music-note-outline
                icon_selected: mdi:music
                url: /home-tablet/music
                label: Music
                badge:
                  show: |
                    [[[
                      return ['media_player.abhimanyu_s_echo_2',
                        'media_player.abhimanyu_s_echo_dot_2',
                        'media_player.living_room_speaker']
                        .some((id) => states[id]?.state === 'playing');
                    ]]]
                  color: var(--green)
            styles: |
              .navbar {
                --navbar-primary-color: var(--purple);
                background: var(--contrast2);
                border: 1px solid var(--contrast4);
              }
          - type: grid
            square: false
            columns: 6
            cards:
              - type: custom:button-card
                template: family_status
                entity: sensor.home_temperature
                name: Outside
                icon: mdi:thermometer
                styles:
                  card:
                    - --status-accent: var(--orange)
              - type: custom:button-card
                template: family_status
                entity: sensor.home_apparent_temperature
                name: Feels like
                icon: mdi:sun-thermometer-outline
                styles:
                  card:
                    - --status-accent: var(--yellow)
              - type: custom:button-card
                template: family_status
                entity: sensor.home_humidity
                name: Humidity
                icon: mdi:water-percent
                styles:
                  card:
                    - --status-accent: var(--blue)
              - type: custom:button-card
                template: family_status
                entity: sensor.jellyfin_5876476948_vc8dc_active_clients
                name: Jellyfin
                icon: mdi:jellyfish
                styles:
                  card:
                    - --status-accent: var(--purple)
              - type: custom:button-card
                template: family_status
                entity: person.abhimanyu_saharan
                name: Presence
                icon: mdi:account-circle-outline
                styles:
                  card:
                    - --status-accent: var(--green)
              - type: custom:button-card
                template: family_status
                entity: sensor.moon_phase
                name: Moon
                icon: mdi:moon-waning-crescent
                styles:
                  card:
                    - --status-accent: var(--purple)
            grid_options:
              columns: 12
              rows: 2
          - type: heading
            heading: Camera wall
            heading_style: title
            icon: mdi:cctv
            badges:
              - type: entity
                entity: camera.living_room_high_resolution_channel
                name: 3 live views
                show_state: false
                icon: mdi:video-outline
                color: green
                tap_action:
                  action: navigate
                  navigation_path: /home-tablet/cameras
          - type: vertical-stack
            cards:
              - type: picture-entity
                entity: camera.living_room_high_resolution_channel
                name: Living room
                camera_view: auto
                fit_mode: cover
                aspect_ratio: "16:7"
                show_state: false
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { overflow: hidden; border-radius: 28px; }
              - type: grid
                square: false
                columns: 2
                cards:
                  - type: picture-entity
                    entity: camera.hallway_high_resolution_channel
                    name: Hallway
                    camera_view: auto
                    fit_mode: cover
                    aspect_ratio: "16:8"
                    show_state: false
                    tap_action:
                      action: more-info
                  - type: picture-entity
                    entity: camera.g5_turret_ultra_high_resolution_channel
                    name: Outside
                    camera_view: auto
                    fit_mode: cover
                    aspect_ratio: "16:8"
                    show_state: false
                    tap_action:
                      action: more-info
            grid_options:
              columns: 12
              rows: auto
          - type: heading
            heading: Around the house
            icon: mdi:play-circle-outline
          - type: grid
            square: false
            columns: 3
            cards:
              - type: media-control
                entity: media_player.abhimanyu_s_echo_2
                name: Echo
              - type: media-control
                entity: media_player.abhimanyu_s_echo_dot_2
                name: Echo Dot
              - type: media-control
                entity: media_player.living_room_speaker
                name: Living room
          - type: heading
            heading: Family board
            icon: mdi:calendar-heart
          - type: grid
            square: false
            columns: 2
            cards:
              - type: todo-list
                entity: todo.shopping_list
                title: Shopping list
              - type: calendar
                title: Family calendar
                initial_view: listWeek
                entities:
                  - calendar.family
      - type: grid
        cards:
          - type: heading
            heading: Rooms
            heading_style: title
            icon: mdi:floor-plan
            badges:
              - type: entity
                entity: fan.office_fan
                name: All controls
                show_state: false
                icon: mdi:arrow-right
                tap_action:
                  action: navigate
                  navigation_path: /home-tablet/rooms
          - type: custom:button-card
            template: family_room
            entity: fan.living_room_fan_1
            name: Living Room
            icon: mdi:sofa-outline
            variables:
              accent: var(--yellow)
            label: |
              [[[
                const first = states['fan.living_room_fan_1'];
                const second = states['fan.living_room_fan_2'];
                const active = [first, second].filter((fan) => fan?.state === 'on');
                if ([first, second].some((fan) => fan?.state === 'unavailable')) {
                  return 'One or more unavailable';
                }
                if (!active.length) return 'Both fans off';
                return `${active.length} fan${active.length > 1 ? 's' : ''} running`;
              ]]]
            tap_action:
              action: navigate
              navigation_path: /home-tablet/rooms
            grid_options:
              columns: 12
              rows: 3
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:button-card
                template: family_room
                entity: fan.master_bedroom_fan
                name: Master Bedroom
                icon: mdi:bed-king-outline
                variables:
                  accent: var(--blue)
              - type: custom:button-card
                template: family_room
                entity: fan.bedroom_fan
                name: Bedroom
                icon: mdi:bed-outline
                variables:
                  accent: var(--purple)
              - type: custom:button-card
                template: family_room
                entity: fan.guest_fan
                name: Guest Room
                icon: mdi:account-box-outline
                variables:
                  accent: var(--pink)
              - type: custom:button-card
                template: family_room
                entity: fan.office_fan
                name: Office
                icon: mdi:desk
                variables:
                  accent: var(--teal)
              - type: custom:button-card
                template: family_room
                entity: fan.kitchen_fan
                name: Kitchen
                icon: mdi:countertop-outline
                variables:
                  accent: var(--orange)
              - type: custom:button-card
                template: family_room
                entity: fan.dining_fan
                name: Dining Room
                icon: mdi:table-chair
                variables:
                  accent: var(--green)

  - title: Rooms
    path: rooms
    icon: mdi:floor-plan
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # Rooms
          Every fan in one quiet, touch-friendly view. Tap power; drag the slider for speed.
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 32px; letter-spacing: -1.2px; margin-bottom: 6px; }
    sections:
      - type: grid
        column_span: 4
        cards:
          - *family_navigation
      - type: grid
        cards:
          - type: heading
            heading: Living Room
            heading_style: title
            icon: mdi:sofa-outline
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: fan.living_room_fan_1
            name: Living Room Fan 1
            icon: mdi:fan
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: fan.living_room_fan_2
            name: Living Room Fan 2
            icon: mdi:fan
            show_state: true
      - type: grid
        cards:
          - type: heading
            heading: Bedrooms
            heading_style: title
            icon: mdi:bed-king-outline
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: fan.master_bedroom_fan
            name: Master Bedroom
            icon: mdi:fan
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: fan.bedroom_fan
            name: Bedroom
            icon: mdi:fan
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: fan.guest_fan
            name: Guest Room
            icon: mdi:fan
            show_state: true
      - type: grid
        cards:
          - type: heading
            heading: Shared spaces
            heading_style: title
            icon: mdi:home-group
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: fan.kitchen_fan
            name: Kitchen
            icon: mdi:fan
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: fan.dining_fan
            name: Dining Room
            icon: mdi:fan
            show_state: true
      - type: grid
        cards:
          - type: heading
            heading: Office
            heading_style: title
            icon: mdi:desk
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: fan.office_fan
            name: Office Fan
            icon: mdi:fan
            show_state: true

  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: sections
    theme: Family Dark
    max_columns: 3
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # Camera wall
          Three live UniFi Protect views, arranged for a quick whole-home glance.
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 32px; letter-spacing: -1.2px; margin-bottom: 6px; }
    sections:
      - type: grid
        column_span: 3
        cards:
          - *family_navigation
          - type: picture-entity
            entity: camera.living_room_high_resolution_channel
            name: Living room
            camera_view: auto
            fit_mode: cover
            aspect_ratio: "16:7"
            show_state: false
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { overflow: hidden; border-radius: 28px; }
          - type: grid
            square: false
            columns: 2
            cards:
              - type: picture-entity
                entity: camera.hallway_high_resolution_channel
                name: Hallway
                camera_view: auto
                fit_mode: cover
                aspect_ratio: "16:8"
                show_state: false
                tap_action:
                  action: more-info
              - type: picture-entity
                entity: camera.g5_turret_ultra_high_resolution_channel
                name: Outside
                camera_view: auto
                fit_mode: cover
                aspect_ratio: "16:8"
                show_state: false
                tap_action:
                  action: more-info

  - title: Music
    path: music
    icon: mdi:music
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # Music
          Browse Music Assistant, then choose where the house should play.
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 32px; letter-spacing: -1.2px; margin-bottom: 6px; }
    badges:
      - type: entity
        entity: sensor.jellyfin_5876476948_vc8dc_active_clients
        name: Jellyfin viewers
        show_name: true
        show_state: true
        color: purple
    sections:
      - type: grid
        column_span: 3
        cards:
          - *family_navigation
          - type: heading
            heading: Music Assistant
            heading_style: title
            icon: mdi:music-circle
            badges:
              - type: entity
                entity: media_player.living_room_speaker
                name: Open full screen
                show_state: false
                icon: mdi:open-in-new
                tap_action:
                  action: url
                  url_path: https://music.media.home
          - type: iframe
            url: https://music.media.home
            aspect_ratio: 60%
            title: Music Assistant
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Players
            heading_style: title
            icon: mdi:speaker-multiple
          - type: media-control
            entity: media_player.abhimanyu_s_echo_2
            name: Echo
          - type: media-control
            entity: media_player.abhimanyu_s_echo_dot_2
            name: Echo Dot
          - type: media-control
            entity: media_player.living_room_speaker
            name: Living room
          - type: heading
            heading: Jellyfin
            icon: mdi:jellyfish
          - type: custom:button-card
            template: family_room
            entity: sensor.jellyfin_5876476948_vc8dc_active_clients
            name: Active clients
            icon: mdi:television-play
            variables:
              accent: var(--purple)
            label: |
              [[[
                if (!entity || entity.state === 'unavailable') return 'Unavailable';
                return Number(entity.state) === 1
                  ? '1 device watching'
                  : `${entity.state} devices watching`;
              ]]]
            tap_action:
              action: url
              url_path: http://watch.media.home
