  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            text_only: true
            content: |-
              # Camera wall
              Medium-resolution live views assigned to your account. Select a camera for high-resolution playback.
            card_mod:
              style: |
                ha-card { background: transparent; padding: 8px 0 4px; }
                h1 { font-size: 40px; letter-spacing: -1.4px; margin-bottom: 8px; }
                p { color: var(--contrast11); font-size: 16px; line-height: 1.5; }
            grid_options:
              columns: 48
              rows: 2
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:auto-entities
                card:
                  type: grid
                  square: false
                  columns: 1
                card_param: cards
                filter:
                  include:
                    - entity_id: camera.g5_turret_ultra_medium_resolution_channel
                      state: idle
                      options:
                        type: picture-entity
                        entity: camera.g5_turret_ultra_high_resolution_channel
                        camera_image: camera.g5_turret_ultra_medium_resolution_channel
                        name: Outside
                        camera_view: live
                        fit_mode: cover
                        aspect_ratio: "16:9"
                        show_state: false
                        tap_action: { action: more-info }
                        card_mod:
                          style: |
                            ha-card { overflow: hidden; border-radius: 28px; }
                    - entity_id: camera.g5_turret_ultra_high_resolution_channel
                      state: unavailable
                      options:
                        type: custom:button-card
                        template: family_camera_offline
                        name: Outside
                show_empty: false
                visibility:
                  - condition: user
                    users: !include ../access/generated/camera-outside-users.json
              - type: custom:auto-entities
                card:
                  type: grid
                  square: false
                  columns: 1
                card_param: cards
                filter:
                  include:
                    - entity_id: camera.living_room_medium_resolution_channel
                      state: idle
                      options:
                        type: picture-entity
                        entity: camera.living_room_high_resolution_channel
                        camera_image: camera.living_room_medium_resolution_channel
                        name: Master Bedroom
                        camera_view: live
                        fit_mode: cover
                        aspect_ratio: "16:9"
                        show_state: false
                        tap_action: { action: more-info }
                        card_mod:
                          style: |
                            ha-card { overflow: hidden; border-radius: 28px; }
                    - entity_id: camera.living_room_high_resolution_channel
                      state: unavailable
                      options:
                        type: custom:button-card
                        template: family_camera_offline
                        name: Master Bedroom
                show_empty: false
                visibility:
                  - condition: user
                    users: !include ../access/generated/camera-master-bedroom-users.json
              - type: custom:auto-entities
                card:
                  type: grid
                  square: false
                  columns: 1
                card_param: cards
                filter:
                  include:
                    - entity_id: camera.hallway_medium_resolution_channel
                      state: idle
                      options:
                        type: picture-entity
                        entity: camera.hallway_high_resolution_channel
                        camera_image: camera.hallway_medium_resolution_channel
                        name: Hallway
                        camera_view: live
                        fit_mode: cover
                        aspect_ratio: "16:9"
                        show_state: false
                        tap_action: { action: more-info }
                        card_mod:
                          style: |
                            ha-card { overflow: hidden; border-radius: 28px; }
                    - entity_id: camera.hallway_high_resolution_channel
                      state: unavailable
                      options:
                        type: custom:button-card
                        template: family_camera_offline
                        name: Hallway
                show_empty: false
                visibility:
                  - condition: user
                    users: !include ../access/generated/camera-hallway-users.json
            visibility:
              - condition: user
                users: !include ../access/generated/camera-any-users.json
            grid_options:
              columns: 48
              rows: auto
      - type: grid
        column_span: 4
        cards:
          - *family_navigation
