                camera_view: auto
                fit_mode: cover
                aspect_ratio: "16:9"
                show_state: false
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { overflow: hidden; border-radius: 28px; }
              - type: picture-entity
                entity: camera.g5_turret_ultra_high_resolution_channel
                name: Outside
                camera_view: auto
                fit_mode: cover
                aspect_ratio: "16:9"
                show_state: false
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { overflow: hidden; border-radius: 28px; }
            grid_options:
              columns: 36
              rows: auto
          - type: heading
            heading: Around the house
            icon: mdi:play-circle-outline
            grid_options:
              columns: 36
              rows: 1
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:button-card
                template: family_media
                entity: media_player.abhimanyu_s_echo_2
                name: Echo
                icon: mdi:speaker
              - type: custom:button-card
                template: family_media
                entity: media_player.abhimanyu_s_echo_dot_2
                name: Echo Dot
                icon: mdi:speaker
              - type: custom:button-card
                template: family_media
                entity: media_player.living_room_speaker
                name: Living room
                icon: mdi:speaker-wireless
            grid_options:
              columns: 36
              rows: 2
          - type: heading
            heading: Family board
            icon: mdi:calendar-heart
            grid_options:
              columns: 36
              rows: 1
          - type: grid
            square: false
            columns: 2
            cards:
              - type: todo-list
                entity: todo.shopping_list
                title: Shopping list
              - type: calendar
                title: Family calendar
                initial_view: listWeek
                entities:
                  - calendar.family
            grid_options:
              columns: 36
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Rooms
            heading_style: title
            icon: mdi:floor-plan
          - type: custom:button-card
            template: family_room
            entity: fan.living_room_fan_1
            name: Living Room
            icon: mdi:sofa-outline
            variables:
              accent: var(--yellow)
            label: |
              [[[
                const first = states['fan.living_room_fan_1'];
                const second = states['fan.living_room_fan_2'];
                const active = [first, second].filter((fan) => fan?.state === 'on');
                if (!first || !second ||
                    [first, second].some((fan) => fan.state === 'unavailable')) {
                  return 'One or more unavailable';
                }
                if (!active.length) return 'Both fans off';
                return `${active.length} fan${active.length > 1 ? 's' : ''} running`;
              ]]]
            tap_action:
              action: navigate
              navigation_path: /home-tablet/rooms
            grid_options:
              columns: 12
              rows: 3
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:button-card
