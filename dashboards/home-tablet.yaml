kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  family_status:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 10px
      card:
        - background: var(--contrast2)
        - border-radius: 20px
        - box-shadow: none
        - padding: 12px 14px
        - height: 74px
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 30px
        - height: 30px
        - border-radius: 12px
        - background: var(--contrast4)
      icon:
        - width: 17px
        - color: var(--status-accent, var(--blue))
      name:
        - align-self: end
        - justify-self: start
        - color: var(--contrast10)
        - font-size: 11px
        - font-weight: 500
      state:
        - align-self: start
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 16px
        - font-weight: 650
        - line-height: 18px

  family_temperature:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state} °C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)} °C`;
      ]]]

  family_fans_status:
    template: family_status
    state_display: |
      [[[
        const ids = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
          'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
          'fan.dining_fan', 'fan.living_room_fan_1',
          'fan.living_room_fan_2'];
        const fans = ids.map((id) => states[id]).filter(Boolean);
        const available = fans.filter((fan) => fan.state !== 'unavailable');
        if (!available.length) return 'Unavailable';
        const running = available.filter((fan) => fan.state === 'on').length;
        return running ? `${running} running` : 'All off';
      ]]]

  family_shopping_status:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const count = Number(entity.state);
        if (!Number.isFinite(count)) return entity.state;
        return count === 1 ? '1 item' : `${count} items`;
      ]]]

  family_ribbon:
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const unit = entity.attributes.unit_of_measurement || '';
        return `${entity.state}${unit}`;
      ]]]
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 24px minmax(0, 1fr)
        - grid-template-rows: 14px 22px
        - column-gap: 10px
        - justify-content: stretch
      card:
        - height: 54px
        - padding: 7px 12px
        - background: none
        - border: none
        - border-radius: 0
        - box-shadow: none
        - --mdc-ripple-press-opacity: 0.06
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 24px
        - height: 24px
      icon:
        - width: 21px
        - color: var(--ribbon-accent, var(--contrast10))
      name:
        - align-self: end
        - justify-self: start
        - max-width: 100%
        - overflow: hidden
        - color: var(--contrast14)
        - font-size: 11px
        - font-weight: 500
        - line-height: 14px
        - text-overflow: ellipsis
        - white-space: nowrap
      label:
        - align-self: start
        - justify-self: start
        - max-width: 100%
        - overflow: hidden
        - color: var(--contrast20)
        - font-size: 16px
        - font-weight: 700
        - line-height: 20px
        - text-overflow: ellipsis
        - white-space: nowrap

  family_ribbon_temperature:
    template: family_ribbon
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state}°C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)}°C`;
      ]]]

  family_ribbon_weather:
    template: family_ribbon
    name: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Weather unavailable';
        }
        const labels = {
          'clear-night': 'Clear night',
          'partlycloudy': 'Partly cloudy',
          'pouring': 'Heavy rain'
        };
        return labels[entity.state]
          || entity.state.replaceAll('_', ' ').replace(/^./, (value) => value.toUpperCase());
      ]]]
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.attributes.temperature);
        if (!Number.isFinite(value)) return 'Unavailable';
        const unit = entity.attributes.temperature_unit;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)}°C`;
      ]]]

  family_ribbon_humidity:
    template: family_ribbon
    entity: sensor.home_humidity
    name: Humidity
    icon: mdi:water-percent
    label: |
      [[[
        const value = Number(entity?.state);
        return Number.isFinite(value) ? `${Math.round(value)}%` : 'Unavailable';
      ]]]
    styles:
      icon:
        - color: var(--blue)

  family_ribbon_air_quality:
    template: family_ribbon
    entity: sensor.home_naqi_in_aqi
    name: Air quality
    icon: mdi:air-filter
    label: |
      [[[
        const value = Number(entity?.state);
        const categoryState = states['sensor.home_naqi_in_category']?.state;
        const categories = {
          good_air_quality: 'Good',
          satisfactory_air_quality: 'Fair',
          moderate_air_quality: 'Moderate',
          poor_air_quality: 'Poor',
          very_poor_air_quality: 'Very poor',
          severe_air_quality: 'Severe'
        };
        const category = categories[categoryState]
          || (!Number.isFinite(value) ? 'Unavailable'
            : value <= 50 ? 'Good'
              : value <= 100 ? 'Fair'
                : value <= 200 ? 'Moderate'
                  : value <= 300 ? 'Poor'
                    : value <= 400 ? 'Very poor' : 'Severe');
        return Number.isFinite(value) ? `${category} · ${Math.round(value)}` : category;
      ]]]
    styles:
      icon:
        - color: &air_quality_color |
            [[[
              const value = Number(entity?.state);
              if (!Number.isFinite(value)) return 'var(--contrast10)';
              if (value <= 50) return 'var(--green)';
              if (value <= 100) return 'var(--teal)';
              if (value <= 200) return 'var(--yellow)';
              if (value <= 300) return 'var(--orange)';
              return 'var(--red)';
            ]]]
      label:
        - color: *air_quality_color

  family_ribbon_presence:
    template: family_ribbon
    entity: person.abhimanyu_saharan
    name: At home
    icon: mdi:home-heart
    label: |
      [[[
        const people = Object.values(states)
          .filter((item) => item.entity_id.startsWith('person.'));
        const home = people.filter((person) => person.state === 'home');
        if (!home.length) return 'Nobody';
        if (home.length > 2) return `${home.length} people`;
        return home.map((person) => person.attributes.friendly_name).join(' & ');
      ]]]
    styles:
      icon:
        - color: |
            [[[
              const home = Object.values(states).some((item) =>
                item.entity_id.startsWith('person.') && item.state === 'home');
              return home ? 'var(--green)' : 'var(--contrast10)';
            ]]]

  family_ribbon_today:
    template: family_ribbon
    entity: sun.sun
    variables:
      context: |
        [[[
          const washer = states['sensor.front_load_washer_current_status'];
          const washerState = washer?.state?.toLowerCase();
          if (['complete', 'completed', 'finished', 'end'].includes(washerState)) {
            return {
              name: 'Laundry', label: 'Ready to collect',
              icon: 'mdi:washing-machine-alert', color: 'var(--green)'
            };
          }
          const shopping = states['todo.shopping_list'];
          const items = Number(shopping?.state || 0);
          if (items > 0) {
            return {
              name: 'Shopping', label: items === 1 ? '1 item' : `${items} items`,
              icon: 'mdi:cart-outline', color: 'var(--pink)'
            };
          }
          const sun = states['sun.sun'];
          const afterSunset = sun?.state === 'below_horizon';
          const next = sun?.attributes?.[afterSunset ? 'next_rising' : 'next_setting'];
          const transition = next ? new Date(next) : null;
          return {
            name: afterSunset ? 'Sunrise' : 'Sunset',
            label: transition && !Number.isNaN(transition.getTime())
              ? transition.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})
              : 'Later',
            icon: afterSunset ? 'mdi:weather-sunset-up' : 'mdi:weather-sunset-down',
            color: 'var(--yellow)'
          };
        ]]]
    name: '[[[ return variables.context.name; ]]]'
    label: '[[[ return variables.context.label; ]]]'
    icon: '[[[ return variables.context.icon; ]]]'
    styles:
      icon:
        - color: '[[[ return variables.context.color; ]]]'

  family_presence_likelihood:
    show_icon: true
    show_entity_picture: true
    show_name: true
    show_state: false
    show_label: true
    icon: mdi:account-circle
    label: |
      [[[
        const likelihood = Number(states[variables.likelihood_entity]?.state);
        if (!Number.isFinite(likelihood)) return 'Uncertain';
        if (likelihood >= 70) return `Home · ${Math.round(likelihood)}%`;
        if (likelihood <= 30) return `Away · ${Math.round(100 - likelihood)}%`;
        return `Uncertain · ${Math.round(likelihood)}%`;
      ]]]
    custom_fields:
      indicator: |
        [[[
          const likelihood = Number(states[variables.likelihood_entity]?.state);
          const color = !Number.isFinite(likelihood) ? 'var(--contrast8)'
            : likelihood >= 70 ? 'var(--green)'
            : likelihood <= 30 ? 'var(--red)'
            : 'var(--yellow)';
          return `<span style="display:block;width:12px;height:12px;border-radius:50%;background:${color};box-shadow:0 0 0 4px color-mix(in srgb, ${color} 18%, transparent)"></span>`;
        ]]]
      battery: |
        [[[
          const level = Number(states[variables.battery_entity]?.state);
          const batteryState = String(states[variables.battery_state_entity]?.state || '').toLowerCase();
          const charging = batteryState === 'charging';
          const full = batteryState === 'full' || (Number.isFinite(level) && level >= 95);
          const color = charging || full ? 'var(--green)'
            : Number.isFinite(level) && level <= 20 ? 'var(--red)'
            : Number.isFinite(level) && level <= 40 ? 'var(--yellow)'
            : Number.isFinite(level) ? 'var(--blue)'
            : 'var(--contrast8)';
          const icon = charging ? 'mdi:battery-charging'
            : full ? 'mdi:battery'
            : !Number.isFinite(level) ? 'mdi:battery-unknown'
            : `mdi:battery-${Math.max(10, Math.min(90, Math.ceil(level / 10) * 10))}`;
          const value = Number.isFinite(level) ? `${Math.round(level)}%` : '—';
          return `<span style="display:flex;align-items:center;gap:4px;color:${color};white-space:nowrap"><ha-icon icon="${icon}" style="width:18px;height:18px"></ha-icon><strong style="font-size:12px">${value}</strong></span>`;
        ]]]
    tap_action:
      action: more-info
    hold_action: { action: none }
    styles:
      grid:
        - grid-template-areas: '"i n indicator battery" "i l indicator battery"'
        - grid-template-columns: 48px minmax(0, 1fr) 18px min-content
        - grid-template-rows: min-content min-content
        - column-gap: 12px
      card:
        - min-height: 76px
        - padding: 12px 14px
        - border-radius: 22px
        - background: var(--contrast2)
        - border: 1px solid rgba(var(--rgb-primary-text-color), 0.06)
        - box-shadow: none
      img_cell:
        - width: 46px
        - height: 46px
        - border-radius: 50%
        - overflow: hidden
        - background: var(--contrast4)
      icon:
        - width: 30px
        - color: '[[[ return variables.avatar_color || "var(--blue)"; ]]]'
      entity_picture:
        - width: 46px
        - height: 46px
        - object-fit: cover
      name:
        - justify-self: start
        - font-size: 15px
        - font-weight: 700
        - color: var(--contrast20)
      label:
        - justify-self: start
        - font-size: 12px
        - color: var(--contrast10)
      custom_fields:
        indicator:
          - align-self: center
          - justify-self: end
        battery:
          - align-self: center
          - justify-self: end

  family_ribbon_activity:
    template: family_ribbon
    entity: sensor.jellyfin_5876476948_vc8dc_active_clients
    variables:
      context: |
        [[[
          const watching = Number(entity?.state || 0);
          if (watching > 0) return {
            name: 'Jellyfin', label: watching === 1 ? '1 person watching' : `${watching} people watching`,
            icon: 'mdi:jellyfish', color: 'var(--purple)'
          };
          const playing = Object.values(states).find((item) =>
            (item.entity_id.startsWith('media_player.')
              || item.entity_id.startsWith('sensor.music_assistant_session_'))
            && item.state === 'playing');
          if (playing) return {
            name: 'Playing',
            label: playing.attributes.media_title || playing.attributes.friendly_name,
            icon: 'mdi:music-note', color: 'var(--purple)'
          };
          const fanIds = ['fan.master_bedroom_fan', 'fan.bedroom_fan', 'fan.guest_fan',
            'fan.office_fan', 'fan.kitchen_fan', 'fan.dining_fan',
            'fan.living_room_fan_1', 'fan.living_room_fan_2'];
          const running = fanIds.filter((id) => states[id]?.state === 'on').length;
          if (running > 0) return {
            name: 'Fans', label: running === 1 ? '1 room cooling' : `${running} fans running`,
            icon: 'mdi:fan', color: 'var(--blue)'
          };
          return {
            name: 'Activity', label: 'All quiet',
            icon: 'mdi:home-outline', color: 'var(--contrast10)'
          };
        ]]]
    name: '[[[ return variables.context.name; ]]]'
    label: '[[[ return variables.context.label; ]]]'
    icon: '[[[ return variables.context.icon; ]]]'
    styles:
      icon:
        - color: '[[[ return variables.context.color; ]]]'

  family_ribbon_attention:
    template: family_ribbon
    entity: sensor.house_attention_level
    variables:
      context: |
        [[[
          if (entity && ['critical', 'warning'].includes(entity.state)) return {
            name: entity.state === 'critical' ? 'Act now' : 'Attention',
            label: entity.attributes?.primary_reason || 'Open Security',
            icon: 'mdi:shield-alert-outline',
            color: entity.state === 'critical' ? 'var(--red)' : 'var(--orange)'
          };
          const storm = Number(states['sensor.home_thunderstorm_probability']?.state);
          if (Number.isFinite(storm) && storm >= 30) return {
            name: 'Storm chance', label: `${Math.round(storm)}%`,
            icon: 'mdi:weather-lightning-rainy', color: storm >= 60 ? 'var(--red)' : 'var(--yellow)'
          };
          const phoneBatteryEntity = user?.id === '8117b77542614a06b4672a8ae1a979b5'
            ? 'sensor.pixel_10_pro_battery_level'
            : user?.id === '734722ec932a41a68d47553b6c2f7f5d'
              ? 'sensor.iphone_battery_level'
            : user?.id === '9302d11f48c64fe796a3c9e5cb563650'
                ? 'sensor.pixel_8_battery_level'
                : null;
          const battery = Number(states[phoneBatteryEntity]?.state);
          if (phoneBatteryEntity && Number.isFinite(battery) && battery < 25) return {
            name: 'Phone battery', label: `${Math.round(battery)}%`,
            icon: 'mdi:battery-alert-variant-outline', color: 'var(--red)'
          };
          const apparent = Number(states['sensor.home_apparent_temperature']?.state);
          if (Number.isFinite(apparent) && apparent >= 38) return {
            name: 'Feels like', label: `${Math.round(apparent)}°C`,
            icon: 'mdi:sun-thermometer-outline', color: 'var(--orange)'
          };
          return {
            name: 'Today',
            label: new Date().toLocaleDateString([], {weekday: 'short', day: 'numeric', month: 'short'}),
            icon: 'mdi:calendar-today-outline', color: 'var(--contrast10)'
          };
        ]]]
    name: '[[[ return variables.context.name; ]]]'
    label: '[[[ return variables.context.label; ]]]'
    icon: '[[[ return variables.context.icon; ]]]'
    styles:
      icon:
        - color: '[[[ return variables.context.color; ]]]'

  family_ribbon_sunset:
    template: family_ribbon
    entity: sensor.sun_next_setting
    name: Sunset
    icon: mdi:weather-sunset-down
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const setting = new Date(entity.state);
        if (Number.isNaN(setting.getTime())) return 'Unavailable';
        return setting.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      ]]]
    styles:
      icon:
        - color: var(--yellow)

  family_ribbon_alarm:
    template: family_ribbon
    name: Alarm
    icon: mdi:alarm
    label: |
      [[[
        const alarmEntityId = user?.id === '9302d11f48c64fe796a3c9e5cb563650'
          ? 'sensor.pixel_8_next_alarm'
          : user?.id === '8117b77542614a06b4672a8ae1a979b5'
            ? 'sensor.pixel_10_pro_next_alarm'
            : null;
        const alarmEntity = alarmEntityId ? states[alarmEntityId] : null;
        if (!alarmEntity || ['unknown', 'unavailable', 'none', ''].includes(alarmEntity.state)) {
          return 'No alarm';
        }
        const alarm = new Date(alarmEntity.state);
        if (Number.isNaN(alarm.getTime()) || alarm <= new Date()) return 'No alarm';
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const alarmDay = new Date(alarm.getFullYear(), alarm.getMonth(), alarm.getDate());
        const days = Math.round((alarmDay - today) / 86400000);
        const time = alarm.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        if (days === 0) return `Today · ${time}`;
        if (days === 1) return `Tomorrow · ${time}`;
        if (days > 1 && days < 7) {
          return `${alarm.toLocaleDateString([], { weekday: 'short' })} · ${time}`;
        }
        return `${alarm.toLocaleDateString([], { day: 'numeric', month: 'short' })} · ${time}`;
      ]]]
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      icon:
        - color: var(--purple)

  health_metric:
    show_icon: true
    show_name: true
    show_state: true
    show_label: true
    state_display: |
      [[[
        const value = Number(entity?.state);
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)
            || !Number.isFinite(value)) return '—';
        if (variables.format === 'steps') return Math.round(value).toLocaleString();
        if (variables.format === 'distance') {
          return value >= 1000 ? `${(value / 1000).toFixed(1)} km` : `${Math.round(value)} m`;
        }
        if (variables.format === 'calories') return `${Math.round(value).toLocaleString()} kcal`;
        if (variables.format === 'heart') return `${Math.round(value)} bpm`;
        if (variables.format === 'percent') return `${Math.round(value)}%`;
        if (variables.format === 'duration') {
          const hours = Math.floor(value / 60);
          const minutes = Math.round(value % 60);
          return hours ? `${hours}h ${minutes}m` : `${minutes}m`;
        }
        const unit = entity.attributes?.unit_of_measurement || '';
        return `${Math.round(value)}${unit ? ` ${unit}` : ''}`;
      ]]]
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Waiting for data';
        }
        const raw = entity.attributes?.date
          || entity.attributes?.endTime
          || entity.attributes?.timestamp
          || entity.last_updated;
        const measured = typeof raw === 'number' ? new Date(raw) : new Date(raw);
        if (Number.isNaN(measured.getTime())) return 'Latest reading';
        const minutes = Math.max(0, Math.floor((Date.now() - measured.getTime()) / 60000));
        if (minutes < 2) return 'Just updated';
        if (minutes < 60) return `${minutes} min ago`;
        if (minutes < 1440) return `${Math.floor(minutes / 60)} hr ago`;
        return measured.toLocaleDateString([], {day: 'numeric', month: 'short'});
      ]]]
    tap_action: { action: more-info }
    hold_action: { action: none }
    styles:
      grid:
        - grid-template-areas: '"i n" "i s" "i l"'
        - grid-template-columns: 48px minmax(0, 1fr)
        - grid-template-rows: min-content min-content min-content
        - column-gap: 12px
      card:
        - min-height: 104px
        - padding: 14px 16px
        - border-radius: 22px
        - background: var(--contrast2)
        - border: 1px solid rgba(var(--rgb-primary-text-color), 0.06)
        - box-shadow: none
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 15px
        - background: color-mix(in srgb, var(--health-accent) 16%, transparent)
      icon:
        - width: 24px
        - color: var(--health-accent)
      name:
        - justify-self: start
        - color: var(--contrast11)
        - font-size: 12px
        - font-weight: 600
      state:
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 18px
        - font-weight: 750
        - line-height: 22px
      label:
        - justify-self: start
        - color: var(--contrast9)
        - font-size: 11px

  family_commute:
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    name: |
      [[[
        if (variables.traveler) return `${variables.traveler} → ${variables.destination || 'Home'}`;
        return variables.destination || 'Commute';
      ]]]
    icon: |
      [[[
        return variables.icon || 'mdi:car-clock';
      ]]]
    label: |
      [[[
        const minutes = Number(entity?.state);
        if (!Number.isFinite(minutes)) return '—';
        const duration = `${Math.round(minutes)} min`;
        if (!variables.arrival_eta) return duration;
        const arrival = new Date(Date.now() + minutes * 60000);
        const time = new Intl.DateTimeFormat(undefined, {
          hour: 'numeric',
          minute: '2-digit'
        }).format(arrival);
        return `${duration} · ${time}`;
      ]]]
    tap_action:
      action: more-info
    hold_action:
      action: none
    styles:
      grid:
        - grid-template-areas: '"i n l"'
        - grid-template-columns: 42px minmax(0, 1fr) max-content
