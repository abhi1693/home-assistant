            card:
              - height: 58px
              - background: transparent
              - --launcher-accent: var(--purple)
      jellyfin:
        card:
          type: custom:button-card
          template: family_launcher
          name: Open Jellyfin
          icon: mdi:jellyfish
          tap_action:
            action: url
            url_path: http://watch.media.home
