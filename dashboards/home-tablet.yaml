                    const end = new Date(remaining.state);
                    const minutes = Math.ceil((end.getTime() - Date.now()) / 60000);
                    if (Number.isFinite(minutes) && minutes > 0) return minutes < 60
                      ? `${minutes} min remaining` : `${Math.floor(minutes / 60)} hr ${minutes % 60} min remaining`;
