                  --todo-swipe-card-checkbox-checked-color: var(--pink);
                  --todo-swipe-card-title-background: transparent;
                  --todo-swipe-card-title-color: var(--primary-text-color);
                  --todo-swipe-card-title-font-weight: 650;
                  --todo-swipe-card-add-button-color: var(--pink);
                  --todo-swipe-card-delete-button-color: var(--red);
                }
                ha-card {
                  background: var(--contrast2);
                  border: 1px solid rgba(var(--rgb-primary-text-color), 0.06);
                  border-radius: 24px;
                  box-shadow: none;
                  overflow: hidden;
                }

