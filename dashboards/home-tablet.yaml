          Browse Music Assistant, then choose where the house should play.
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 40px; letter-spacing: -1.4px; margin-bottom: 8px; }
            p { color: var(--contrast11); font-size: 16px; line-height: 1.5; }
    badges:
      - type: entity
        entity: sensor.jellyfin_5876476948_vc8dc_active_clients
        name: Jellyfin viewers
        show_name: true
        show_state: true
        color: purple
    sections:
      - type: grid
        column_span: 3
