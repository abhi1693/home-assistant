kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  family_status:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 10px
      card:
        - background: var(--contrast2)
        - border-radius: 20px
        - box-shadow: none
        - padding: 12px 14px
        - height: 74px
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 30px
        - height: 30px
        - border-radius: 12px
        - background: var(--contrast4)
      icon:
        - width: 17px
        - color: var(--status-accent, var(--blue))
      name:
        - align-self: end
        - justify-self: start
        - color: var(--contrast10)
        - font-size: 11px
        - font-weight: 500
      state:
        - align-self: start
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 16px
        - font-weight: 650
        - line-height: 18px

  family_temperature:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state} °C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)} °C`;
      ]]]

  family_fans_status:
    template: family_status
    state_display: |
      [[[
        const ids = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
          'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
          'fan.dining_fan', 'fan.living_room_fan_1',
          'fan.living_room_fan_2'];
        const fans = ids.map((id) => states[id]).filter(Boolean);
        const available = fans.filter((fan) => fan.state !== 'unavailable');
        if (!available.length) return 'Unavailable';
        const running = available.filter((fan) => fan.state === 'on').length;
        return running ? `${running} running` : 'All off';
      ]]]

  family_shopping_status:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const count = Number(entity.state);
        if (!Number.isFinite(count)) return entity.state;
        return count === 1 ? '1 item' : `${count} items`;
      ]]]

  family_ribbon:
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const unit = entity.attributes.unit_of_measurement || '';
        return `${entity.state}${unit}`;
      ]]]
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 24px max-content
        - grid-template-rows: 14px 22px
        - column-gap: 10px
        - justify-content: center
      card:
        - height: 54px
        - padding: 7px 12px
        - background: none
        - border: none
        - border-radius: 0
        - box-shadow: none
        - --mdc-ripple-press-opacity: 0.06
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 24px
        - height: 24px
      icon:
        - width: 21px
        - color: var(--ribbon-accent, var(--contrast10))
      name:
        - align-self: end
        - justify-self: start
        - max-width: 130px
        - overflow: hidden
        - color: var(--contrast14)
        - font-size: 11px
        - font-weight: 500
        - line-height: 14px
        - text-overflow: ellipsis
        - white-space: nowrap
      label:
        - align-self: start
        - justify-self: start
        - max-width: 130px
        - overflow: hidden
        - color: var(--contrast20)
        - font-size: 16px
        - font-weight: 700
        - line-height: 20px
        - text-overflow: ellipsis
        - white-space: nowrap

  family_ribbon_temperature:
    template: family_ribbon
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state}°C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)}°C`;
      ]]]

  family_ribbon_weather:
    template: family_ribbon
    name: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Weather unavailable';
        }
        const labels = {
          'clear-night': 'Clear night',
          'partlycloudy': 'Partly cloudy',
          'pouring': 'Heavy rain'
        };
        return labels[entity.state]
          || entity.state.replaceAll('_', ' ').replace(/^./, (value) => value.toUpperCase());
      ]]]
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.attributes.temperature);
        if (!Number.isFinite(value)) return 'Unavailable';
        const unit = entity.attributes.temperature_unit;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)}°C`;
      ]]]

  family_ribbon_presence:
    template: family_ribbon
    entity: person.abhimanyu_saharan
    name: At home
    icon: mdi:home-heart
    label: |
      [[[
        const people = Object.values(states)
          .filter((item) => item.entity_id.startsWith('person.'));
        const home = people.filter((person) => person.state === 'home');
        if (!home.length) return 'Nobody';
        if (home.length > 2) return `${home.length} people`;
        return home.map((person) => person.attributes.friendly_name).join(' & ');
      ]]]
    styles:
      icon:
        - color: |
            [[[
              const home = Object.values(states).some((item) =>
                item.entity_id.startsWith('person.') && item.state === 'home');
              return home ? 'var(--green)' : 'var(--contrast10)';
            ]]]

  family_ribbon_context:
    template: family_ribbon
    entity: sensor.home_state
    variables:
      context: |
        [[[
          const jellyfin = states['sensor.jellyfin_5876476948_vc8dc_active_clients'];
          const watching = Number(jellyfin?.state || 0);
          if (watching > 0) {
            return {
              name: 'Jellyfin',
              label: watching === 1 ? '1 watching' : `${watching} watching`,
              icon: 'mdi:jellyfish',
              color: 'var(--purple)'
            };
          }
          const playing = Object.values(states).find((item) =>
            item.entity_id.startsWith('media_player.') && item.state === 'playing');
          if (playing) {
            return {
              name: 'Now playing',
              label: playing.attributes.media_title || playing.attributes.friendly_name,
              icon: 'mdi:music-note',
              color: 'var(--purple)'
            };
          }
          const shopping = states['todo.shopping_list'];
          const items = Number(shopping?.state || 0);
          if (items > 0) {
            return {
              name: 'Shopping',
              label: items === 1 ? '1 item' : `${items} items`,
              icon: 'mdi:cart-outline',
              color: 'var(--pink)'
            };
          }
          const calendar = states['calendar.family'];
          if (calendar?.state === 'on' && calendar.attributes.message) {
            return {
              name: 'Family now',
              label: calendar.attributes.message,
              icon: 'mdi:calendar-heart',
              color: 'var(--blue)'
            };
          }
          const online = entity?.state === 'connected';
          return {
            name: 'Internet',
            label: online ? 'Online' : 'Needs attention',
            icon: online ? 'mdi:wifi' : 'mdi:wifi-alert',
            color: online ? 'var(--green)' : 'var(--red)'
          };
        ]]]
    name: '[[[ return variables.context.name; ]]]'
    label: '[[[ return variables.context.label; ]]]'
    icon: '[[[ return variables.context.icon; ]]]'
    styles:
      icon:
        - color: '[[[ return variables.context.color; ]]]'

  family_ribbon_sunset:
    template: family_ribbon
    entity: sensor.sun_next_setting
    name: Sunset
    icon: mdi:weather-sunset-down
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const setting = new Date(entity.state);
        if (Number.isNaN(setting.getTime())) return 'Unavailable';
        return setting.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      ]]]
    styles:
      icon:
        - color: var(--yellow)

  family_media:
    template: family_status
    state_display: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state === 'playing') {
          return entity.attributes.media_title || 'Playing now';
        }
        if (entity.state === 'paused') return 'Paused';
        return 'Ready';
      ]]]
    styles:
      card:
        - height: 82px
        - background: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--purple)'
                : 'var(--contrast2)';
            ]]]
      icon:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--black)'
                : 'var(--purple)';
            ]]]
      name:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
      state:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]

  family_room:
    show_icon: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state !== 'on') return 'Fan is off';
        const speed = entity.attributes.percentage;
        return speed == null ? 'Running' : `Running · ${speed}%`;
      ]]]
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: |
            [[[
              if (entity && entity.state === 'on') return variables.accent;
              return 'var(--contrast2)';
            ]]]
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 136px
      img_cell:
        - align-self: start
        - justify-self: end
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - background: |
            [[[
              if (entity && entity.state === 'on') return 'rgba(0, 0, 0, 0.13)';
              return 'var(--contrast4)';
            ]]]
      icon:
        - width: 21px
        - color: |
            [[[
              if (entity && entity.state === 'on') return 'var(--black)';
              if (entity && entity.state === 'unavailable') return 'var(--red)';
              return 'var(--contrast16)';
            ]]]
      name:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]
        - font-size: 16px
        - font-weight: 650
      label:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
        - font-size: 12px
        - font-weight: 500
        - padding-top: 4px

  family_home_room:
    show_icon: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Fan offline';
        if (entity.state !== 'on') return 'Off';
        const speed = entity.attributes.percentage;
        return speed == null ? 'Running' : `Running · ${speed}%`;
      ]]]
    tap_action:
      action: more-info
    hold_action:
      action: none
    styles:
      grid:
        - grid-template-areas: '"i power" "n power" "l power"'
        - grid-template-columns: 1fr 44px
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: |
            [[[
              return entity && entity.state === 'on'
                ? variables.accent
                : 'var(--contrast2)';
            ]]]
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 116px
      img_cell:
        - align-self: start
        - justify-self: start
        - width: 34px
        - height: 34px
        - border-radius: 12px
        - background: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.13)'
                : 'var(--contrast4)';
            ]]]
      icon:
        - width: 19px
        - color: |
            [[[
              if (entity && entity.state === 'on') return 'var(--black)';
              if (entity && entity.state === 'unavailable') return 'var(--red)';
              return 'var(--contrast16)';
            ]]]
      name:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]
        - font-size: 15px
        - font-weight: 650
      label:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
        - font-size: 11px
        - font-weight: 500
        - padding-top: 3px
      custom_fields:
        power:
          - align-self: center
          - justify-self: end
    custom_fields:
      power:
        card:
          type: custom:button-card
          entity: '[[[ return variables.power_entity; ]]]'
          show_name: false
          show_state: false
          icon: |
            [[[
              return entity && entity.state === 'on'
                ? 'mdi:power'
                : 'mdi:power-standby';
            ]]]
          tap_action:
            action: toggle
          hold_action:
            action: none
          styles:
            card:
              - width: 40px
              - height: 40px
              - border-radius: 50%
              - box-shadow: none
              - background: |
                  [[[
                    if (!entity || entity.state === 'unavailable') {
                      return 'var(--contrast3)';
                    }
                    return entity.state === 'on'
                      ? 'rgba(0, 0, 0, 0.16)'
                      : 'var(--contrast4)';
                  ]]]
              - pointer-events: |
                  [[[
                    return !entity || entity.state === 'unavailable'
                      ? 'none'
                      : 'auto';
                  ]]]
              - opacity: |
                  [[[
                    return !entity || entity.state === 'unavailable' ? '0.42' : '1';
                  ]]]
            icon:
              - width: 19px
              - color: |
                  [[[
                    return entity && entity.state === 'on'
                      ? 'var(--black)'
                      : 'var(--contrast16)';
                  ]]]

  family_camera_offline:
    show_icon: true
    show_name: true
    show_state: false
    icon: mdi:video-off-outline
    tap_action:
      action: none
    styles:
      card:
        - height: auto
        - aspect-ratio: 16 / 9
        - min-height: 174px
        - border-radius: 28px
        - background: var(--contrast2)
        - box-shadow: none
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr min-content
      img_cell:
        - align-self: center
        - width: 52px
        - height: 52px
        - border-radius: 50%
        - background: var(--contrast4)
      icon:
        - width: 25px
        - color: var(--contrast9)
      name:
        - justify-self: start
        - padding: 0 18px 16px
        - color: var(--contrast12)
        - font-size: 14px
        - font-weight: 600

  family_now_playing:
    show_icon: true
    show_entity_picture: true
    show_name: true
    show_state: true
    name: |
      [[[
        return entity?.attributes.media_series_title
          || entity?.attributes.media_artist
          || entity?.attributes.friendly_name
          || 'Now playing';
      ]]]
    state_display: |
      [[[
        if (!entity) return 'Unavailable';
        const title = entity.attributes.media_title;
        return title || (entity.state === 'paused' ? 'Paused' : 'Playing now');
      ]]]
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 62px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 13px
      card:
        - height: 88px
        - padding: 12px
        - border-radius: 24px
        - background: var(--contrast2)
        - box-shadow: none
      img_cell:
        - width: 62px
        - height: 62px
        - border-radius: 17px
        - background: var(--contrast4)
        - overflow: hidden
      entity_picture:
        - width: 100%
        - height: 100%
        - object-fit: cover
      icon:
        - width: 25px
        - color: var(--purple)
      name:
        - justify-self: start
        - align-self: end
        - color: var(--contrast11)
        - font-size: 11px
        - font-weight: 550
      state:
        - justify-self: start
        - align-self: start
        - color: var(--contrast20)
        - font-size: 15px
        - font-weight: 650
        - text-overflow: ellipsis
        - overflow: hidden
        - white-space: nowrap
        - max-width: 260px

  family_jellyfin_viewing:
    show_icon: true
    show_entity_picture: true
    show_name: true
    show_state: true
    show_label: true
    name: |
      [[[
        const viewer = entity?.attributes.viewer || 'Unknown viewer';
        const device = entity?.attributes.device_name;
        return device && device.toLowerCase() !== viewer.toLowerCase()
          ? `${viewer} · ${device}`
          : viewer;
      ]]]
    state_display: |
      [[[
        if (!entity) return 'Unavailable';
        const series = entity.attributes.media_series_title;
        const title = entity.attributes.media_title;
        return series && title ? `${series} · ${title}` : title || series || 'Watching';
      ]]]
    label: |
      [[[
        if (!entity) return '';
        const season = entity.attributes.media_season;
        const episode = entity.attributes.media_episode;
        const number = season != null && episode != null ? `S${season} E${episode} · ` : '';
        const status = entity.state === 'paused' ? 'Paused' : 'Watching now';
        const client = entity.attributes.client_name;
        return `${number}${status}${client ? ` on ${client}` : ''}`;
      ]]]
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s" "i l"'
        - grid-template-columns: 70px 1fr
        - grid-template-rows: min-content min-content min-content
        - column-gap: 14px
      card:
        - height: 102px
        - padding: 14px
        - border-radius: 24px
        - background: var(--contrast2)
        - box-shadow: none
      img_cell:
        - width: 70px
        - height: 70px
        - border-radius: 18px
        - background: var(--contrast4)
        - overflow: hidden
      entity_picture:
        - width: 100%
        - height: 100%
        - object-fit: cover
      icon:
        - width: 27px
        - color: var(--purple)
      name:
        - justify-self: start
        - align-self: end
        - color: var(--purple)
        - font-size: 11px
        - font-weight: 650
        - text-transform: none
      state:
        - justify-self: start
        - align-self: center
        - color: var(--contrast20)
        - font-size: 15px
        - font-weight: 650
        - text-overflow: ellipsis
        - overflow: hidden
        - white-space: nowrap
        - max-width: 260px
      label:
        - justify-self: start
        - align-self: start
        - color: var(--contrast11)
        - font-size: 11px
        - font-weight: 500
        - text-overflow: ellipsis
        - overflow: hidden
        - white-space: nowrap
        - max-width: 260px

  family_launcher:
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: url
    styles:
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 38px 1fr
        - column-gap: 10px
      card:
        - height: 72px
        - padding: 12px 14px
        - border-radius: 22px
        - background: var(--contrast2)
        - box-shadow: none
      img_cell:
        - width: 36px
        - height: 36px
        - border-radius: 13px
        - background: var(--contrast4)
      icon:
        - width: 20px
        - color: var(--launcher-accent, var(--purple))
      name:
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 14px
        - font-weight: 650

  family_board_item:
    template: family_status
    styles:
      card:
        - height: 72px

  family_washer_status:
    template: family_board_item
    entity: sensor.front_load_washer_current_status
    name: Laundry
    icon: mdi:washing-machine
    show_state: true
    state_display: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Washer is off';
        if (entity.state === 'unknown') return 'Status unavailable';
        const value = entity.state.toLowerCase().replaceAll('_', ' ');
        if (['complete', 'completed', 'finished', 'end'].includes(value)) {
          return 'Laundry is ready';
        }
        return value.replace(/\b\w/g, (letter) => letter.toUpperCase());
      ]]]
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - --status-accent: |
            [[[
              if (!entity || entity.state === 'unavailable') return 'var(--contrast10)';
              const value = entity.state.toLowerCase();
              if (['complete', 'completed', 'finished', 'end'].includes(value)) {
                return 'var(--green)';
              }
              return 'var(--blue)';
            ]]]
      state:
        - color: |
            [[[
              if (!entity || entity.state === 'unavailable') return 'var(--contrast14)';
              const value = entity.state.toLowerCase();
              return ['complete', 'completed', 'finished', 'end'].includes(value)
                ? 'var(--green)'
                : 'var(--contrast20)';
            ]]]

views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # {{ 'Good morning' if now().hour < 12 else 'Good afternoon' if now().hour < 17 else 'Good evening' }}, {{ user }}
          {% set condition = state_translated('weather.home') | replace('Partlycloudy', 'Partly cloudy') | replace('partlycloudy', 'partly cloudy') %}
          {% set temperature = states('sensor.home_temperature') %}
          {% set apparent = states('sensor.home_apparent_temperature') | float(0) %}
          {% set storm = states('sensor.home_thunderstorm_probability') | int(0) %}
          {% set home = states.person | selectattr('state', 'eq', 'home') | map(attribute='name') | list %}
          {% set active_fans = states.fan | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
          {% set washer = states('sensor.front_load_washer_current_status') | lower %}
          {% set event = state_attr('calendar.family', 'message') %}
          {% set shopping = states('todo.shopping_list') | int(0) %}
          It is **{{ now().strftime('%A') }}**. The weather is **{{ condition }} at {{ temperature }} °C**. {% if home | count == 0 %}**Nobody is home.**{% elif home | count == 1 %}**{{ home[0] }} is home.**{% else %}**{{ home | count }} people are home.**{% endif %}{% if active_fans | count == 1 %} **{{ active_fans[0] }} is running.**{% elif active_fans | count > 1 %} **{{ active_fans | count }} fans are running.**{% endif %}

          **Family note:** {% if washer in ['complete', 'completed', 'finished', 'end'] %}The laundry is ready to be collected.{% elif is_state('calendar.family', 'on') and event %}**{{ event }}** is happening now.{% elif apparent >= 38 and storm >= 30 %}It feels like **{{ apparent | round(0) | int }} °C** outside and storms are possible—please stay hydrated and take an umbrella.{% elif apparent >= 38 %}It feels like **{{ apparent | round(0) | int }} °C** outside—please stay hydrated and avoid the afternoon heat.{% elif storm >= 30 %}There is a **{{ storm }}%** chance of storms today—keep an umbrella handy.{% elif shopping > 0 %}There {% if shopping == 1 %}is **1 item**{% else %}are **{{ shopping }} items**{% endif %} on the shopping list.{% else %}Everything at home looks settled.{% endif %}
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
