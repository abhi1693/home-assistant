kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  family_status:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 10px
      card:
        - background: var(--contrast2)
        - border-radius: 20px
        - box-shadow: none
        - padding: 12px 14px
        - height: 74px
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 30px
        - height: 30px
        - border-radius: 12px
        - background: var(--contrast4)
      icon:
        - width: 17px
        - color: var(--status-accent, var(--blue))
      name:
        - align-self: end
        - justify-self: start
        - color: var(--contrast10)
        - font-size: 11px
        - font-weight: 500
      state:
        - align-self: start
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 16px
        - font-weight: 650
        - line-height: 18px

  family_temperature:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state} °C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)} °C`;
      ]]]

  family_fans_status:
    template: family_status
    state_display: |
      [[[
        const ids = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
          'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
          'fan.dining_fan', 'fan.living_room_fan_1',
          'fan.living_room_fan_2'];
        const fans = ids.map((id) => states[id]).filter(Boolean);
        const available = fans.filter((fan) => fan.state !== 'unavailable');
        if (!available.length) return 'Unavailable';
        const running = available.filter((fan) => fan.state === 'on').length;
        return running ? `${running} running` : 'All off';
      ]]]

  family_shopping_status:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const count = Number(entity.state);
        if (!Number.isFinite(count)) return entity.state;
        return count === 1 ? '1 item' : `${count} items`;
      ]]]

  family_media:
    template: family_status
    state_display: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state === 'playing') {
          return entity.attributes.media_title || 'Playing now';
        }
        if (entity.state === 'paused') return 'Paused';
        return 'Ready';
      ]]]
    styles:
      card:
        - height: 82px
        - background: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--purple)'
                : 'var(--contrast2)';
            ]]]
      icon:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--black)'
                : 'var(--purple)';
            ]]]
      name:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
      state:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]

  family_room:
    show_icon: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state !== 'on') return 'Fan is off';
        const speed = entity.attributes.percentage;
        return speed == null ? 'Running' : `Running · ${speed}%`;
      ]]]
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: |
            [[[
              if (entity && entity.state === 'on') return variables.accent;
              return 'var(--contrast2)';
            ]]]
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 136px
      img_cell:
        - align-self: start
        - justify-self: end
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - background: |
            [[[
              if (entity && entity.state === 'on') return 'rgba(0, 0, 0, 0.13)';
              return 'var(--contrast4)';
            ]]]
      icon:
        - width: 21px
        - color: |
            [[[
              if (entity && entity.state === 'on') return 'var(--black)';
              if (entity && entity.state === 'unavailable') return 'var(--red)';
              return 'var(--contrast16)';
            ]]]
      name:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]
        - font-size: 16px
        - font-weight: 650
      label:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
        - font-size: 12px
        - font-weight: 500
        - padding-top: 4px

  family_home_room:
    show_icon: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Fan offline';
        if (entity.state !== 'on') return 'Off';
        const speed = entity.attributes.percentage;
        return speed == null ? 'Running' : `Running · ${speed}%`;
      ]]]
    tap_action:
      action: more-info
    hold_action:
      action: none
    styles:
      grid:
        - grid-template-areas: '"i power" "n power" "l power"'
        - grid-template-columns: 1fr 44px
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: |
            [[[
              return entity && entity.state === 'on'
                ? variables.accent
                : 'var(--contrast2)';
            ]]]
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 116px
      img_cell:
        - align-self: start
        - justify-self: start
        - width: 34px
        - height: 34px
        - border-radius: 12px
        - background: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.13)'
                : 'var(--contrast4)';
            ]]]
      icon:
        - width: 19px
        - color: |
            [[[
              if (entity && entity.state === 'on') return 'var(--black)';
              if (entity && entity.state === 'unavailable') return 'var(--red)';
              return 'var(--contrast16)';
            ]]]
      name:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]
        - font-size: 15px
        - font-weight: 650
      label:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
        - font-size: 11px
        - font-weight: 500
        - padding-top: 3px
      custom_fields:
        power:
          - align-self: center
          - justify-self: end
    custom_fields:
      power:
        card:
          type: custom:button-card
          entity: '[[[ return variables.power_entity; ]]]'
          show_name: false
          show_state: false
          icon: |
            [[[
              return entity && entity.state === 'on'
                ? 'mdi:power'
                : 'mdi:power-standby';
            ]]]
          tap_action:
            action: toggle
          hold_action:
            action: none
          styles:
            card:
              - width: 40px
              - height: 40px
              - border-radius: 50%
              - box-shadow: none
              - background: |
                  [[[
                    if (!entity || entity.state === 'unavailable') {
                      return 'var(--contrast3)';
                    }
                    return entity.state === 'on'
                      ? 'rgba(0, 0, 0, 0.16)'
                      : 'var(--contrast4)';
                  ]]]
              - pointer-events: |
                  [[[
                    return !entity || entity.state === 'unavailable'
                      ? 'none'
                      : 'auto';
                  ]]]
              - opacity: |
                  [[[
                    return !entity || entity.state === 'unavailable' ? '0.42' : '1';
                  ]]]
            icon:
              - width: 19px
              - color: |
                  [[[
                    return entity && entity.state === 'on'
                      ? 'var(--black)'
                      : 'var(--contrast16)';
                  ]]]

  family_camera_offline:
    show_icon: true
    show_name: true
    show_state: false
    icon: mdi:video-off-outline
    tap_action:
      action: none
    styles:
      card:
        - height: 100%
        - min-height: 174px
        - border-radius: 28px
        - background: var(--contrast2)
        - box-shadow: none
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr min-content
      img_cell:
        - align-self: center
        - width: 52px
        - height: 52px
        - border-radius: 50%
        - background: var(--contrast4)
      icon:
        - width: 25px
        - color: var(--contrast9)
      name:
        - justify-self: start
        - padding: 0 18px 16px
        - color: var(--contrast12)
        - font-size: 14px
        - font-weight: 600

  family_now_playing:
    show_icon: true
    show_entity_picture: true
    show_name: true
    show_state: true
    name: |
      [[[
        return entity?.attributes.media_series_title
          || entity?.attributes.media_artist
          || entity?.attributes.friendly_name
          || 'Now playing';
      ]]]
    state_display: |
      [[[
        if (!entity) return 'Unavailable';
        const title = entity.attributes.media_title;
        return title || (entity.state === 'paused' ? 'Paused' : 'Playing now');
      ]]]
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 62px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 13px
      card:
        - height: 88px
        - padding: 12px
        - border-radius: 24px
        - background: var(--contrast2)
        - box-shadow: none
      img_cell:
        - width: 62px
        - height: 62px
        - border-radius: 17px
        - background: var(--contrast4)
        - overflow: hidden
      entity_picture:
        - width: 100%
        - height: 100%
        - object-fit: cover
      icon:
        - width: 25px
        - color: var(--purple)
      name:
        - justify-self: start
        - align-self: end
        - color: var(--contrast11)
        - font-size: 11px
        - font-weight: 550
      state:
        - justify-self: start
        - align-self: start
        - color: var(--contrast20)
        - font-size: 15px
        - font-weight: 650
        - text-overflow: ellipsis
        - overflow: hidden
        - white-space: nowrap
        - max-width: 260px

  family_launcher:
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: url
    styles:
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 38px 1fr
        - column-gap: 10px
      card:
        - height: 72px
        - padding: 12px 14px
        - border-radius: 22px
        - background: var(--contrast2)
        - box-shadow: none
      img_cell:
        - width: 36px
        - height: 36px
        - border-radius: 13px
        - background: var(--contrast4)
      icon:
        - width: 20px
        - color: var(--launcher-accent, var(--purple))
      name:
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 14px
        - font-weight: 650

  family_board_item:
    template: family_status
    styles:
      card:
        - height: 72px

views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # {{ 'Good morning' if now().hour < 12 else 'Good afternoon' if now().hour < 17 else 'Good evening' }}, {{ user }}
          It is **{{ now().strftime('%A') }}**. The weather is **{{ states('weather.home') | replace('_', ' ') | title }}** at **{{ states('sensor.home_temperature') }} °C**. {% set running = states.fan | selectattr('state', 'eq', 'on') | list | count %}{% if running %}{{ running }} fan{{ 's are' if running != 1 else ' is' }} running.{% else %}All available fans are off.{% endif %}
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 38px; letter-spacing: -1.3px; margin-bottom: 7px; }
            p { color: var(--contrast11); font-size: 15px; line-height: 1.45; }
    badges:
      - type: entity
        entity: person.abhimanyu_saharan
        name: Abhimanyu
        show_name: true
        show_state: true
        color: green
        visibility:
          - condition: user
            users: !include ../access/generated/profile-abhimanyu-saharan-users.json
      - type: entity
        entity: sensor.pixel_8_battery_level
        name: Phone
        show_name: true
        show_state: true
        color: green
        visibility:
          - condition: user
            users: !include ../access/generated/profile-abhimanyu-saharan-users.json
    sections:
      - type: grid
        column_span: 3
        cards:
          - &family_navigation
            type: custom:navbar-card
            grid_options:
              columns: 1
              rows: 1
            desktop:
              position: left
              min_width: 768
              show_labels: true
            routes:
              - icon: mdi:home-outline
                icon_selected: mdi:home-heart
                url: /home-tablet/home
                label: Home
              - icon: mdi:sofa-outline
                icon_selected: mdi:sofa
                url: /home-tablet/rooms
                label: Rooms
                badge:
                  show: |
                    [[[
                      const fans = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
                        'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
                        'fan.dining_fan', 'fan.living_room_fan_1',
                        'fan.living_room_fan_2'];
                      return fans.some((id) => states[id]?.state === 'on');
                    ]]]
                  count: |
                    [[[
                      const fans = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
                        'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
                        'fan.dining_fan', 'fan.living_room_fan_1',
                        'fan.living_room_fan_2'];
                      return fans.filter((id) => states[id]?.state === 'on').length;
                    ]]]
                  color: var(--yellow)
              - icon: mdi:cctv
                icon_selected: mdi:video
                url: /home-tablet/cameras
                label: Cameras
              - icon: mdi:music-note-outline
                icon_selected: mdi:music
                url: /home-tablet/music
                label: Music
                badge:
                  show: |
                    [[[
                      return ['media_player.abhimanyu_s_echo_2',
                        'media_player.abhimanyu_s_echo_dot_2',
                        'media_player.living_room_speaker']
                        .some((id) => states[id]?.state === 'playing');
                    ]]]
                  color: var(--green)
            styles: |
              .navbar {
                --navbar-primary-color: var(--purple);
                background: var(--contrast2);
                border: 1px solid var(--contrast4);
                border-radius: 30px;
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
              }
          - type: grid
            square: false
            columns: 6
            cards:
              - type: custom:button-card
                template: family_temperature
                entity: sensor.home_temperature
                name: Outside
                icon: mdi:thermometer
                styles:
                  card:
                    - --status-accent: var(--orange)
              - type: custom:button-card
                template: family_status
                entity: sensor.home_humidity
                name: Humidity
                icon: mdi:water-percent
                styles:
                  card:
                    - --status-accent: var(--blue)
              - type: custom:button-card
                template: family_temperature
                entity: sensor.home_apparent_temperature
                name: Feels like
                icon: mdi:sun-thermometer-outline
                styles:
                  card:
                    - --status-accent: var(--yellow)
              - type: custom:button-card
                template: family_fans_status
                entity: fan.living_room_fan_1
                name: Fans
                icon: mdi:fan
                styles:
                  card:
                    - --status-accent: var(--teal)
              - type: custom:button-card
                template: family_status
                entity: camera.living_room_high_resolution_channel
                name: Cameras
                icon: mdi:cctv
                state_display: |
                  [[[
                    const ids = ['camera.living_room_high_resolution_channel',
                      'camera.hallway_high_resolution_channel',
                      'camera.g5_turret_ultra_high_resolution_channel'];
                    const visible = ids.filter((id) => states[id]);
                    const online = visible.filter((id) =>
                      !['unknown', 'unavailable'].includes(states[id].state)).length;
                    return `${online} of ${visible.length} online`;
                  ]]]
                styles:
                  card:
                    - --status-accent: var(--green)
                visibility:
                  - condition: user
                    users: !include ../access/generated/camera-any-users.json
              - type: custom:button-card
                template: family_shopping_status
                entity: todo.shopping_list
                name: Shopping
                icon: mdi:cart-outline
                styles:
                  card:
                    - --status-accent: var(--pink)
            grid_options:
              columns: 36
              rows: 2
          - type: heading
            heading: Cameras
            heading_style: title
            icon: mdi:cctv
            grid_options:
              columns: 36
              rows: 1
            badges:
              - type: entity
                entity: camera.living_room_high_resolution_channel
                name: Open camera wall
                show_state: false
                icon: mdi:video-outline
                color: green
                tap_action:
                  action: navigate
                  navigation_path: /home-tablet/cameras
            visibility:
              - condition: user
                users: !include ../access/generated/camera-any-users.json
          - type: grid
            square: false
            columns: 3
            card_mod:
              style: |
                #root {
                  grid-template-columns: repeat(auto-fit, minmax(420px, 600px)) !important;
                  justify-content: start;
                }
            visibility:
              - condition: user
                users: !include ../access/generated/camera-any-users.json
            cards:
              - type: vertical-stack
                visibility:
                  - condition: user
                    users: !include ../access/generated/camera-master-bedroom-users.json
                cards:
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: camera.living_room_high_resolution_channel
                        state_not: unavailable
                    card:
                      type: picture-entity
                      entity: camera.living_room_high_resolution_channel
                      name: Master Bedroom
                      camera_view: live
                      fit_mode: cover
                      aspect_ratio: "16:9"
                      show_state: false
                      tap_action:
                        action: more-info
                      card_mod:
                        style: |
                          ha-card { overflow: hidden; border-radius: 28px; }
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: camera.living_room_high_resolution_channel
                        state: unavailable
                    card:
                      type: custom:button-card
                      template: family_camera_offline
                      name: Master Bedroom · Offline
              - type: vertical-stack
                visibility:
                  - condition: user
                    users: !include ../access/generated/camera-hallway-users.json
                cards:
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: camera.hallway_high_resolution_channel
                        state_not: unavailable
                    card:
                      type: picture-entity
                      entity: camera.hallway_high_resolution_channel
                      name: Hallway
                      camera_view: live
                      fit_mode: cover
                      aspect_ratio: "16:9"
                      show_state: false
                      tap_action:
                        action: more-info
                      card_mod:
                        style: |
                          ha-card { overflow: hidden; border-radius: 28px; }
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: camera.hallway_high_resolution_channel
                        state: unavailable
                    card:
                      type: custom:button-card
                      template: family_camera_offline
                      name: Hallway · Offline
              - type: vertical-stack
                visibility:
                  - condition: user
                    users: !include ../access/generated/camera-outside-users.json
                cards:
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: camera.g5_turret_ultra_high_resolution_channel
                        state_not: unavailable
                    card:
                      type: picture-entity
                      entity: camera.g5_turret_ultra_high_resolution_channel
                      name: Outside
                      camera_view: live
                      fit_mode: cover
                      aspect_ratio: "16:9"
                      show_state: false
                      tap_action:
                        action: more-info
                      card_mod:
                        style: |
                          ha-card { overflow: hidden; border-radius: 28px; }
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: camera.g5_turret_ultra_high_resolution_channel
                        state: unavailable
                    card:
                      type: custom:button-card
                      template: family_camera_offline
                      name: Outside · Offline
            grid_options:
              columns: 36
              rows: auto
          - type: grid
            square: false
            columns: 2
            cards:
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Media
                    icon: mdi:play-circle-outline
                  - type: custom:auto-entities
                    card:
                      type: grid
                      columns: 2
                      square: false
                    card_param: cards
                    filter:
                      include:
                        - integration: music_assistant
                          domain: media_player
                          state: playing
                          options:
                            type: custom:button-card
                            template: family_now_playing
                        - integration: music_assistant
                          domain: media_player
                          state: paused
                          options:
                            type: custom:button-card
                            template: family_now_playing
                        - integration: jellyfin
                          domain: media_player
                          state: playing
                          options:
                            type: custom:button-card
                            template: family_now_playing
                        - integration: jellyfin
                          domain: media_player
                          state: paused
                          options:
                            type: custom:button-card
                            template: family_now_playing
                    sort:
                      method: last_updated
                      reverse: true
                      count: 2
                    show_empty: false
                    else:
                      type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:button-card
                          template: family_launcher
                          name: Music
                          icon: mdi:music-circle
                          tap_action:
                            action: url
                            url_path: https://music.media.home
                          styles:
                            card:
                              - --launcher-accent: var(--purple)
                        - type: custom:button-card
                          template: family_launcher
                          name: Jellyfin
                          icon: mdi:jellyfish
                          tap_action:
                            action: url
                            url_path: http://watch.media.home
                          styles:
                            card:
                              - --launcher-accent: var(--blue)
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Family board
                    icon: mdi:calendar-heart
                  - type: grid
                    square: false
                    columns: 2
                    cards:
                      - type: custom:button-card
                        template: family_shopping_status
                        entity: todo.shopping_list
                        name: Shopping
                        icon: mdi:cart-outline
                        styles:
