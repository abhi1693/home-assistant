      name:
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 14px
        - font-weight: 650

  family_media_hub:
    show_icon: false
    show_name: false
    show_state: false
    styles:
      grid:
        - grid-template-areas: '"music jellyfin"'
        - grid-template-columns: 1fr 1fr
        - column-gap: 8px
      card:
        - height: 68px
        - padding: 5px
        - border-radius: 24px
        - background: var(--contrast2)
