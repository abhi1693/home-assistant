  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: sections
    theme: Family Dark
    max_columns: 3
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: |-
          # Camera wall
          See what is happening around the house at a glance.
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living room
            icon: mdi:sofa-outline
          - type: picture-entity
            entity: camera.living_room_high_resolution_channel
            name: Living room
            camera_view: live
            fit_mode: cover
            aspect_ratio: "16:9"
            show_state: false
            tap_action:
              action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Hallway
            icon: mdi:door-open
          - type: picture-entity
            entity: camera.hallway_high_resolution_channel
            name: Hallway
            camera_view: live
            fit_mode: cover
            aspect_ratio: "16:9"
            show_state: false
            tap_action:
              action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Outside
            icon: mdi:home-search-outline
          - type: picture-entity
            entity: camera.g5_turret_ultra_high_resolution_channel
            name: G5 Turret Ultra
            camera_view: live
            fit_mode: cover
            aspect_ratio: "16:9"
            show_state: false
            tap_action:
              action: more-info

  - title: Media
    path: media
    icon: mdi:play-circle-outline
    type: sections
    theme: Family Dark
    max_columns: 3
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: |-
          # Media
          Music around the house and Jellyfin activity.
    badges:
      - type: entity
        entity: sensor.jellyfin_5876476948_vc8dc_active_clients
        name: Jellyfin viewers
        show_name: true
        show_state: true
        color: purple
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Music Assistant
            icon: mdi:music-circle
          - type: media-control
            entity: media_player.abhimanyu_s_echo_2
            name: Echo
          - type: media-control
            entity: media_player.abhimanyu_s_echo_dot_2
            name: Echo Dot
      - type: grid
        cards:
          - type: heading
            heading: Around the house
            icon: mdi:speaker-multiple
          - type: media-control
            entity: media_player.living_room_speaker
            name: Living room speaker
      - type: grid
        cards:
          - type: heading
            heading: Jellyfin
            icon: mdi:jellyfish
          - type: tile
            entity: sensor.jellyfin_5876476948_vc8dc_active_clients
            name: Active clients
            icon: mdi:television-play
            color: purple
            tap_action:
              action: more-info
          - type: markdown
            content: |-
              Playback sessions and request approval controls will appear here
              after those entities are exposed by Jellyfin and Jellyseerr.
