        music:
          - width: 100%
        jellyfin:
          - width: 100%
    custom_fields:
      music:
        card:
          type: custom:button-card
          template: family_launcher
          name: Music
          icon: mdi:music-circle
          tap_action:
            action: url
            url_path: https://music.media.home
          styles:
            card:
              - height: 58px
              - background: transparent
              - --launcher-accent: var(--purple)
      jellyfin:
        card:
          type: custom:button-card
          template: family_launcher
          name: Jellyfin
          icon: mdi:jellyfish
          tap_action:
            action: url
            url_path: http://watch.media.home
          styles:
            card:
              - height: 58px
              - background: transparent
              - --launcher-accent: var(--blue)

  family_household_notice:
    entity: input_text.family_household_notice
    show_icon: true
    show_name: true
    show_state: true
    show_label: true
    icon: mdi:message-text-outline
    name: |
      [[[
        const message = !entity || ['unknown', 'unavailable'].includes(entity.state)
          ? '' : entity.state.trim();
        return message ? 'For everyone' : 'Leave a note';
      ]]]
    state_display: |
      [[[
        const message = !entity || ['unknown', 'unavailable'].includes(entity.state)
          ? '' : entity.state.trim();
        const expires = states['input_boolean.family_household_notice_expires']?.state === 'on';
        const until = states['input_datetime.family_household_notice_until'];
        const deadline = until && !['unknown', 'unavailable'].includes(until.state)
          ? new Date(until.state.replace(' ', 'T')) : null;
        if (message && (!expires || !deadline || deadline.getTime() > Date.now())) return message;
        if (message && expires && deadline && deadline.getTime() <= Date.now()) {
          return 'This note has expired — tap to replace it';
        }
        return 'Tap to write something the family should see';
      ]]]
    label: |
      [[[
        const expires = states['input_boolean.family_household_notice_expires']?.state === 'on';
        const until = states['input_datetime.family_household_notice_until'];
        if (!expires) return 'No expiry';
        if (!until || ['unknown', 'unavailable'].includes(until.state)) return 'Set an expiry';
        const deadline = new Date(until.state.replace(' ', 'T'));
        if (Number.isNaN(deadline.getTime())) return 'Set an expiry';
        return deadline.getTime() <= Date.now()
          ? 'Expired'
          : `Until ${deadline.toLocaleString([], {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'})}`;
      ]]]
    tap_action:
      action: more-info
    hold_action:
      action: more-info
      entity: input_datetime.family_household_notice_until
    styles:
      grid:
        - grid-template-areas: '"i n" "i s" "i l"'
        - grid-template-columns: 40px 1fr
        - grid-template-rows: min-content min-content min-content
        - column-gap: 11px
      card:
        - min-height: 112px
        - padding: 16px
        - border-radius: 24px
        - background: var(--contrast2)
        - box-shadow: none
      img_cell:
        - align-self: start
        - width: 38px
        - height: 38px
        - border-radius: 14px
        - background: var(--contrast4)
      icon:
        - width: 20px
        - color: var(--pink)
      name:
        - justify-self: start
        - color: var(--contrast11)
        - font-size: 11px
        - font-weight: 600
      state:
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 14px
        - font-weight: 620
        - white-space: normal
        - text-align: left
        - line-height: 19px
      label:
        - justify-self: start
        - color: var(--contrast9)
        - font-size: 11px
        - font-weight: 500
        - padding-top: 5px

  family_board_item:
    template: family_status
    styles:
      card:
        - height: 72px

  family_washer_status:
    template: family_board_item
    entity: sensor.front_load_washer_current_status
    name: Laundry
    icon: mdi:washing-machine
    show_state: true
    state_display: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Washer is off';
        if (entity.state === 'unknown') return 'Status unavailable';
        const value = entity.state.toLowerCase().replaceAll('_', ' ');
        if (['complete', 'completed', 'finished', 'end'].includes(value)) {
          return 'Laundry is ready';
        }
        return value.replace(/\b\w/g, (letter) => letter.toUpperCase());
      ]]]
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - --status-accent: |
            [[[
              if (!entity || entity.state === 'unavailable') return 'var(--contrast10)';
              const value = entity.state.toLowerCase();
              if (['complete', 'completed', 'finished', 'end'].includes(value)) {
                return 'var(--green)';
              }
              return 'var(--blue)';
            ]]]
      state:
        - color: |
            [[[
              if (!entity || entity.state === 'unavailable') return 'var(--contrast14)';
              const value = entity.state.toLowerCase();
              return ['complete', 'completed', 'finished', 'end'].includes(value)
                ? 'var(--green)'
                : 'var(--contrast20)';
            ]]]

views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 3
        cards:
          - &family_navigation !include includes/family-navigation.yaml
          - type: markdown
            text_only: true
            content: |-
              # {{ 'Good morning' if now().hour < 12 else 'Good afternoon' if now().hour < 17 else 'Good evening' }}, {{ user }}
              {% set condition = state_translated('weather.home') | replace('Partlycloudy', 'Partly cloudy') | replace('partlycloudy', 'partly cloudy') %}
              {% set temperature = states('sensor.home_temperature') %}
              {% set apparent = states('sensor.home_apparent_temperature') | float(0) %}
              {% set storm = states('sensor.home_thunderstorm_probability') | int(0) %}
              {% set home = states.person | selectattr('state', 'eq', 'home') | map(attribute='name') | list %}
              {% set washer = states('sensor.front_load_washer_current_status') | lower %}
              {% set event = state_attr('calendar.family', 'message') %}
              {% set shopping = states('todo.shopping_list') | int(0) %}
              {% set notice_state = states('input_text.family_household_notice') %}
              {% set notice = '' if notice_state in ['unknown', 'unavailable'] else notice_state | trim %}
              {% set notice_expires = is_state('input_boolean.family_household_notice_expires', 'on') %}
              {% set notice_until = as_timestamp(states('input_datetime.family_household_notice_until'), 0) %}
              **{{ now().strftime('%A') }}** · {{ condition }} at **{{ temperature }} °C** · {% if home | count == 0 %}Nobody home{% elif home | count == 1 %}{{ home[0] }} is home{% else %}{{ home | count }} people home{% endif %}

              {% if notice and (not notice_expires or notice_until == 0 or notice_until > as_timestamp(now())) %}{{ notice }}{% elif washer in ['complete', 'completed', 'finished', 'end'] %}The laundry is ready to be collected.{% elif is_state('calendar.family', 'on') and event %}**{{ event }}** is happening now.{% elif apparent >= 38 and storm >= 30 %}It feels like **{{ apparent | round(0) | int }} °C** outside and storms are possible—please stay hydrated and take an umbrella.{% elif apparent >= 38 %}It feels like **{{ apparent | round(0) | int }} °C** outside—please stay hydrated and avoid the afternoon heat.{% elif storm >= 30 %}There is a **{{ storm }}%** chance of storms today—keep an umbrella handy.{% elif shopping > 0 %}There {% if shopping == 1 %}is **1 item**{% else %}are **{{ shopping }} items**{% endif %} on the shopping list.{% else %}Everything at home looks settled.{% endif %}
            card_mod:
              style: |
                ha-card { background: transparent; padding: 2px 0 0; }
                h1 { font-size: 38px; letter-spacing: -1.3px; margin: 0 0 5px; }
                p { color: var(--contrast11); font-size: 15px; line-height: 1.4; margin: 4px 0; }
            grid_options: { columns: 36, rows: auto }
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            styles:
              grid:
                - grid-template-areas: '"weather presence today activity attention"'
                - grid-template-columns: repeat(5, minmax(0, 1fr))
              card:
                - width: 100%
                - padding: 3px 4px
                - background: none
                - border: none
                - border-radius: 0
                - box-shadow: none
              custom_fields:
                weather: [{ width: 100% }]
                presence: [{ width: 100% }]
                today: [{ width: 100% }]
                activity: [{ width: 100% }]
                attention: [{ width: 100% }]
            custom_fields:
              weather:
                card:
                  type: custom:button-card
                  template: family_ribbon_weather
                  entity: weather.home
              presence:
                card:
                  type: custom:button-card
                  template: family_ribbon_presence
              today:
                card:
                  type: custom:button-card
                  template: family_ribbon_today
              activity:
                card:
                  type: custom:button-card
                  template: family_ribbon_activity
              attention:
                card:
                  type: custom:button-card
                  template: family_ribbon_attention
            grid_options:
              columns: 36
              rows: auto
          - type: heading
            heading: Cameras
            heading_style: title
            icon: mdi:cctv
            grid_options: { columns: 36, rows: 1 }
            badges:
              - type: entity
                entity: camera.g5_turret_ultra_high_resolution_channel
                name: Open camera wall
                show_state: false
                icon: mdi:video-outline
                color: green
                tap_action:
                  action: navigate
                  navigation_path: /home-tablet/cameras
            visibility:
              - condition: user
                users: !include ../access/generated/camera-any-users.json
          - type: custom:auto-entities
            card:
              type: grid
              square: false
              columns: 4
              card_mod:
                style: |
                  #root { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
                  #root > *:first-child { grid-column: span 2; }
            card_param: cards
            filter:
              include:
                - entity_id: camera.g5_turret_ultra_medium_resolution_channel
                  state: idle
                  options:
                    type: picture-entity
                    entity: camera.g5_turret_ultra_high_resolution_channel
                    camera_image: camera.g5_turret_ultra_medium_resolution_channel
                    name: Outside
                    camera_view: live
                    fit_mode: cover
                    aspect_ratio: "16:9"
                    show_state: false
                    tap_action: { action: more-info }
                    card_mod:
                      style: |
                        :host { grid-column: span 2; }
                        ha-card { overflow: hidden; border-radius: 28px; }
                - entity_id: camera.g5_turret_ultra_high_resolution_channel
                  state: unavailable
                  options:
                    type: custom:button-card
                    template: family_camera_offline
                    name: Outside
                    card_mod:
                      style: |
                        :host { grid-column: span 2; }
                - entity_id: camera.living_room_medium_resolution_channel
                  state: idle
                  options:
                    type: picture-entity
                    entity: camera.living_room_high_resolution_channel
                    camera_image: camera.living_room_medium_resolution_channel
                    name: Master Bedroom
                    camera_view: live
                    fit_mode: cover
                    aspect_ratio: "16:9"
                    show_state: false
                    tap_action: { action: more-info }
                    card_mod:
                      style: |
                        ha-card { overflow: hidden; border-radius: 28px; }
                - entity_id: camera.living_room_high_resolution_channel
                  state: unavailable
                  options:
                    type: custom:button-card
                    template: family_camera_offline
                    name: Master Bedroom
                - entity_id: camera.hallway_medium_resolution_channel
                  state: idle
                  options:
                    type: picture-entity
                    entity: camera.hallway_high_resolution_channel
                    camera_image: camera.hallway_medium_resolution_channel
                    name: Hallway
                    camera_view: live
                    fit_mode: cover
                    aspect_ratio: "16:9"
                    show_state: false
                    tap_action: { action: more-info }
                    card_mod:
                      style: |
                        ha-card { overflow: hidden; border-radius: 28px; }
                - entity_id: camera.hallway_high_resolution_channel
                  state: unavailable
                  options:
                    type: custom:button-card
                    template: family_camera_offline
                    name: Hallway
            show_empty: false
            visibility:
              - condition: user
                users: !include ../access/generated/camera-any-users.json
            grid_options: { columns: 36, rows: auto }
          - type: heading
            heading: Media
            heading_style: title
            icon: mdi:play-circle-outline
            grid_options: { columns: 36, rows: 1 }
          - type: custom:button-card
            template: family_media_hub
            grid_options: { columns: 36, rows: auto }
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
              card_mod:
                style: |
                  #root { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)) !important; }
            card_param: cards
            filter:
              include:
                - integration: music_assistant
                  domain: media_player
                  state: playing
                  options: { type: custom:button-card, template: family_now_playing }
                - integration: music_assistant
                  domain: media_player
                  state: paused
                  options: { type: custom:button-card, template: family_now_playing }
                - entity_id: sensor.jellyfin_session_*
                  state: playing
                  options: { type: custom:button-card, template: family_jellyfin_viewing }
                - entity_id: sensor.jellyfin_session_*
                  state: paused
                  options: { type: custom:button-card, template: family_jellyfin_viewing }
            sort: { method: last_updated, reverse: true }
            show_empty: false
            grid_options: { columns: 36, rows: auto }
          - type: heading
            heading: Favourite rooms
            heading_style: title
            icon: mdi:floor-plan
            grid_options: { columns: 36, rows: 1 }
            badges:
              - type: entity
                entity: fan.office_fan
                name: All rooms
                show_state: false
                icon: mdi:arrow-right
                tap_action:
                  action: navigate
                  navigation_path: /home-tablet/rooms
          - type: grid
            square: false
            columns: 4
            cards:
              - type: custom:button-card
                template: family_area_summary
                entity: fan.living_room_fan_1
                name: Living Room
                icon: mdi:sofa-outline
                variables:
                  accent: var(--yellow)
                  entities: [fan.living_room_fan_1, fan.living_room_fan_2]
              - type: custom:button-card
                template: family_area_summary
                entity: fan.kitchen_fan
                name: Kitchen
                icon: mdi:countertop-outline
                variables:
                  accent: var(--orange)
                  entities: [fan.kitchen_fan]
              - type: custom:button-card
                template: family_area_summary
                entity: fan.master_bedroom_fan
                name: Master Bedroom
                icon: mdi:bed-king-outline
                variables:
                  accent: var(--blue)
                  entities: [fan.master_bedroom_fan]
              - type: custom:button-card
                template: family_area_summary
                entity: fan.office_fan
                name: Office
                icon: mdi:desk
                variables:
                  accent: var(--teal)
                  entities: [fan.office_fan]
            grid_options: { columns: 36, rows: auto }
      - type: grid
        cards:
          - type: heading
            heading: Today
            heading_style: title
            icon: mdi:calendar-heart
          - type: custom:button-card
            template: family_household_notice
          - type: custom:button-card
            template: family_board_item
            entity: input_boolean.family_household_notice_expires
            name: Notice expiry
            icon: mdi:timer-outline
            state_display: |
              [[[
                if (entity?.state !== 'on') return 'Keep until someone changes it';
                const until = states['input_datetime.family_household_notice_until'];
                if (!until || ['unknown', 'unavailable'].includes(until.state)) return 'Long-press to choose a time';
                const deadline = new Date(until.state.replace(' ', 'T'));
                return Number.isNaN(deadline.getTime()) ? 'Long-press to choose a time'
                  : `Until ${deadline.toLocaleString([], {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'})}`;
              ]]]
            tap_action: { action: toggle }
            hold_action:
              action: more-info
              entity: input_datetime.family_household_notice_until
            styles:
              card:
                - --status-accent: var(--pink)
          - type: custom:button-card
            template: family_board_item
            entity: calendar.family
            name: Next event
            icon: mdi:calendar-clock
            state_display: |
              [[[
                if (!entity || entity.state === 'unavailable') return 'Calendar unavailable';
                const message = entity.attributes.message;
                if (!message) return 'Nothing scheduled';
                const start = entity.attributes.start_time;
                const date = start ? new Date(start) : null;
                return date && !Number.isNaN(date.getTime())
                  ? `${date.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})} · ${message}`
                  : message;
              ]]]
            styles:
              card:
                - --status-accent: var(--green)
          - type: custom:button-card
            template: family_washer_status
            label: |
              [[[
                if (!entity || entity.state === 'unavailable') return 'Connects when the washer has power';
                const remaining = states['sensor.front_load_washer_remaining_time'];
                if (remaining && !['unknown', 'unavailable'].includes(remaining.state)) {
                  const end = new Date(remaining.state);
                  const minutes = Math.ceil((end.getTime() - Date.now()) / 60000);
                  if (Number.isFinite(minutes) && minutes > 0) return minutes < 60
                    ? `${minutes} min remaining` : `${Math.floor(minutes / 60)} hr ${minutes % 60} min remaining`;
                }
                const total = states['sensor.front_load_washer_total_time'];
                const minutes = Number(total?.state);
                return Number.isFinite(minutes) && minutes > 0
                  ? `${minutes} min cycle` : 'No active cycle';
              ]]]
            show_label: true
            styles:
              grid:
                - grid-template-areas: '"i n" "i s" "i l"'
                - grid-template-rows: min-content min-content min-content
              label:
                - justify-self: start
                - color: var(--contrast10)
                - font-size: 11px
          - type: custom:todo-swipe-card
            entities:
              - entity: todo.shopping_list
                show_title: true
                title: Shopping
                display_order: none
                icon: mdi:cart-outline
            show_pagination: false
            show_icons: false
            show_addbutton: true
            show_create: true
            show_completed: true
            show_completed_menu: false
            enable_search: false
            delete_confirmation: true
            card_spacing: 0
            font_size: 15
            title_font_size: 18
            card_mod:
              style: |
                :host {
                  --todo-swipe-card-background: var(--contrast2);
                  --todo-swipe-card-text-color: var(--primary-text-color);
                  --todo-swipe-card-item-height: 40px;
                  --todo-swipe-card-checkbox-size: 22px;
                  --todo-swipe-card-checkbox-checked-color: var(--pink);
                  --todo-swipe-card-title-background: transparent;
                  --todo-swipe-card-title-color: var(--primary-text-color);
                  --todo-swipe-card-title-font-weight: 650;
                  --todo-swipe-card-add-button-color: var(--pink);
                  --todo-swipe-card-delete-button-color: var(--red);
                }
                ha-card {
                  background: var(--contrast2);
                  border: 1px solid rgba(var(--rgb-primary-text-color), 0.06);
                  border-radius: 24px;
                  box-shadow: none;
                  overflow: hidden;
                }

