    show_state: false
    show_label: true
    label: |
      [[[
        const devices = (variables.entities || []).map((id) => states[id]).filter(Boolean);
        const available = devices.filter((item) => !['unknown', 'unavailable'].includes(item.state));
        const running = available.filter((item) => item.state === 'on');
        if (running.length === 1) {
          const speed = running[0].attributes.percentage;
          return speed == null ? 'Cooling now' : `Cooling now · ${speed}%`;
        }
        if (running.length > 1) return `${running.length} fans cooling`;
        if (!available.length) return devices.length > 1 ? 'Fan power is off' : 'Device power is off';
        return 'Quiet and ready';
      ]]]
    tap_action:
