views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: |-
          # Welcome home
          Everything the family needs, right where it should be.
    badges:
      - type: entity
        entity: person.abhimanyu_saharan
        name: Abhimanyu
        show_name: true
        show_state: true
        color: green
      - type: entity
        entity: sensor.home_temperature
        name: Outside
        show_name: true
        show_state: true
        color: amber
      - type: entity
        entity: sensor.home_humidity
        name: Humidity
        show_name: true
        show_state: true
        color: blue
      - type: entity
        entity: sensor.jellyfin_5876476948_vc8dc_active_clients
        name: Jellyfin
        show_name: true
        show_state: true
        color: purple
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            entity: weather.home
            show_current: true
            show_forecast: true
            forecast_type: daily
            grid_options:
              columns: 12
              rows: 4
          - type: tile
            entity: sensor.home_apparent_temperature
            name: Feels like
            icon: mdi:thermometer
            color: amber
          - type: tile
            entity: sensor.jellyfin_5876476948_vc8dc_active_clients
            name: Watching Jellyfin
            icon: mdi:jellyfish
            color: purple
            tap_action:
              action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Cameras
            icon: mdi:cctv
            tap_action:
              action: navigate
              navigation_path: /home-tablet/cameras
          - type: picture-entity
            entity: camera.living_room_high_resolution_channel
            name: Living room
            camera_view: auto
            fit_mode: cover
            aspect_ratio: "16:9"
            show_state: false
            tap_action:
              action: more-info
          - type: picture-entity
            entity: camera.hallway_high_resolution_channel
            name: Hallway
            camera_view: auto
            fit_mode: cover
            aspect_ratio: "16:9"
            show_state: false
            tap_action:
              action: more-info
          - type: picture-entity
            entity: camera.g5_turret_ultra_high_resolution_channel
            name: Outside
            camera_view: auto
            fit_mode: cover
            aspect_ratio: "16:9"
            show_state: false
            tap_action:
              action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Rooms
            icon: mdi:floor-plan
            tap_action:
              action: navigate
              navigation_path: /home-tablet/rooms
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: fan.living_room_fan_1
            name: Living Room
            icon: mdi:sofa-outline
            show_state: true
            button_action:
              tap_action:
                action: navigate
                navigation_path: /home-tablet/rooms
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: fan.master_bedroom_fan
            name: Master Bedroom
            icon: mdi:bed-king-outline
            show_state: true
            button_action:
              tap_action:
                action: more-info
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: fan.kitchen_fan
            name: Kitchen
            icon: mdi:countertop-outline
            show_state: true
            button_action:
              tap_action:
                action: more-info
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: fan.office_fan
            name: Office
            icon: mdi:desk
            show_state: true
            button_action:
              tap_action:
                action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Listening
            icon: mdi:music-circle-outline
            tap_action:
              action: navigate
              navigation_path: /home-tablet/media
          - type: media-control
            entity: media_player.abhimanyu_s_echo_2
            name: Echo
          - type: media-control
            entity: media_player.abhimanyu_s_echo_dot_2
            name: Echo Dot

