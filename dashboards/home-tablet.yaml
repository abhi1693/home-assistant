      card:
        - height: 72px

  family_washer_status:
    template: family_board_item
    entity: sensor.front_load_washer_current_status
    name: Laundry
    icon: mdi:washing-machine
    show_state: true
    state_display: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Washer is off';
        if (entity.state === 'unknown') return 'Status unavailable';
        const value = entity.state.toLowerCase().replaceAll('_', ' ');
        if (['complete', 'completed', 'finished', 'end'].includes(value)) {
          return 'Laundry is ready';
        }
        return value.replace(/\b\w/g, (letter) => letter.toUpperCase());
      ]]]
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - --status-accent: |
            [[[
              if (!entity || entity.state === 'unavailable') return 'var(--contrast10)';
              const value = entity.state.toLowerCase();
              if (['complete', 'completed', 'finished', 'end'].includes(value)) {
                return 'var(--green)';
              }
              return 'var(--blue)';
            ]]]
      state:
        - color: |
            [[[
              if (!entity || entity.state === 'unavailable') return 'var(--contrast14)';
              const value = entity.state.toLowerCase();
              return ['complete', 'completed', 'finished', 'end'].includes(value)
                ? 'var(--green)'
                : 'var(--contrast20)';
            ]]]

views:
  - title: Home
    path: home
    icon: mdi:home-heart
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            text_only: true
            content: |-
              # {{ 'Good morning' if now().hour < 12 else 'Good afternoon' if now().hour < 17 else 'Good evening' }}, {{ user }}
              {% set hour = now().hour %}
              {% set daypart = 'early morning' if hour < 5 else 'morning' if hour < 12 else 'afternoon' if hour < 17 else 'evening' if hour < 22 else 'night' %}
              {% set condition = state_translated('weather.home') | replace('Partlycloudy', 'Partly cloudy') | replace('partlycloudy', 'partly cloudy') %}
              {% set temperature = states('sensor.home_temperature') %}
              {% set temperature_known = temperature not in ['unknown', 'unavailable', 'none', ''] %}
              {% set apparent_state = states('sensor.home_apparent_temperature') %}
              {% set apparent = apparent_state | float(0) %}
              {% set storm = states('sensor.home_thunderstorm_probability') | int(0) %}
              {% set air_known = has_value('sensor.home_naqi_in_aqi') and has_value('sensor.home_naqi_in_category') %}
              {% set aqi = states('sensor.home_naqi_in_aqi') | int(0) %}
              {% set air_category = state_translated('sensor.home_naqi_in_category') | lower | replace(' air quality', '') if air_known else none %}
              {% set home = states.person | selectattr('state', 'eq', 'home') | map(attribute='name') | list %}
              {% set known_people = states.person | rejectattr('state', 'eq', 'unknown') | rejectattr('state', 'eq', 'unavailable') | list %}
              {% set washer = states('sensor.front_load_washer_current_status') | lower %}
              {% set event = state_attr('calendar.birthdays', 'message') %}
              {% set event_start_raw = state_attr('calendar.birthdays', 'start_time') %}
              {% set event_start = as_local(as_datetime(event_start_raw)) if event_start_raw else none %}
              {% set event_days = (event_start.date() - now().date()).days if event_start else none %}
              {% set event_all_day = state_attr('calendar.birthdays', 'all_day') %}
              {% set shopping = states('todo.shopping_list') | int(0) %}
              {% set attention = states('sensor.house_attention_level') %}
              {% set attention_reason = state_attr('sensor.house_attention_level', 'primary_reason') %}
              **{{ now().strftime('%A') }} {{ daypart }} · {{ now().strftime('%-I:%M %p') }}**{% if condition not in ['unknown', 'unavailable'] %} · {{ condition }}{% endif %}{% if temperature_known %} · **{{ temperature }} °C** outside{% endif %}{% if air_known %} · Air is {{ air_category }}{% endif %}{% if home | count == 0 and known_people | count > 0 %} · Home is empty{% elif home | count == 1 %} · {{ home[0] }} is home{% elif home | count == 2 %} · {{ home[0] }} and {{ home[1] }} are home{% elif home | count > 2 %} · {{ home | count }} people are home{% endif %}

              {% if attention in ['critical', 'warning'] and attention_reason %}**{{ attention_reason }}.** Open Security for the details.{% elif air_known and aqi > 300 %}The air is **{{ air_category }}** at **AQI {{ aqi }}**—avoid outdoor activity and keep the windows closed.{% elif air_known and aqi > 200 %}Air quality is **{{ air_category }}** at **AQI {{ aqi }}**—limit time outdoors and keep the windows closed.{% elif washer in ['complete', 'completed', 'finished', 'end'] %}The laundry is ready to be collected.{% elif is_state('calendar.birthdays', 'on') and event %}**{{ event }}** is happening today.{% elif event and event_days == 0 %}{% if event_all_day %}**{{ event }}** is today.{% else %}Next: **{{ event }}** at **{{ event_start.strftime('%-I:%M %p') }}**.{% endif %}{% elif event and event_days == 1 %}{% if event_all_day %}Tomorrow: **{{ event }}**.{% else %}Tomorrow: **{{ event }}** at **{{ event_start.strftime('%-I:%M %p') }}**.{% endif %}{% elif apparent >= 38 and storm >= 30 %}It {% if hour < 12 %}already {% elif hour >= 17 %}still {% endif %}feels like **{{ apparent | round(0) | int }} °C** outside, and storms are possible {% if hour < 12 %}later today{% elif hour < 17 %}this afternoon{% else %}tonight{% endif %}—take water and an umbrella if you are heading out.{% elif apparent >= 38 %}It {% if hour < 12 %}already {% elif hour >= 17 %}still {% endif %}feels like **{{ apparent | round(0) | int }} °C** outside—{% if hour < 12 %}take water if you are heading out later{% elif hour < 17 %}keep outdoor plans short and stay hydrated{% elif hour < 22 %}take water if you are heading out{% else %}keep the house cool overnight{% endif %}.{% elif storm >= 30 %}Storms are possible {% if hour < 12 %}later today{% elif hour < 17 %}this afternoon{% else %}tonight{% endif %}—keep an umbrella handy.{% elif shopping > 0 %}There {% if shopping == 1 %}is **1 item**{% else %}are **{{ shopping }} items**{% endif %} on the shopping list.{% elif air_known and aqi > 100 %}The air is **{{ air_category }}** at **AQI {{ aqi }}**—anyone sensitive should take it easy outdoors.{% elif hour < 5 %}Everything at home is settled for the night.{% elif hour < 12 %}Nothing at home needs attention this morning.{% elif hour < 17 %}Nothing at home needs attention right now.{% elif hour < 22 %}Nothing at home needs attention this evening.{% else %}Everything at home is settled for the night.{% endif %}
            card_mod:
              style: |
                ha-card { background: transparent; padding: 2px 0 0; }
                h1 { font-size: 38px; letter-spacing: -1.3px; margin: 0 0 5px; }
                p { color: var(--contrast11); font-size: 15px; line-height: 1.4; margin: 4px 0; }
                @media (max-width: 639px) {
                  ha-card { padding-inline: 2px; }
                  h1 { font-size: 28px; letter-spacing: -0.7px; line-height: 1.15; }
                  p { font-size: 14px; line-height: 1.45; }
                }
            grid_options: { columns: 36, rows: auto }
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            styles:
              grid:
                - grid-template-areas: |
                    [[[
                      const alarm = ['9302d11f48c64fe796a3c9e5cb563650',
                        '8117b77542614a06b4672a8ae1a979b5'].includes(user?.id);
                      if (window.matchMedia('(max-width: 639px)').matches) {
                        return alarm
                          ? '"weather presence" "today activity" "humidity air_quality" "attention alarm"'
                          : '"weather presence" "today activity" "humidity air_quality" "attention attention"';
                      }
                      return alarm
                        ? '"weather presence today activity humidity air_quality attention alarm"'
                        : '"weather presence today activity humidity air_quality attention"';
                    ]]]
                - grid-template-columns: |
                    [[[
                      if (window.matchMedia('(max-width: 639px)').matches) {
                        return 'repeat(2, minmax(0, 1fr))';
                      }
                      return ['9302d11f48c64fe796a3c9e5cb563650',
                        '8117b77542614a06b4672a8ae1a979b5'].includes(user?.id)
                        ? 'repeat(8, minmax(0, 1fr))'
                        : 'repeat(7, minmax(0, 1fr))';
                    ]]]
              card:
                - width: 100%
                - padding: |
                    [[[
                      return window.matchMedia('(max-width: 639px)').matches
                        ? '4px 0' : '3px 4px';
                    ]]]
                - background: none
                - border: none
                - border-radius: 0
                - box-shadow: none
              custom_fields:
