kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  family_status:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 10px
      card:
        - background: var(--contrast2)
        - border-radius: 20px
        - box-shadow: none
        - padding: 12px 14px
        - height: 74px
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 30px
        - height: 30px
        - border-radius: 12px
        - background: var(--contrast4)
      icon:
        - width: 17px
        - color: var(--status-accent, var(--blue))
      name:
        - align-self: end
        - justify-self: start
        - color: var(--contrast10)
        - font-size: 11px
        - font-weight: 500
      state:
        - align-self: start
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 16px
        - font-weight: 650
        - line-height: 18px

  family_temperature:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state} °C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)} °C`;
      ]]]

  family_fans_status:
    template: family_status
    state_display: |
      [[[
        const ids = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
          'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
          'fan.dining_fan', 'fan.living_room_fan_1',
          'fan.living_room_fan_2'];
        const fans = ids.map((id) => states[id]).filter(Boolean);
        const available = fans.filter((fan) => fan.state !== 'unavailable');
        if (!available.length) return 'Unavailable';
        const running = available.filter((fan) => fan.state === 'on').length;
        return running ? `${running} running` : 'All off';
      ]]]

  family_shopping_status:
    template: family_status
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const count = Number(entity.state);
        if (!Number.isFinite(count)) return entity.state;
        return count === 1 ? '1 item' : `${count} items`;
      ]]]

  family_ribbon:
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const unit = entity.attributes.unit_of_measurement || '';
        return `${entity.state}${unit}`;
      ]]]
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 24px max-content
        - grid-template-rows: 14px 22px
        - column-gap: 10px
        - justify-content: center
      card:
        - height: 54px
        - padding: 7px 12px
        - background: none
        - border: none
        - border-radius: 0
        - box-shadow: none
        - --mdc-ripple-press-opacity: 0.06
      img_cell:
        - align-self: center
        - justify-self: start
        - width: 24px
        - height: 24px
      icon:
        - width: 21px
        - color: var(--ribbon-accent, var(--contrast10))
      name:
        - align-self: end
        - justify-self: start
        - max-width: 130px
        - overflow: hidden
        - color: var(--contrast14)
        - font-size: 11px
        - font-weight: 500
        - line-height: 14px
        - text-overflow: ellipsis
        - white-space: nowrap
      label:
        - align-self: start
        - justify-self: start
        - max-width: 130px
        - overflow: hidden
        - color: var(--contrast20)
        - font-size: 16px
        - font-weight: 700
        - line-height: 20px
        - text-overflow: ellipsis
        - white-space: nowrap

  family_ribbon_temperature:
    template: family_ribbon
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state}°C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)}°C`;
      ]]]

  family_ribbon_weather:
    template: family_ribbon
    name: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Weather unavailable';
        }
        const labels = {
          'clear-night': 'Clear night',
          'partlycloudy': 'Partly cloudy',
          'pouring': 'Heavy rain'
        };
        return labels[entity.state]
          || entity.state.replaceAll('_', ' ').replace(/^./, (value) => value.toUpperCase());
      ]]]
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.attributes.temperature);
        if (!Number.isFinite(value)) return 'Unavailable';
        const unit = entity.attributes.temperature_unit;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)}°C`;
      ]]]

  family_ribbon_presence:
    template: family_ribbon
    entity: person.abhimanyu_saharan
    name: At home
    icon: mdi:home-heart
    label: |
      [[[
        const people = Object.values(states)
          .filter((item) => item.entity_id.startsWith('person.'));
        const home = people.filter((person) => person.state === 'home');
        if (!home.length) return 'Nobody';
        if (home.length > 2) return `${home.length} people`;
        return home.map((person) => person.attributes.friendly_name).join(' & ');
      ]]]
    styles:
      icon:
        - color: |
            [[[
              const home = Object.values(states).some((item) =>
                item.entity_id.startsWith('person.') && item.state === 'home');
              return home ? 'var(--green)' : 'var(--contrast10)';
            ]]]

  family_ribbon_today:
    template: family_ribbon
    entity: calendar.family
    variables:
      context: |
        [[[
          const washer = states['sensor.front_load_washer_current_status'];
          const washerState = washer?.state?.toLowerCase();
          if (['complete', 'completed', 'finished', 'end'].includes(washerState)) {
            return {
              name: 'Laundry', label: 'Ready to collect',
              icon: 'mdi:washing-machine-alert', color: 'var(--green)'
            };
          }
          if (entity?.attributes.message) {
            const start = entity.attributes.start_time;
            const date = start ? new Date(start) : null;
            return {
              name: entity.state === 'on' ? 'Happening now' : 'Next event',
              label: date && !Number.isNaN(date.getTime())
                ? `${date.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})} · ${entity.attributes.message}`
                : entity.attributes.message,
              icon: 'mdi:calendar-heart', color: 'var(--green)'
            };
          }
          const shopping = states['todo.shopping_list'];
          const items = Number(shopping?.state || 0);
          if (items > 0) {
            return {
              name: 'Shopping', label: items === 1 ? '1 item' : `${items} items`,
              icon: 'mdi:cart-outline', color: 'var(--pink)'
            };
          }
          const sunset = states['sensor.sun_next_setting'];
          const setting = sunset ? new Date(sunset.state) : null;
          return {
            name: 'Sunset',
            label: setting && !Number.isNaN(setting.getTime())
              ? setting.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})
              : 'Later today',
            icon: 'mdi:weather-sunset-down', color: 'var(--yellow)'
          };
        ]]]
    name: '[[[ return variables.context.name; ]]]'
    label: '[[[ return variables.context.label; ]]]'
    icon: '[[[ return variables.context.icon; ]]]'
    styles:
      icon:
        - color: '[[[ return variables.context.color; ]]]'

  family_ribbon_activity:
    template: family_ribbon
    entity: sensor.jellyfin_5876476948_vc8dc_active_clients
    variables:
      context: |
        [[[
          const watching = Number(entity?.state || 0);
          if (watching > 0) return {
            name: 'Jellyfin', label: watching === 1 ? '1 person watching' : `${watching} people watching`,
            icon: 'mdi:jellyfish', color: 'var(--purple)'
          };
          const playing = Object.values(states).find((item) =>
            item.entity_id.startsWith('media_player.') && item.state === 'playing');
          if (playing) return {
            name: 'Playing',
            label: playing.attributes.media_title || playing.attributes.friendly_name,
            icon: 'mdi:music-note', color: 'var(--purple)'
          };
          const fanIds = ['fan.master_bedroom_fan', 'fan.bedroom_fan', 'fan.guest_fan',
            'fan.office_fan', 'fan.kitchen_fan', 'fan.dining_fan',
            'fan.living_room_fan_1', 'fan.living_room_fan_2'];
          const running = fanIds.filter((id) => states[id]?.state === 'on').length;
          if (running > 0) return {
            name: 'Fans', label: running === 1 ? '1 room cooling' : `${running} fans running`,
            icon: 'mdi:fan', color: 'var(--blue)'
          };
          const humidity = states['sensor.home_humidity'];
          const value = Number(humidity?.state);
          return {
            name: 'Humidity', label: Number.isFinite(value) ? `${Math.round(value)}%` : 'Unavailable',
            icon: 'mdi:water-percent', color: 'var(--blue)'
          };
        ]]]
    name: '[[[ return variables.context.name; ]]]'
    label: '[[[ return variables.context.label; ]]]'
    icon: '[[[ return variables.context.icon; ]]]'
    styles:
      icon:
        - color: '[[[ return variables.context.color; ]]]'

  family_ribbon_attention:
    template: family_ribbon
    entity: sensor.home_state
    variables:
      context: |
        [[[
          if (entity && entity.state !== 'connected') return {
            name: 'Internet', label: 'Needs attention',
            icon: 'mdi:wifi-alert', color: 'var(--red)'
          };
          const storm = Number(states['sensor.home_thunderstorm_probability']?.state);
          if (Number.isFinite(storm) && storm >= 30) return {
            name: 'Storm chance', label: `${Math.round(storm)}%`,
            icon: 'mdi:weather-lightning-rainy', color: storm >= 60 ? 'var(--red)' : 'var(--yellow)'
          };
          const battery = Number(states['sensor.pixel_8_battery_level']?.state);
          if (user?.name === 'Abhimanyu' && Number.isFinite(battery) && battery < 25) return {
            name: 'Phone battery', label: `${Math.round(battery)}%`,
            icon: 'mdi:battery-alert-variant-outline', color: 'var(--red)'
          };
          const apparent = Number(states['sensor.home_apparent_temperature']?.state);
          if (Number.isFinite(apparent) && apparent >= 38) return {
            name: 'Feels like', label: `${Math.round(apparent)}°C`,
            icon: 'mdi:sun-thermometer-outline', color: 'var(--orange)'
          };
          return {
            name: 'Today',
            label: new Date().toLocaleDateString([], {weekday: 'short', day: 'numeric', month: 'short'}),
            icon: 'mdi:calendar-today-outline', color: 'var(--contrast10)'
          };
        ]]]
    name: '[[[ return variables.context.name; ]]]'
    label: '[[[ return variables.context.label; ]]]'
    icon: '[[[ return variables.context.icon; ]]]'
    styles:
      icon:
        - color: '[[[ return variables.context.color; ]]]'

  family_ribbon_sunset:
    template: family_ribbon
    entity: sensor.sun_next_setting
    name: Sunset
    icon: mdi:weather-sunset-down
    label: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const setting = new Date(entity.state);
        if (Number.isNaN(setting.getTime())) return 'Unavailable';
        return setting.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      ]]]
    styles:
      icon:
        - color: var(--yellow)

  family_media:
    template: family_status
    state_display: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state === 'playing') {
          return entity.attributes.media_title || 'Playing now';
        }
        if (entity.state === 'paused') return 'Paused';
        return 'Ready';
      ]]]
    styles:
      card:
        - height: 82px
        - background: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--purple)'
                : 'var(--contrast2)';
            ]]]
      icon:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--black)'
                : 'var(--purple)';
            ]]]
      name:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
      state:
        - color: |
            [[[
              return entity && entity.state === 'playing'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]

  family_room:
    show_icon: true
    show_state: false
    show_label: true
    label: |
      [[[
        if (!entity || entity.state === 'unavailable') return 'Unavailable';
        if (entity.state !== 'on') return 'Fan is off';
        const speed = entity.attributes.percentage;
        return speed == null ? 'Running' : `Running · ${speed}%`;
      ]]]
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: |
            [[[
              if (entity && entity.state === 'on') return variables.accent;
              return 'var(--contrast2)';
            ]]]
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 136px
      img_cell:
        - align-self: start
        - justify-self: end
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - background: |
            [[[
              if (entity && entity.state === 'on') return 'rgba(0, 0, 0, 0.13)';
              return 'var(--contrast4)';
            ]]]
      icon:
        - width: 21px
        - color: |
            [[[
              if (entity && entity.state === 'on') return 'var(--black)';
              if (entity && entity.state === 'unavailable') return 'var(--red)';
              return 'var(--contrast16)';
            ]]]
      name:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]
        - font-size: 16px
        - font-weight: 650
      label:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return entity && entity.state === 'on'
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
        - font-size: 12px
        - font-weight: 500
        - padding-top: 4px

  family_area_summary:
    show_icon: true
    show_state: false
    show_label: true
    label: |
      [[[
        const devices = (variables.entities || []).map((id) => states[id]).filter(Boolean);
        const available = devices.filter((item) => !['unknown', 'unavailable'].includes(item.state));
        const running = available.filter((item) => item.state === 'on');
        if (running.length === 1) {
          const speed = running[0].attributes.percentage;
          return speed == null ? 'Cooling now' : `Cooling now · ${speed}%`;
        }
        if (running.length > 1) return `${running.length} fans cooling`;
        if (!available.length) return devices.length > 1 ? 'Fan power is off' : 'Device power is off';
        return 'Quiet and ready';
      ]]]
    tap_action:
      action: navigate
      navigation_path: /home-tablet/rooms
    hold_action:
      action: none
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: |
            [[[
              const running = (variables.entities || []).some((id) => states[id]?.state === 'on');
              return running
                ? variables.accent
                : 'var(--contrast2)';
            ]]]
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 116px
      img_cell:
        - align-self: start
        - justify-self: start
        - width: 34px
        - height: 34px
        - border-radius: 12px
        - background: |
            [[[
              const running = (variables.entities || []).some((id) => states[id]?.state === 'on');
              return running
                ? 'rgba(0, 0, 0, 0.13)'
                : 'var(--contrast4)';
            ]]]
      icon:
        - width: 19px
        - color: |
            [[[
              const devices = (variables.entities || []).map((id) => states[id]).filter(Boolean);
              if (devices.some((item) => item.state === 'on')) return 'var(--black)';
              if (devices.length && devices.every((item) => item.state === 'unavailable')) return 'var(--contrast9)';
              return 'var(--contrast16)';
            ]]]
      name:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return (variables.entities || []).some((id) => states[id]?.state === 'on')
                ? 'var(--black)'
                : 'var(--contrast20)';
            ]]]
        - font-size: 15px
        - font-weight: 650
      label:
        - align-self: end
        - justify-self: start
        - color: |
            [[[
              return (variables.entities || []).some((id) => states[id]?.state === 'on')
                ? 'rgba(0, 0, 0, 0.62)'
                : 'var(--contrast10)';
            ]]]
        - font-size: 11px
        - font-weight: 500
        - padding-top: 3px

  family_camera_offline:
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    icon: mdi:video-off-outline
    label: |
      [[[
        if (!entity?.last_updated) return 'Connection unavailable · Open camera wall';
        const changed = new Date(entity.last_updated);
        const minutes = Math.max(1, Math.round((Date.now() - changed.getTime()) / 60000));
        const since = minutes < 60 ? `${minutes} min ago`
          : minutes < 1440 ? `${Math.round(minutes / 60)} hr ago`
          : `${Math.round(minutes / 1440)} d ago`;
        return `Last checked ${since} · Open camera wall`;
      ]]]
    tap_action:
      action: navigate
      navigation_path: /home-tablet/cameras
    styles:
      card:
        - height: auto
        - aspect-ratio: 16 / 9
        - min-height: 174px
        - border-radius: 28px
        - background: radial-gradient(circle at 50% 35%, var(--contrast4), var(--contrast2) 52%)
        - box-shadow: none
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-rows: 1fr min-content min-content
      img_cell:
        - align-self: center
        - width: 52px
        - height: 52px
        - border-radius: 50%
        - background: var(--contrast4)
      icon:
        - width: 25px
        - color: var(--contrast9)
      name:
        - justify-self: start
        - padding: 0 18px 3px
        - color: var(--contrast12)
        - font-size: 14px
        - font-weight: 600
      label:
        - justify-self: start
        - padding: 0 18px 16px
        - color: var(--contrast9)
        - font-size: 11px
        - font-weight: 500

  family_now_playing:
    show_icon: true
    show_entity_picture: true
    show_name: true
    show_state: true
    name: |
      [[[
        return entity?.attributes.media_series_title
          || entity?.attributes.media_artist
          || entity?.attributes.friendly_name
          || 'Now playing';
      ]]]
    state_display: |
      [[[
        if (!entity) return 'Unavailable';
        const title = entity.attributes.media_title;
        return title || (entity.state === 'paused' ? 'Paused' : 'Playing now');
      ]]]
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 62px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 13px
      card:
        - height: 88px
        - padding: 12px
        - border-radius: 24px
        - background: var(--contrast2)
        - box-shadow: none
      img_cell:
        - width: 62px
        - height: 62px
        - border-radius: 17px
        - background: var(--contrast4)
        - overflow: hidden
      entity_picture:
        - width: 100%
        - height: 100%
        - object-fit: cover
      icon:
        - width: 25px
        - color: var(--purple)
      name:
        - justify-self: start
        - align-self: end
        - color: var(--contrast11)
        - font-size: 11px
        - font-weight: 550
      state:
        - justify-self: start
        - align-self: start
        - color: var(--contrast20)
        - font-size: 15px
        - font-weight: 650
        - text-overflow: ellipsis
        - overflow: hidden
        - white-space: nowrap
        - max-width: 260px

  family_jellyfin_viewing:
    show_icon: true
    show_entity_picture: true
    show_name: true
    show_state: true
    show_label: true
    name: |
      [[[
        const viewer = entity?.attributes.viewer || 'Unknown viewer';
        const device = entity?.attributes.device_name;
        return device && device.toLowerCase() !== viewer.toLowerCase()
          ? `${viewer} · ${device}`
          : viewer;
      ]]]
    state_display: |
      [[[
        if (!entity) return 'Unavailable';
        const series = entity.attributes.media_series_title;
        const title = entity.attributes.media_title;
        return series && title ? `${series} · ${title}` : title || series || 'Watching';
      ]]]
    label: |
      [[[
        if (!entity) return '';
        const season = entity.attributes.media_season;
        const episode = entity.attributes.media_episode;
        const number = season != null && episode != null ? `S${season} E${episode} · ` : '';
        const status = entity.state === 'paused' ? 'Paused' : 'Watching now';
        const client = entity.attributes.client_name;
        return `${number}${status}${client ? ` on ${client}` : ''}`;
      ]]]
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i n" "i s" "i l"'
        - grid-template-columns: 70px 1fr
        - grid-template-rows: min-content min-content min-content
        - column-gap: 14px
      card:
        - height: 102px
        - padding: 14px
        - border-radius: 24px
        - background: var(--contrast2)
        - box-shadow: none
      img_cell:
        - width: 70px
        - height: 70px
        - border-radius: 18px
        - background: var(--contrast4)
        - overflow: hidden
      entity_picture:
        - width: 100%
        - height: 100%
        - object-fit: cover
      icon:
        - width: 27px
        - color: var(--purple)
      name:
        - justify-self: start
        - align-self: end
        - color: var(--purple)
        - font-size: 11px
        - font-weight: 650
        - text-transform: none
      state:
        - justify-self: start
