type: grid
column_span: 3
visibility:
  - condition: user
    users: !include ../../access/generated/profile-manisha-users.json
cards:
  - type: heading
    heading: Manisha · Health
    heading_style: title
    icon: mdi:heart-pulse
    grid_options: { columns: 36, rows: 1 }
  - type: heading
    heading: Today
    heading_style: subtitle
    icon: mdi:calendar-today-outline
    grid_options: { columns: 36, rows: 1 }
  - type: custom:button-card
    template: health_metric
    entity: sensor.iphone_steps
    name: Steps
    icon: mdi:walk
    variables: { format: steps, stale_hours: 26 }
    styles:
      card: [{ "--health-accent": var(--green) }]
    grid_options: { columns: 12, rows: auto }
  - type: custom:button-card
    template: health_metric
    entity: sensor.iphone_distance
    name: Distance
    icon: mdi:map-marker-distance
    variables: { format: distance, stale_hours: 26 }
    styles:
      card: [{ "--health-accent": var(--blue) }]
    grid_options: { columns: 12, rows: auto }
  - type: custom:button-card
    template: health_metric
    entity: sensor.iphone_average_active_pace
    name: Active pace
    icon: mdi:speedometer
    variables: { format: pace, stale_hours: 26 }
    styles:
      card: [{ "--health-accent": var(--pink) }]
    grid_options: { columns: 12, rows: auto }
  - type: custom:button-card
    template: health_metric
    entity: sensor.iphone_floors_ascended
    name: Floors ascended
    icon: mdi:stairs-up
    variables: { format: floors, stale_hours: 26 }
    styles:
      card: [{ "--health-accent": var(--orange) }]
    grid_options: { columns: 12, rows: auto }
  - type: custom:button-card
    template: health_metric
    entity: sensor.iphone_floors_descended
    name: Floors descended
    icon: mdi:stairs-down
    variables: { format: floors, stale_hours: 26 }
    styles:
      card: [{ "--health-accent": var(--purple) }]
    grid_options: { columns: 12, rows: auto }
  - type: custom:button-card
    template: health_metric
    entity: sensor.iphone_activity
    name: Current activity
    icon: mdi:run
    variables: { format: activity, stale_hours: 6 }
    styles:
      card: [{ "--health-accent": var(--teal) }]
    grid_options: { columns: 12, rows: auto }
