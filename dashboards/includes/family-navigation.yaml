type: custom:navbar-card
grid_options:
  columns: 1
  rows: 1
desktop:
  position: left
  min_width: 900
  show_labels: true
mobile:
  show_labels: false
routes:
  - icon: mdi:home-outline
    icon_selected: mdi:home-heart
    url: /home-tablet/home
    label: Home
  - icon: mdi:sofa-outline
    icon_selected: mdi:sofa
    url: /home-tablet/rooms
    label: Rooms
    selected: |
      [[[
        return window.location.pathname === '/home-tablet/rooms' ||
          window.location.pathname.startsWith('/home-tablet/rooms/');
      ]]]
    badge:
      show: |
        [[[
          const fans = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
            'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
            'fan.dining_fan', 'fan.living_room_fan_1',
            'fan.living_room_fan_2'];
          return fans.some((id) => states[id]?.state === 'on');
        ]]]
      count: |
        [[[
          const fans = ['fan.master_bedroom_fan', 'fan.bedroom_fan',
            'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan',
            'fan.dining_fan', 'fan.living_room_fan_1',
            'fan.living_room_fan_2'];
          return fans.filter((id) => states[id]?.state === 'on').length;
        ]]]
      color: var(--yellow)
  - icon: mdi:cctv
    icon_selected: mdi:video
    url: /home-tablet/cameras
    label: Cameras
  - icon: mdi:shield-home-outline
    icon_selected: mdi:shield-home
    url: /home-tablet/security
    label: Security
  - icon: mdi:account-group-outline
    icon_selected: mdi:account-group
    url: /home-tablet/people
    label: People
  - icon: mdi:dots-horizontal
    icon_selected: mdi:dots-horizontal-circle
    label: More
    tap_action:
      action: open-popup
    selected: |
      [[[
        return ['/home-tablet/health', '/home-tablet/maintenance',
          '/rack-admin/overview', '/config/dashboard']
          .some((path) => window.location.pathname.startsWith(path));
      ]]]
    hidden: |
      [[[
        return navbar.isDesktop || (!user?.is_admin &&
          user?.id !== '9302d11f48c64fe796a3c9e5cb563650');
      ]]]
    popup: |
      [[[
        const items = [];
        if (user?.id === '9302d11f48c64fe796a3c9e5cb563650') {
          items.push({
            icon: 'mdi:heart-pulse',
            icon_selected: 'mdi:heart',
            label: 'Health',
            url: '/home-tablet/health',
          });
        }
        if (user?.is_admin) {
          items.push(
            {
              icon: 'mdi:tools',
              icon_selected: 'mdi:toolbox',
              label: 'Maintenance',
              url: '/home-tablet/maintenance',
            },
            {
              icon: 'mdi:server-network-outline',
              icon_selected: 'mdi:server-network',
              label: 'Rack',
              url: '/rack-admin/overview',
            },
            {
              icon: 'mdi:cog-outline',
              icon_selected: 'mdi:cog',
              label: 'Settings',
              url: '/config/dashboard',
            },
          );
        }
        return items;
      ]]]
  - icon: mdi:heart-pulse
    icon_selected: mdi:heart
    url: /home-tablet/health
    label: Health
    hidden: |
      [[[
        return !navbar.isDesktop ||
          user?.id !== '9302d11f48c64fe796a3c9e5cb563650';
      ]]]
  - icon: mdi:tools
    icon_selected: mdi:toolbox
    url: /home-tablet/maintenance
    label: Maintenance
    hidden: |
      [[[
        return !navbar.isDesktop || !user?.is_admin;
      ]]]
  - icon: mdi:server-network-outline
    icon_selected: mdi:server-network
    url: /rack-admin/overview
    label: Rack
    hidden: |
      [[[
        return !navbar.isDesktop || !user?.is_admin;
      ]]]
  - icon: mdi:cog-outline
    icon_selected: mdi:cog
    url: /config/dashboard
    label: Settings
    hidden: |
      [[[
        return !navbar.isDesktop || !user?.is_admin;
      ]]]
styles: |
  .navbar {
    --navbar-primary-color: var(--purple);
    box-sizing: border-box;
    background: var(--contrast2);
    border: 1px solid var(--contrast4);
    border-radius: 30px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
  }
  @media (max-width: 899px) {
    .navbar.mobile {
      width: auto !important;
      right: 8px !important;
      bottom: max(8px, env(safe-area-inset-bottom)) !important;
      left: 8px !important;
      border-radius: 22px;
    }
    .navbar.mobile .route {
      min-width: 48px;
      min-height: 52px;
    }
  }
