kiosk_mode:
  hide_header: true

button_card_templates:
  rack_metric:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: var(--metric-accent, var(--blue))
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 132px
      img_cell:
        - align-self: start
        - justify-self: end
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - background: rgba(0, 0, 0, 0.12)
      icon:
        - width: 21px
        - color: var(--black)
      name:
        - justify-self: start
        - color: var(--black)
        - font-size: 11px
        - font-weight: 550
        - opacity: 0.62
      state:
        - justify-self: start
        - color: var(--black)
        - font-size: 17px
        - font-weight: 720
        - padding-top: 3px

  rack_ready:
    template: rack_metric
    icon: mdi:kubernetes
    styles:
      card:
        - background: |
            [[[
              const ready = ['true', 'ready', 'on', '1'].includes(
                String(entity?.state).toLowerCase());
              return ready ? 'var(--green)' : 'var(--red)';
            ]]]

views:
  - title: Rack
    path: overview
    icon: mdi:server-network
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # Rack
          Private infrastructure health, grouped for diagnosis instead of decoration.
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 32px; letter-spacing: -1.2px; margin-bottom: 6px; }
    badges:
      - type: entity
        entity: sensor.k8s_rpi1_kubernetes_ready
        name: rpi1
        show_name: true
        show_state: true
        color: green
      - type: entity
        entity: sensor.k8s_rpi2_kubernetes_ready
        name: rpi2
        show_name: true
        show_state: true
        color: green
      - type: entity
        entity: sensor.k8s_rpi3_kubernetes_ready
        name: rpi3
        show_name: true
        show_state: true
        color: green
      - type: entity
        entity: sensor.usw_pro_aggregation_temperature
        name: Aggregation
        show_name: true
        show_state: true
        color: blue
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:navbar-card
            desktop:
              position: left
              min_width: 768
              show_labels: true
            routes:
              - icon: mdi:home-outline
                icon_selected: mdi:home-heart
                url: /home-tablet/home
                label: Home
              - icon: mdi:server-network-outline
                icon_selected: mdi:server-network
                url: /rack-admin/overview
                label: Rack
              - icon: mdi:cctv
                url: /home-tablet/cameras
                label: Cameras
              - icon: mdi:cog-outline
                icon_selected: mdi:cog
                url: /config/dashboard
                label: Settings
            styles: |
              .navbar {
                --navbar-primary-color: var(--blue);
                background: var(--contrast2);
                border: 1px solid var(--contrast4);
              }
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Kubernetes
            heading_style: title
            icon: mdi:kubernetes
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:button-card
                template: rack_ready
                entity: sensor.k8s_rpi1_kubernetes_ready
                name: k8s-rpi1
              - type: custom:button-card
                template: rack_ready
                entity: sensor.k8s_rpi2_kubernetes_ready
                name: k8s-rpi2
              - type: custom:button-card
                template: rack_ready
                entity: sensor.k8s_rpi3_kubernetes_ready
                name: k8s-rpi3
              - type: custom:button-card
                template: rack_metric
                entity: sensor.k8s_rpi1_cpu_temperature
                name: rpi1 CPU
                icon: mdi:raspberry-pi
                styles:
                  card:
                    - --metric-accent: var(--purple)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.k8s_rpi2_cpu_temperature
                name: rpi2 CPU
                icon: mdi:raspberry-pi
                styles:
                  card:
                    - --metric-accent: var(--orange)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.k8s_rpi3_cpu_temperature
                name: rpi3 CPU
                icon: mdi:raspberry-pi
                styles:
                  card:
                    - --metric-accent: var(--teal)
      - type: grid
        cards:
          - type: heading
            heading: Network
            heading_style: title
            icon: mdi:switch
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:button-card
                template: rack_metric
                entity: sensor.usw_pro_aggregation_temperature
                name: USW Pro Aggregation
                icon: mdi:switch
                styles:
                  card:
                    - --metric-accent: var(--blue)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.home_home_cpu_temperature
                name: UniFi CPU
                icon: mdi:router-network
                styles:
                  card:
                    - --metric-accent: var(--purple)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.home_home_local_temperature
                name: Rack ambient
                icon: mdi:thermometer
                styles:
                  card:
                    - --metric-accent: var(--yellow)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.jellyfin_5876476948_vc8dc_active_clients
                name: Jellyfin clients
                icon: mdi:jellyfish
                styles:
                  card:
                    - --metric-accent: var(--pink)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.uptime
                name: HA started
                icon: mdi:home-assistant
                styles:
                  card:
                    - --metric-accent: var(--green)
      - type: grid
        cards:
          - type: heading
            heading: Protect
            heading_style: title
            icon: mdi:shield-home-outline
          - type: picture-entity
            entity: camera.g5_turret_ultra_high_resolution_channel
            name: Outside context
            camera_view: auto
            fit_mode: cover
            aspect_ratio: "4:3"
            show_state: false
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { overflow: hidden; border-radius: 28px; }
          - type: picture-entity
            entity: camera.hallway_high_resolution_channel
            name: Hallway context
            camera_view: auto
            fit_mode: cover
            aspect_ratio: "16:9"
            show_state: false
            tap_action:
              action: more-info
