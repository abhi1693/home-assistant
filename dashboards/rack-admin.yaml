kiosk_mode:
  hide_header: true

button_card_templates:
  rack_metric:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      card:
        - background: var(--metric-accent, var(--blue))
        - border-radius: 24px
        - box-shadow: none
        - padding: 14px
        - height: 132px
      img_cell:
        - align-self: start
        - justify-self: end
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - background: rgba(0, 0, 0, 0.12)
      icon:
        - width: 21px
        - color: var(--black)
      name:
        - justify-self: start
        - color: var(--black)
        - font-size: 11px
        - font-weight: 550
        - opacity: 0.62
      state:
        - justify-self: start
        - color: var(--black)
        - font-size: 17px
        - font-weight: 720
        - padding-top: 3px

  rack_temperature:
    template: rack_metric
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state} °C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)} °C`;
      ]]]

  rack_ready:
    template: rack_metric
    icon: mdi:kubernetes
    styles:
      card:
        - background: |
            [[[
              const ready = ['true', 'ready', 'on', '1'].includes(
                String(entity?.state).toLowerCase());
              return ready ? 'var(--green)' : 'var(--red)';
            ]]]

views:
  - title: Rack
    path: overview
    icon: mdi:server-network
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |-
          # Rack
          Private infrastructure health, grouped for diagnosis instead of decoration.
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 32px; letter-spacing: -1.2px; margin-bottom: 6px; }
    badges:
      - type: entity
        entity: sensor.rack_ready_nodes
        name: Nodes
        show_name: true
        show_state: true
        color: green
      - type: entity
        entity: sensor.rack_active_alerts
        name: Alerts
        show_name: true
        show_state: true
        color: orange
      - type: entity
        entity: sensor.usw_pro_aggregation_temperature
        name: Aggregation
        show_name: true
        show_state: true
        color: blue
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cluster
            heading_style: title
            icon: mdi:kubernetes
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:button-card
                template: rack_metric
                entity: sensor.rack_ready_nodes
                name: Ready nodes
                icon: mdi:kubernetes
                styles:
                  card:
                    - --metric-accent: var(--green)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.rack_unhealthy_workloads
                name: Workloads
                icon: mdi:alert-decagram-outline
                styles:
                  card:
                    - --metric-accent: var(--orange)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.rack_fleet_failures
                name: Fleet failures
                icon: mdi:git
                styles:
                  card:
                    - --metric-accent: var(--purple)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.rack_degraded_volumes
                name: Degraded volumes
                icon: mdi:harddisk-remove
                styles:
                  card:
                    - --metric-accent: var(--red)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.rack_unreachable_targets
                name: Unreachable targets
                icon: mdi:access-point-network-off
                styles:
                  card:
                    - --metric-accent: var(--yellow)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.rack_active_alerts
                name: Active alerts
                icon: mdi:alert-outline
                styles:
                  card:
                    - --metric-accent: var(--pink)
      - type: grid
        cards:
          - type: heading
            heading: Power
            heading_style: title
            icon: mdi:power-plug-battery-outline
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:button-card
                template: rack_metric
                entity: sensor.ups_status
                name: UPS status
                icon: mdi:power-plug
                styles:
                  card:
                    - --metric-accent: var(--green)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.ups_battery_charge
                name: Battery
                icon: mdi:battery-high
                styles:
                  card:
                    - --metric-accent: var(--blue)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.ups_load
                name: Load
                icon: mdi:gauge
                styles:
                  card:
                    - --metric-accent: var(--yellow)
      - type: grid
        cards:
          - type: heading
            heading: Network
            heading_style: title
            icon: mdi:switch
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:button-card
                template: rack_temperature
                entity: sensor.usw_pro_aggregation_temperature
                name: USW Pro Aggregation
                icon: mdi:switch
                styles:
                  card:
                    - --metric-accent: var(--blue)
              - type: custom:button-card
                template: rack_temperature
                entity: sensor.unifi_cpu_temperature_celsius
                name: UniFi CPU
                icon: mdi:router-network
                styles:
                  card:
                    - --metric-accent: var(--purple)
              - type: custom:button-card
                template: rack_temperature
                entity: sensor.rack_ambient_temperature_celsius
                name: Rack ambient
                icon: mdi:thermometer
                styles:
                  card:
                    - --metric-accent: var(--yellow)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.jellyfin_5876476948_vc8dc_active_clients
                name: Jellyfin clients
                icon: mdi:jellyfish
                styles:
                  card:
                    - --metric-accent: var(--pink)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.uptime
                name: HA started
                icon: mdi:home-assistant
                styles:
                  card:
                    - --metric-accent: var(--green)
              - type: custom:button-card
                template: rack_metric
                entity: sensor.rack_database_backup_age
                name: Database backup age
                icon: mdi:database-clock-outline
                styles:
                  card:
                    - --metric-accent: var(--teal)
      - type: grid
        cards:
          - type: heading
            heading: Protect
            heading_style: title
            icon: mdi:shield-home-outline
          - type: picture-entity
            entity: camera.g5_turret_ultra_high_resolution_channel
            name: Outside context
            camera_view: live
            fit_mode: cover
            aspect_ratio: "4:3"
            show_state: false
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { overflow: hidden; border-radius: 28px; }
          - type: picture-entity
            entity: camera.hallway_high_resolution_channel
            name: Hallway context
            camera_view: live
            fit_mode: cover
            aspect_ratio: "16:9"
            show_state: false
            tap_action:
              action: more-info
      - type: grid
        column_span: 4
        cards:
          - !include includes/family-navigation.yaml
