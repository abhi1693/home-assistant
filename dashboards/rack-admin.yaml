kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  rack_metric:
    show_icon: true
    show_state: true
    show_name: true
    tap_action:
      action: none
    styles:
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 46px minmax(0, 1fr)
        - grid-template-rows: min-content min-content
        - column-gap: 12px
      card:
        - min-height: 94px
        - padding: 16px
        - border-radius: 22px
        - background: var(--contrast2)
        - border: 1px solid var(--contrast4)
        - box-shadow: none
      img_cell:
        - grid-area: i
        - width: 42px
        - height: 42px
        - border-radius: 14px
        - background: color-mix(in srgb, var(--metric-accent, var(--blue)) 14%, var(--contrast3))
      icon:
        - width: 23px
        - color: var(--metric-accent, var(--blue))
      name:
        - grid-area: n
        - justify-self: start
        - color: var(--contrast10)
        - font-size: 12px
        - font-weight: 650
      state:
        - grid-area: s
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 18px
        - font-weight: 740
        - line-height: 1.25

  rack_temperature:
    template: rack_metric
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return `${entity.state} °C`;
        const unit = entity.attributes.unit_of_measurement;
        const celsius = unit === '°F'
          ? (value - 32) * 5 / 9
          : unit === 'K' ? value - 273.15 : value;
        const precision = Math.abs(celsius - Math.round(celsius)) < 0.05 ? 0 : 1;
        return `${celsius.toFixed(precision)} °C`;
      ]]]

  rack_ready_nodes:
    template: rack_metric
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const total = Number(entity.attributes.total_nodes);
        return Number.isFinite(total) ? `${entity.state} of ${total}` : entity.state;
      ]]]

  rack_uptime:
    template: rack_metric
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const started = new Date(entity.state);
        const elapsed = Date.now() - started.getTime();
        if (!Number.isFinite(elapsed) || elapsed < 0) return entity.state;
        const days = Math.floor(elapsed / 86400000);
        const hours = Math.floor((elapsed % 86400000) / 3600000);
        if (days > 0) return `${days}d ${hours}h`;
        return hours > 0 ? `${hours}h` : '<1h';
      ]]]

  rack_bridge_age:
    template: rack_metric
    state_display: |
      [[[
        const generated = entity?.attributes?.generated_at;
        if (!generated) return 'Unavailable';
        const seconds = Math.max(0, Math.floor((Date.now() - new Date(generated).getTime()) / 1000));
        if (!Number.isFinite(seconds)) return 'Unavailable';
        if (seconds < 60) return `${seconds}s old`;
        const minutes = Math.floor(seconds / 60);
        return `${minutes}m old`;
      ]]]

  rack_duration_hours:
    template: rack_metric
    state_display: |
      [[[
        if (!entity || ['unknown', 'unavailable'].includes(entity.state)) {
          return 'Unavailable';
        }
        const value = Number(entity.state);
        if (!Number.isFinite(value)) return entity.state;
        const totalMinutes = Math.round(value * 60);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return minutes > 0 ? `${hours}h ${minutes}m` : `${hours}h`;
      ]]]

  rack_issue:
    variables:
      singular: issue
      plural: issues
      detail: Open the entity for source details
      detail_attribute: null
      destination: >-
        http://grafana.home/d/9fa0d141-d019-4ad7-8bc5-42196ee308bd/prometheus-overview?orgId=1&from=now-1h&to=now
      state_text: null
    show_icon: true
    show_name: true
    show_state: true
    show_label: true
    state_display: |
      [[[
        if (variables.state_text) return variables.state_text;
        const value = Number(entity?.state);
        if (!Number.isFinite(value)) return entity?.state || 'Unavailable';
        const noun = value === 1 ? variables.singular : variables.plural;
        return `${value} ${noun}`;
      ]]]
    label: |
      [[[
        const details = variables.detail_attribute
          ? entity?.attributes?.[variables.detail_attribute] : null;
        if (Array.isArray(details) && details.length > 0) {
          return details.join(' · ');
        }
        return variables.detail;
      ]]]
    tap_action:
      action: url
      url_path: '[[[ return variables.destination; ]]]'
    styles:
      grid:
        - grid-template-areas: '"i n" "i s" "i l"'
        - grid-template-columns: 46px minmax(0, 1fr)
        - grid-template-rows: min-content min-content min-content
        - column-gap: 12px
      card:
        - min-height: 106px
        - padding: 16px
        - border-radius: 22px
        - background: color-mix(in srgb, var(--orange) 9%, var(--contrast2))
        - border: 1px solid color-mix(in srgb, var(--orange) 35%, var(--contrast4))
        - box-shadow: none
      img_cell:
        - grid-area: i
        - width: 42px
        - height: 42px
        - border-radius: 14px
        - background: color-mix(in srgb, var(--orange) 16%, var(--contrast3))
      icon:
        - width: 23px
        - color: var(--orange)
      name:
        - grid-area: n
        - justify-self: start
        - color: var(--contrast11)
        - font-size: 12px
        - font-weight: 650
      state:
        - grid-area: s
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 17px
        - font-weight: 740
      label:
        - grid-area: l
        - justify-self: start
        - color: var(--contrast9)
        - font-size: 11px
        - white-space: normal
        - display: -webkit-box
        - -webkit-line-clamp: 2
        - -webkit-box-orient: vertical
        - overflow: hidden

  rack_overview:
    entity: sensor.rack_summary_status
    variables:
      context: |
        [[[
          const generated = entity?.attributes?.generated_at;
          const elapsed = generated ? Date.now() - new Date(generated).getTime() : Infinity;
          const bridgeHealthy = states['binary_sensor.rack_status_bridge_fresh']?.state === 'on';
          const dataComplete = states['binary_sensor.rack_status_data_complete']?.state === 'on';
          const numericIds = [
            'sensor.rack_unready_nodes',
            'sensor.rack_unhealthy_workloads',
            'sensor.rack_fleet_failures',
            'sensor.rack_degraded_volumes',
            'sensor.rack_unreachable_targets',
            'sensor.rack_active_alerts',
          ];
          let issues = bridgeHealthy ? 0 : 1;
          if (bridgeHealthy && !dataComplete) issues += 1;
          if (bridgeHealthy && dataComplete) {
            for (const id of numericIds) {
              const value = Number(states[id]?.state);
              if (value > 0) issues += 1;
            }
            const backupAge = Number(states['sensor.rack_database_backup_age']?.state);
            if (backupAge > 24) issues += 1;
            const ups = states['binary_sensor.rack_ups_on_battery']?.state;
            if (ups === 'on') issues += 1;
          }
          const ready = states['sensor.rack_ready_nodes'];
          const nodes = ready?.attributes?.total_nodes
            ? `${ready.state} of ${ready.attributes.total_nodes} nodes ready`
            : 'Node readiness unavailable';
          const seconds = Number.isFinite(elapsed)
            ? Math.max(0, Math.floor(elapsed / 1000)) : null;
          const age = seconds === null ? null
            : seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m`;
          return {
            hasIssue: issues > 0,
            name: issues === 0 ? 'Everything operational'
              : `${issues} ${issues === 1 ? 'signal needs' : 'signals need'} attention`,
            label: generated && age ? `${nodes} · Status snapshot ${age} old`
              : 'Waiting for the infrastructure status bridge',
            icon: issues > 0 ? 'mdi:alert-circle-outline' : 'mdi:check-decagram-outline',
            color: issues > 0 ? 'var(--orange)' : 'var(--green)',
          };
        ]]]
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    name: '[[[ return variables.context.name; ]]]'
    label: '[[[ return variables.context.label; ]]]'
    icon: '[[[ return variables.context.icon; ]]]'
    tap_action:
      action: none
    styles:
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 58px minmax(0, 1fr)
        - grid-template-rows: min-content min-content
        - column-gap: 15px
      card:
        - min-height: 112px
        - padding: 20px
        - border-radius: 24px
        - box-shadow: none
        - background: '[[[ return `color-mix(in srgb, ${variables.context.color} 10%, var(--contrast2))`; ]]]'
        - border: '[[[ return `1px solid color-mix(in srgb, ${variables.context.color} 38%, var(--contrast4))`; ]]]'
      img_cell:
        - grid-area: i
        - width: 54px
        - height: 54px
        - border-radius: 18px
        - background: var(--contrast3)
      icon:
        - width: 29px
        - color: '[[[ return variables.context.color; ]]]'
      name:
        - grid-area: n
        - justify-self: start
        - color: var(--contrast20)
        - font-size: 20px
        - font-weight: 760
      label:
        - grid-area: l
        - justify-self: start
        - color: var(--contrast10)
        - font-size: 13px
        - white-space: normal

views:
  - title: Rack
    path: overview
    icon: mdi:server-network
    type: sections
    theme: Family Dark
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: |-
          # Rack
          {% set generated = state_attr('sensor.rack_summary_status', 'generated_at') %}
          Infrastructure triage for Kubernetes, storage, power, network and backups.{% if generated %} Status refreshed {{ relative_time(as_datetime(generated)) }} ago.{% else %} Waiting for the status bridge.{% endif %}
        card_mod:
          style: |
            ha-card { background: transparent; padding: 8px 0 4px; }
            h1 { font-size: 34px; letter-spacing: -1.2px; margin: 0 0 5px; }
            p { color: var(--contrast11); font-size: 15px; line-height: 1.45; }
    badges:
      - type: entity
        entity: sensor.rack_ready_nodes
        name: Nodes
        show_name: true
        show_state: true
      - type: entity
        entity: sensor.rack_active_alerts
        name: Alerts
        show_name: true
        show_state: true
      - type: entity
        entity: sensor.rack_power_source
        name: Power
        show_name: true
        show_state: true
      - type: entity
        entity: sensor.rack_database_backup_age
        name: Backup
        show_name: true
        show_state: true
    sections:
      - type: grid
        column_span: 4
        background: true
        cards:
          - type: heading
            heading: Operational status
            heading_style: title
            icon: mdi:heart-pulse
            grid_options: { columns: 48, rows: 1 }
          - type: custom:button-card
            template: rack_overview
            grid_options: { columns: 48, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: binary_sensor.rack_status_bridge_fresh
            name: Infrastructure snapshot
            icon: mdi:lan-disconnect
            variables:
              state_text: |
                [[[
                  return states['sensor.rack_summary_status']?.state === 'ok'
                    ? 'Snapshot is stale' : 'Status data unavailable';
                ]]]
              detail: Prometheus data is stale or unavailable
              destination: >-
                http://grafana.home/d/a164a7f0339f99e89cea5cb47e9be617/kubernetes-compute-resources-workload?orgId=1&from=now-1h&to=now&var-datasource=prometheus&var-cluster=&var-namespace=home-assistant&var-type=deployment&var-workload=home-assistant-status-bridge
            visibility:
              - condition: state
                entity: binary_sensor.rack_status_bridge_fresh
                state: "off"
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: binary_sensor.rack_status_data_complete
            name: Console inputs
            icon: mdi:database-alert-outline
            variables:
              state_text: Status data incomplete
              detail: One or more Rack inputs cannot be interpreted safely
              destination: >-
                http://grafana.home/d/9fa0d141-d019-4ad7-8bc5-42196ee308bd/prometheus-overview?orgId=1&from=now-1h&to=now&viewPanel=8
            visibility:
              - condition: state
                entity: binary_sensor.rack_status_bridge_fresh
                state: "on"
              - condition: state
                entity: binary_sensor.rack_status_data_complete
                state: "off"
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: sensor.rack_unready_nodes
            name: Kubernetes nodes
            icon: mdi:server-off
            variables:
              singular: node not ready
              plural: nodes not ready
              detail: Open the cluster node health dashboard
              detail_attribute: unready_node_details
              destination: >-
                http://grafana.home/d/rancher-cluster-nodes-1/rancher-cluster-nodes?orgId=1&from=now-1h&to=now
            visibility:
              - condition: numeric_state
                entity: sensor.rack_unready_nodes
                above: 0
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: sensor.rack_unhealthy_workloads
            name: Kubernetes workloads
            icon: mdi:alert-decagram-outline
            variables:
              singular: workload unhealthy
              plural: workloads unhealthy
              detail: Open the first affected workload
              detail_attribute: unhealthy_workload_details
              destination: |
                [[[
                  const details = entity?.attributes?.unhealthy_workload_details;
                  const first = Array.isArray(details)
                    ? details.find((detail) => !detail.startsWith('+')) : null;
                  const [namespace, workload] = first?.split('/', 2) || [];
                  const base = 'http://grafana.home/d/a164a7f0339f99e89cea5cb47e9be617/kubernetes-compute-resources-workload';
                  if (!namespace || !workload) return `${base}?orgId=1&from=now-1h&to=now`;
                  const params = new URLSearchParams({
                    orgId: '1', from: 'now-1h', to: 'now',
                    'var-datasource': 'prometheus', 'var-cluster': '',
                    'var-namespace': namespace, 'var-type': '.*',
                    'var-workload': workload,
                  });
                  return `${base}?${params.toString()}`;
                ]]]
            visibility:
              - condition: numeric_state
                entity: sensor.rack_unhealthy_workloads
                above: 0
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: sensor.rack_fleet_failures
            name: Fleet reconciliation
            icon: mdi:git
            variables:
              singular: bundle failing
              plural: bundles failing
              detail: Open the first failing Fleet bundle
              detail_attribute: fleet_failure_details
              destination: |
                [[[
                  const details = entity?.attributes?.fleet_failure_details;
                  const first = Array.isArray(details)
                    ? details.find((detail) => !detail.startsWith('+')) : null;
                  const match = first?.match(/^([^/]+)\/(.+?)(?:\s+\([^)]*\))?$/);
                  const base = 'http://grafana.home/d/fleet-bundle/fleet-bundle';
                  if (!match) return `${base}?orgId=1&from=now-1h&to=now`;
                  const params = new URLSearchParams({
                    orgId: '1', from: 'now-1h', to: 'now',
                    'var-namespace': match[1], 'var-name': match[2],
                  });
                  return `${base}?${params.toString()}`;
                ]]]
            visibility:
              - condition: numeric_state
                entity: sensor.rack_fleet_failures
                above: 0
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: sensor.rack_degraded_volumes
            name: Longhorn storage
            icon: mdi:harddisk-remove
            variables:
              singular: volume degraded
              plural: volumes degraded
              detail: Inspect replica health before attempting a repair
              detail_attribute: longhorn_degraded_volume_details
              destination: >-
                http://grafana.home/d/longhorn-storage/longhorn-storage?orgId=1&from=now-1h&to=now&viewPanel=15
            visibility:
              - condition: numeric_state
                entity: sensor.rack_degraded_volumes
                above: 0
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: sensor.rack_unreachable_targets
            name: Monitoring targets
            icon: mdi:access-point-network-off
            variables:
              singular: target unreachable
              plural: targets unreachable
              detail: Open the first failed scrape target
              detail_attribute: unreachable_target_details
              destination: |
                [[[
                  const details = entity?.attributes?.unreachable_target_details;
                  const first = Array.isArray(details)
                    ? details.find((detail) => !detail.startsWith('+')) : null;
                  const match = first?.match(/^([^/]+)\/(.+?)(?:\s+×\d+)?$/);
                  const base = 'http://prometheus.home/targets';
                  const params = new URLSearchParams({ search: match?.[2] || '' });
                  return `${base}?${params.toString()}`;
                ]]]
            visibility:
              - condition: numeric_state
                entity: sensor.rack_unreachable_targets
                above: 0
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: sensor.rack_active_alerts
            name: Monitoring alerts
            icon: mdi:alert-outline
            variables:
              singular: active alert
              plural: active alerts
              detail: Warning and critical alerts currently firing
              detail_attribute: active_alert_details
              destination: |
                [[[
                  return 'http://alertmanager.home/#/alerts?active=true&silenced=true&inhibited=true';
                ]]]
            visibility:
              - condition: numeric_state
                entity: sensor.rack_active_alerts
                above: 0
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: sensor.rack_database_backup_age
            name: Database backup
            icon: mdi:database-alert-outline
            variables:
              singular: hour since backup
              plural: hours since backup
              detail: The latest CloudNativePG base backup is older than 24 hours
              destination: >-
                http://grafana.home/d/cloudnative-pg/cloudnativepg?orgId=1&from=now-24h&to=now&var-DS_PROMETHEUS=prometheus&var-namespace=postgresql&var-cluster=postgresql&var-instances=postgresql-.*&viewPanel=360
            visibility:
              - condition: numeric_state
                entity: sensor.rack_database_backup_age
                above: 24
            grid_options: { columns: 12, rows: auto }
          - type: custom:button-card
            template: rack_issue
            entity: binary_sensor.rack_ups_on_battery
            name: Rack power
            icon: mdi:power-plug-battery-outline
            variables:
              state_text: Running on battery
              detail: Check battery charge and remaining UPS capacity
              destination: >-
                http://grafana.home/d/ups-nut-prometheus/ups-nut?orgId=1&from=now-6h&to=now&viewPanel=1
            visibility:
              - condition: state
                entity: binary_sensor.rack_ups_on_battery
                state: "on"
            grid_options: { columns: 12, rows: auto }
          - type: heading
            heading: Open diagnostics
            heading_style: subtitle
            icon: mdi:open-in-new
            grid_options: { columns: 48, rows: 1 }
          - type: button
            name: Grafana
            icon: mdi:chart-timeline-variant-shimmer
            tap_action:
              action: url
              url_path: http://grafana.home
            grid_options: { columns: 12, rows: 2 }
          - type: button
            name: Rancher
            icon: mdi:developer-board
            tap_action:
              action: url
              url_path: https://rancher.home
            grid_options: { columns: 12, rows: 2 }

      - type: grid
        column_span: 2
        background: true
        cards:
          - type: heading
            heading: Continuity
            heading_style: title
            icon: mdi:shield-check-outline
            grid_options: { columns: 24, rows: 1 }
          - type: custom:button-card
            template: rack_ready_nodes
            entity: sensor.rack_ready_nodes
            name: Ready nodes
            icon: mdi:kubernetes
            styles:
              card:
                - --metric-accent: var(--green)
            grid_options: { columns: 12, rows: 2 }
          - type: custom:button-card
            template: rack_uptime
            entity: sensor.uptime
            name: Home Assistant uptime
            icon: mdi:home-assistant
            styles:
              card:
                - --metric-accent: var(--green)
            grid_options: { columns: 12, rows: 2 }
          - type: custom:button-card
            template: rack_bridge_age
            entity: sensor.rack_summary_status
            name: Status snapshot age
            icon: mdi:lan-check
            styles:
              card:
                - --metric-accent: var(--blue)
            grid_options: { columns: 12, rows: 2 }
          - type: custom:button-card
            template: rack_duration_hours
            entity: sensor.rack_database_backup_age
            name: Database backup age
            icon: mdi:database-clock-outline
            styles:
              card:
                - --metric-accent: var(--teal)
            grid_options: { columns: 12, rows: 2 }

      - type: grid
        background: true
        cards:
          - type: heading
            heading: Power
            heading_style: title
            icon: mdi:power-plug-battery-outline
          - type: custom:button-card
            template: rack_metric
            entity: sensor.ups_status
            name: UPS status
            icon: mdi:power-plug
            styles:
              card:
                - --metric-accent: var(--green)
          - type: custom:button-card
            template: rack_metric
            entity: sensor.ups_battery_charge
            name: Battery charge
            icon: mdi:battery-high
            styles:
              card:
                - --metric-accent: var(--blue)
          - type: custom:button-card
            template: rack_metric
            entity: sensor.ups_load
            name: UPS load
            icon: mdi:gauge
            styles:
              card:
                - --metric-accent: var(--yellow)
          - type: history-graph
            title: Power · 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.ups_battery_charge
                name: Battery
                color: "#a9c7ff"
              - entity: sensor.ups_load
                name: Load
                color: "#ffda78"
            grid_options: { columns: full, rows: 4 }

      - type: grid
        background: true
        cards:
          - type: heading
            heading: Environment
            heading_style: title
            icon: mdi:thermometer-lines
          - type: custom:button-card
            template: rack_temperature
            entity: sensor.usw_pro_aggregation_temperature
            name: USW Pro Aggregation
            icon: mdi:switch
            styles:
              card:
                - --metric-accent: var(--blue)
          - type: custom:button-card
            template: rack_temperature
            entity: sensor.unifi_cpu_temperature_celsius
            name: UniFi CPU
            icon: mdi:router-network
            styles:
              card:
                - --metric-accent: var(--purple)
          - type: custom:button-card
            template: rack_temperature
            entity: sensor.rack_ambient_temperature_celsius
            name: UniFi local sensor
            icon: mdi:thermometer
            styles:
              card:
                - --metric-accent: var(--yellow)
          - type: history-graph
            title: Temperature · 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.usw_pro_aggregation_temperature
                name: Aggregation
                color: "#a9c7ff"
              - entity: sensor.unifi_cpu_temperature_celsius
                name: UniFi CPU
                color: "#efb1ff"
              - entity: sensor.rack_ambient_temperature_celsius
                name: UniFi local
                color: "#ffda78"
            grid_options: { columns: full, rows: 4 }

      - type: grid
        column_span: 4
        cards:
          - !include includes/family-navigation.yaml
