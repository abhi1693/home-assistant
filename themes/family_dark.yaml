Family Dark:
  card-mod-theme: Family Dark
  card-mod-root-yaml: |
    .: |
      @media (min-width: 768px) {
        :not(.edit-mode) > #view {
          padding-left: 112px !important;
        }
      }
  primary-font-family: "Inter, Poppins, system-ui, sans-serif"
  secondary-font-family: "Inter, Poppins, system-ui, sans-serif"
  paper-font-common-base_-_font-family: "var(--secondary-font-family)"
  paper-font-body1_-_font-family: "var(--secondary-font-family)"
  paper-font-subhead_-_font-family: "var(--secondary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  ha-card-header-font-family: "var(--primary-font-family)"
  primary-color: "var(--blue)"
  accent-color: "var(--blue)"
  primary-background-color: "var(--contrast1)"
  secondary-background-color: "var(--contrast2)"
  card-background-color: "var(--contrast2)"
  ha-card-background: "var(--contrast2)"
  primary-text-color: "var(--contrast20)"
  secondary-text-color: "var(--contrast10)"
  disabled-text-color: "var(--contrast7)"
  divider-color: "var(--contrast4)"
  app-header-background-color: "var(--contrast1)"
  app-header-text-color: "var(--contrast20)"
  sidebar-background-color: "var(--contrast2)"
  sidebar-text-color: "var(--contrast11)"
  sidebar-selected-background-color: "var(--contrast3)"
  sidebar-selected-text-color: "var(--blue)"
  paper-item-icon-color: "var(--contrast10)"
  paper-item-icon-active-color: "var(--yellow)"
  state-icon-color: "var(--contrast10)"
  state-icon-active-color: "var(--yellow)"
  switch-checked-color: "var(--green)"
  switch-unchecked-button-color: "var(--contrast9)"
  switch-unchecked-track-color: "var(--contrast5)"
  label-badge-background-color: "var(--contrast2)"
  label-badge-text-color: "var(--contrast20)"
  label-badge-red: "var(--red)"
  ha-card-border-width: "0px"
  ha-card-border-radius: "24px"
  ha-card-box-shadow: "none"
  ha-dialog-border-radius: "28px"
  grid-card-gap: "16px"
  bubble-main-background-color: "var(--contrast2)"
  bubble-secondary-background-color: "var(--contrast3)"
  bubble-accent-color: "var(--blue)"
  bubble-icon-background-color: "var(--contrast4)"
  bubble-border-radius: "22px"
  bubble-button-border-radius: "22px"
  bubble-pop-up-border-radius: "28px"
  bubble-sub-button-border-radius: "14px"
  bubble-font-size: "15px"
  bubble-name-font-size: "15px"
  black: "#000000"
  white: "#ffffff"
  purple: "#efb1ff"
  yellow: "#ffda78"
  orange: "#ffb86b"
  red: "#ff9b9b"
  green: "#9ee6b8"
  blue: "#a9c7ff"
  teal: "#8de2dd"
  pink: "#ffb5d8"
  purple-color: "var(--purple)"
  yellow-color: "var(--yellow)"
  orange-color: "var(--orange)"
  red-color: "var(--red)"
  green-color: "var(--green)"
  blue-color: "var(--blue)"
  teal-color: "var(--teal)"
  pink-color: "var(--pink)"
  contrast1: "#090b0f"
  contrast2: "#11151b"
  contrast3: "#191f27"
  contrast4: "#222a34"
  contrast5: "#2c3642"
  contrast6: "#374351"
  contrast7: "#465362"
  contrast8: "#596777"
  contrast9: "#718092"
  contrast10: "#8b99aa"
  contrast11: "#a2aebc"
