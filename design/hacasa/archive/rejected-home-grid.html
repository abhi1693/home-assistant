<div id="house-preview">
<style>
#house-preview{--house-bg:#101514;--house-panel:#1b2220;--house-raised:#252e2a;--house-text:#f2f0e8;--house-muted:#a5afa7;--house-accent:#d4e8a6;--house-line:#344039;font:15px/1.5 Inter,Segoe UI,sans-serif;color:var(--house-text)}
#house-preview *{box-sizing:border-box}#house-preview button{font:inherit;color:inherit;cursor:pointer}#house-preview .stage{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:28px;align-items:start}#house-preview .device-label{color:var(--house-muted);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;margin:0 0 12px}#house-preview .app{background:var(--house-bg);border:1px solid var(--house-line);border-radius:28px;overflow:hidden}#house-preview .phone-content{padding:26px 20px 18px}#house-preview .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}#house-preview .brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--house-accent)}#house-preview .avatar{width:34px;height:34px;border-radius:50%;background:var(--house-raised);display:grid;place-items:center;font-size:12px}#house-preview h1{font-size:32px;line-height:1.15;font-weight:500;letter-spacing:-1.2px;margin:0 0 8px}#house-preview h2{font-size:19px;font-weight:500;margin:0}#house-preview p{margin:0;color:var(--house-muted)}#house-preview .intro{margin-bottom:24px}#house-preview .brief{background:var(--house-accent);color:#233021;border-radius:20px;padding:18px;margin-bottom:26px}#house-preview .brief p{color:#43513c;font-size:13px}#house-preview .brief-title{display:flex;gap:9px;align-items:center;margin-bottom:7px;font-weight:600}#house-preview .brief-foot{display:flex;gap:18px;margin-top:15px;padding-top:12px;border-top:1px solid #aabc8c;font-size:12px}#house-preview .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}#house-preview .muted{color:var(--house-muted);font-size:12px}#house-preview .rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px}#house-preview .room{display:flex;flex-direction:column;text-align:left;background:var(--house-panel);border:1px solid transparent;border-radius:18px;padding:16px;min-height:143px;width:100%}#house-preview .room:hover{border-color:var(--house-accent)}#house-preview .room-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}#house-preview .room-icon{width:32px;height:32px;color:var(--house-muted)}#house-preview .room strong{font-size:15px;font-weight:500;letter-spacing:-.2px}#house-preview .room small{font-size:12px;color:var(--house-muted);margin-top:4px}#house-preview .room.active small,#house-preview .room.active .room-icon{color:var(--house-accent)}#house-preview .chevron{color:var(--house-muted);font-size:20px}#house-preview .wide-room{grid-column:1/-1;min-height:100px;display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:center}#house-preview .wide-room small{display:block}#house-preview .activity{margin-top:24px}#house-preview .activity-item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--house-line)}#house-preview .activity-item:last-child{border:0}#house-preview .activity-item span{flex:1}#house-preview .activity-item small{display:block;color:var(--house-muted);font-size:12px}#house-preview nav{display:flex;justify-content:space-around;border-top:1px solid var(--house-line);padding:13px 8px 18px;background:var(--house-bg)}#house-preview nav button{display:grid;justify-items:center;gap:5px;background:none;border:0;color:var(--house-muted);font-size:11px;min-height:44px;min-width:52px}#house-preview nav button.selected{color:var(--house-accent)}#house-preview svg{width:21px;height:21px}#house-preview .desktop{border-radius:20px}#house-preview .desktop-shell{display:grid;grid-template-columns:74px 1fr}#house-preview .rail{border-right:1px solid var(--house-line);padding:25px 10px;display:flex;flex-direction:column;align-items:center;gap:22px}#house-preview .rail button{display:grid;justify-items:center;gap:5px;background:none;border:0;color:var(--house-muted);font-size:10px;min-height:44px}#house-preview .rail button.selected{color:var(--house-accent)}#house-preview .rail .brand{font-size:21px;margin-bottom:20px}#house-preview .desktop-content{padding:30px}#house-preview .desktop h1{font-size:34px}#house-preview .desktop .rooms{grid-template-columns:repeat(2,minmax(0,1fr))}#house-preview .desktop .room{min-height:130px}#house-preview .desktop .wide-room{grid-column:auto;display:flex;align-items:stretch;gap:0}#house-preview .desktop .wide-room .room-icon{margin-bottom:16px}#house-preview .desktop .wide-room .chevron{display:none}#house-preview .desktop .brief{margin-bottom:24px}#house-preview .sample{font-size:11px;color:var(--house-muted);margin-top:12px}#house-preview .detail{padding:20px;background:var(--house-panel);border-radius:18px;margin-top:18px}#house-preview .detail[hidden]{display:none}#house-preview .detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}#house-preview .close{background:none;border:0;font-size:22px;min-width:44px;min-height:44px}#house-preview .fan-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}#house-preview .power{border:1px solid var(--house-line);background:var(--house-raised);border-radius:14px;padding:10px 16px;min-height:44px}#house-preview .power.on{background:var(--house-accent);color:#233021}#house-preview .speed{display:flex;gap:6px;margin-top:12px}#house-preview .speed button{flex:1;min-height:44px;border:0;border-radius:10px;background:var(--house-raised)}#house-preview .speed button[aria-pressed=true]{background:var(--house-accent);color:#233021}#house-preview .room:focus-visible,#house-preview button:focus-visible{outline:2px solid var(--house-accent);outline-offset:3px}@media(max-width:850px){#house-preview .stage{grid-template-columns:1fr}#house-preview .phone-wrap{max-width:390px;margin:auto;width:100%}}@media(max-width:450px){#house-preview .desktop-content{padding:18px}#house-preview .desktop-shell{grid-template-columns:54px 1fr}#house-preview .desktop .rooms{grid-template-columns:1fr}#house-preview .desktop h1{font-size:27px}}
</style>
<div class="stage"><section class="phone-wrap"><div class="device-label">Phone · House overview</div><div class="app phone"><div class="phone-content"></div><nav aria-label="Phone navigation"></nav></div></section><section><div class="device-label">PC · Same system, more breathing room</div><div class="app desktop"><div class="desktop-shell"><aside class="rail" aria-label="Desktop navigation"></aside><main class="desktop-content"></main></div></div></section></div>
<script>
(()=>{const root=document.getElementById('house-preview');const rooms=[['Living Room','sofa','1 of 2 fans on',true],['Office','monitor','Fan off · Echo idle',false],['Kitchen','cooking-pot','Dishwasher running',true],['Bedroom','bed-double','Fan off',false],['Master Bedroom','bed-double','Fan on · Speed 2',true],['Guest Room','washing-machine','Washer finished',true],['Dining Room','utensils','Fan off',false]];const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const nav=[['Home','house'],['Rooms','layout-grid'],['More','ellipsis']];const content=()=>`<div class="top"><span class="brand">Our home</span><span class="avatar">AS</span></div><header class="intro"><h1>Good evening,<br>Abhimanyu.</h1><p>Your house, at a glance.</p></header><div class="brief"><div class="brief-title">${icon('leaf')} Around your home</div><p>3 fans running · Dishwasher in progress</p><div class="brief-foot"><span>Washer finished</span><span>Guest Room →</span></div></div><div class="section-head"><h2>Room by room</h2><span class="muted">7 rooms</span></div><div class="rooms">${rooms.map(([name,i,status,active],k)=>`<button class="room ${active?'active':''} ${k===6?'wide-room':''}" data-room="${name}" type="button">${k===6?`<span class="room-icon">${icon(i)}</span><span><strong>${name}</strong><small>${status}</small></span><span class="chevron">›</span>`:`<span class="room-top"><span class="room-icon">${icon(i)}</span><span class="chevron">›</span></span><strong>${name}</strong><small>${status}</small>`}</button>`).join('')}</div><section class="detail" hidden aria-live="polite"></section><div class="activity-item"><span>Entrance console light<small>Pending integration · No Home Assistant entity verified</small></span></div><section class="activity"><div class="section-head"><h2>Around the house</h2></div><div class="activity-item">${icon('camera')}<span>Cameras<small>Open your permitted live views</small></span><span class="chevron">›</span></div><div class="activity-item">${icon('shopping-bag')}<span>Shopping & announcements<small>Household lists and updates</small></span><span class="chevron">›</span></div></section><p class="sample">Design preview · Illustrative states, not live readings</p>`;root.querySelector('.phone-content').innerHTML=content();root.querySelector('.desktop-content').innerHTML=content();root.querySelector('nav').innerHTML=nav.map(([n,i],k)=>`<button type="button" class="${k===0?'selected':''}" data-nav="${n}">${icon(i)}${n}</button>`).join('');root.querySelector('.rail').innerHTML=`<span class="brand">⌂</span>`+nav.map(([n,i],k)=>`<button type="button" class="${k===0?'selected':''}" data-nav="${n}">${icon(i)}${n}</button>`).join('');root.addEventListener('click',e=>{const room=e.target.closest('[data-room]');if(room){const detail=room.closest('main,.phone-content').querySelector('.detail');detail.hidden=false;detail.innerHTML=`<div class="detail-head"><h2>${room.dataset.room}</h2><button class="close" aria-label="Close room controls">×</button></div><div class="fan-row"><span>Fan${room.dataset.room==='Living Room'?' 1':''}<small style="display:block;color:var(--house-muted)">Preview controls</small></span><button class="power" aria-pressed="false">Turn on</button></div><div class="speed" aria-label="Fan speed">${[1,2,3,4,5,6].map(n=>`<button aria-pressed="false" data-speed="${n}">${n===6?'Boost':n}</button>`).join('')}</div>`;detail.scrollIntoView({behavior:'smooth',block:'nearest'});}if(e.target.closest('.close'))e.target.closest('.detail').hidden=true;const power=e.target.closest('.power');if(power){const on=power.getAttribute('aria-pressed')!=='true';power.setAttribute('aria-pressed',on);power.classList.toggle('on',on);power.textContent=on?'Turn off':'Turn on';}const speed=e.target.closest('[data-speed]');if(speed){speed.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===speed));}const n=e.target.closest('[data-nav]');if(n){n.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===n));const area=n.closest('.app').querySelector('main,.phone-content');if(n.dataset.nav==='Rooms')area.querySelector('.rooms').scrollIntoView({behavior:'smooth',block:'nearest'});else if(n.dataset.nav!=='Home'){const d=area.querySelector('.detail');d.hidden=false;d.innerHTML=`<div class="detail-head"><h2>${n.dataset.nav}</h2><button class="close" aria-label="Close preview">×</button></div><p>This preview focuses on Home and room controls.</p>`;}}});if(globalThis.lucide)lucide.createIcons();})();
</script>
</div>
