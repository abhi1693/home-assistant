input_select:
  house_mode:
    name: House mode
    icon: mdi:home-switch
    options:
      - Normal
      - Guest
      - Maintenance

  household_automation_stage:
    name: Household automation stage
    icon: mdi:shield-half-full
    options:
      - Shadow
      - Active

input_boolean:
  noncritical_automations_paused:
    name: Pause noncritical automations
    icon: mdi:pause-circle-outline

  empty_home_confirmed:
    name: Empty home confirmed
    icon: mdi:home-export-outline

input_text:
  last_household_decision:
    name: Last household decision
    max: 255
    icon: mdi:text-box-check-outline

input_datetime:
  last_household_evaluation:
    name: Last household evaluation
    has_date: true
    has_time: true

counter:
  household_shadow_decisions:
    name: Shadow decisions
    icon: mdi:shield-search
    restore: true

timer:
  household_startup_settle:
    name: Household startup settling
    duration: "00:10:00"
    restore: true

  high_confidence_empty_home:
    name: High confidence empty home
    duration: "00:05:00"
    restore: true

  outside_camera_offline:
    name: Outside camera offline
    duration: "00:15:00"
    restore: true

  hallway_camera_offline:
    name: Kitchen Balcony camera offline
    duration: "00:15:00"
    restore: true

  kitchen_camera_offline:
    name: Kitchen camera offline
    duration: "00:15:00"
    restore: true

  living_room_camera_offline:
    name: Living Room camera offline
    duration: "00:15:00"
    restore: true

  master_bedroom_camera_offline:
    name: Master Bedroom camera offline
    duration: "00:15:00"
    restore: true

  outside_camera_not_recording:
    name: Outside camera not recording
    duration: "00:15:00"
    restore: true

  hallway_camera_not_recording:
    name: Kitchen Balcony camera not recording
    duration: "00:15:00"
    restore: true

  kitchen_camera_not_recording:
    name: Kitchen camera not recording
    duration: "00:15:00"
    restore: true

  living_room_camera_not_recording:
    name: Living Room camera not recording
    duration: "00:15:00"
    restore: true

  master_bedroom_camera_not_recording:
    name: Master Bedroom camera not recording
    duration: "00:15:00"
    restore: true

schedule:
  quiet_hours:
    name: Quiet hours
    icon: mdi:volume-mute
    monday:
      - from: "00:00:00"
        to: "06:30:00"
      - from: "22:30:00"
        to: "23:59:59"
    tuesday:
      - from: "00:00:00"
        to: "06:30:00"
      - from: "22:30:00"
        to: "23:59:59"
    wednesday:
      - from: "00:00:00"
        to: "06:30:00"
      - from: "22:30:00"
        to: "23:59:59"
    thursday:
      - from: "00:00:00"
        to: "06:30:00"
      - from: "22:30:00"
        to: "23:59:59"
    friday:
      - from: "00:00:00"
        to: "06:30:00"
      - from: "23:00:00"
        to: "23:59:59"
    saturday:
      - from: "00:00:00"
        to: "07:00:00"
      - from: "23:00:00"
        to: "23:59:59"
    sunday:
      - from: "00:00:00"
        to: "07:00:00"
      - from: "22:30:00"
        to: "23:59:59"

template:
  - sensor:
      - name: Abhimanyu presence confidence
        unique_id: abhimanyu_presence_confidence
        icon: mdi:crosshairs-gps
        state: >-
          {% set gps = states('device_tracker.abhimanyu_pixel_8_2') %}
          {% set wifi = states('device_tracker.abhimanyu_pixel_8') %}
          {% set gps_age = (as_timestamp(now()) - as_timestamp(states.device_tracker.abhimanyu_pixel_8_2.last_updated)) / 60 if gps not in ['unknown', 'unavailable'] else 9999 %}
          {% set wifi_age = (as_timestamp(now()) - as_timestamp(states.device_tracker.abhimanyu_pixel_8.last_updated)) / 60 if wifi not in ['unknown', 'unavailable'] else 9999 %}
          {% if gps_age <= 20 and wifi_age <= 20 and ((gps == 'home') == (wifi == 'home')) %}high{% elif gps_age <= 20 or (wifi == 'home' and wifi_age <= 20) %}medium{% elif gps not in ['unknown', 'unavailable'] or wifi not in ['unknown', 'unavailable'] %}low{% else %}unknown{% endif %}
        attributes:
          gps_age_minutes: >-
            {{ ((as_timestamp(now()) - as_timestamp(states.device_tracker.abhimanyu_pixel_8_2.last_updated)) / 60) | round(0) if has_value('device_tracker.abhimanyu_pixel_8_2') else none }}
          wifi_age_minutes: >-
            {{ ((as_timestamp(now()) - as_timestamp(states.device_tracker.abhimanyu_pixel_8.last_updated)) / 60) | round(0) if has_value('device_tracker.abhimanyu_pixel_8') else none }}
          reason: >-
            {% if this.state == 'high' %}GPS and home Wi-Fi agree{% elif this.state == 'medium' %}One fresh phone signal{% elif this.state == 'low' %}Phone location is stale or disagrees{% else %}No usable phone location{% endif %}

      - name: Krishna presence confidence
        unique_id: krishna_presence_confidence
        icon: mdi:crosshairs-gps
        state: >-
          {% set gps = states('device_tracker.pixel_10_pro_2') %}
          {% set wifi = states('device_tracker.pixel_10_pro') %}
          {% set gps_age = (as_timestamp(now()) - as_timestamp(states.device_tracker.pixel_10_pro_2.last_updated)) / 60 if gps not in ['unknown', 'unavailable'] else 9999 %}
          {% set wifi_age = (as_timestamp(now()) - as_timestamp(states.device_tracker.pixel_10_pro.last_updated)) / 60 if wifi not in ['unknown', 'unavailable'] else 9999 %}
          {% if gps_age <= 20 and wifi_age <= 20 and ((gps == 'home') == (wifi == 'home')) %}high{% elif gps_age <= 20 or (wifi == 'home' and wifi_age <= 20) %}medium{% elif gps not in ['unknown', 'unavailable'] or wifi not in ['unknown', 'unavailable'] %}low{% else %}unknown{% endif %}
        attributes:
          gps_age_minutes: >-
            {{ ((as_timestamp(now()) - as_timestamp(states.device_tracker.pixel_10_pro_2.last_updated)) / 60) | round(0) if has_value('device_tracker.pixel_10_pro_2') else none }}
          wifi_age_minutes: >-
            {{ ((as_timestamp(now()) - as_timestamp(states.device_tracker.pixel_10_pro.last_updated)) / 60) | round(0) if has_value('device_tracker.pixel_10_pro') else none }}
          reason: >-
            {% if this.state == 'high' %}GPS and home Wi-Fi agree{% elif this.state == 'medium' %}One fresh phone signal{% elif this.state == 'low' %}Phone location is stale or disagrees{% else %}No usable phone location{% endif %}

      - name: Manisha presence confidence
        unique_id: manisha_presence_confidence
        icon: mdi:crosshairs-question
        state: >-
          {% set gps = states('device_tracker.iphone') %}
          {% set age = (as_timestamp(now()) - as_timestamp(states.device_tracker.iphone.last_updated)) / 60 if gps not in ['unknown', 'unavailable'] else 9999 %}
          {% if age <= 20 %}medium{% elif gps not in ['unknown', 'unavailable'] %}low{% else %}unknown{% endif %}
        attributes:
          gps_age_minutes: >-
            {{ ((as_timestamp(now()) - as_timestamp(states.device_tracker.iphone.last_updated)) / 60) | round(0) if has_value('device_tracker.iphone') else none }}
          wifi_confirmation: not configured
          reason: >-
            {% if this.state == 'medium' %}Fresh iPhone location; home Wi-Fi confirmation is not configured{% elif this.state == 'low' %}iPhone location is stale{% else %}iPhone location is unavailable{% endif %}

      - name: Abhimanyu home likelihood
        unique_id: abhimanyu_home_likelihood
        unit_of_measurement: "%"
        icon: mdi:home-account
        state: >-
          {% set person = states('person.abhimanyu_saharan') %}
          {% set confidence = states('sensor.abhimanyu_presence_confidence') %}
          {% if person in ['unknown', 'unavailable'] or confidence == 'unknown' %}50
          {% elif confidence == 'high' %}{{ 98 if person == 'home' else 2 }}
          {% elif confidence == 'medium' %}{{ 80 if person == 'home' else 20 }}
          {% else %}{{ 60 if person == 'home' else 40 }}{% endif %}
        attributes:
          confidence: "{{ states('sensor.abhimanyu_presence_confidence') }}"

      - name: Krishna home likelihood
        unique_id: krishna_home_likelihood
        unit_of_measurement: "%"
        icon: mdi:home-account
        state: >-
          {% set person = states('person.krishna') %}
          {% set confidence = states('sensor.krishna_presence_confidence') %}
          {% if person in ['unknown', 'unavailable'] or confidence == 'unknown' %}50
          {% elif confidence == 'high' %}{{ 98 if person == 'home' else 2 }}
          {% elif confidence == 'medium' %}{{ 80 if person == 'home' else 20 }}
          {% else %}{{ 60 if person == 'home' else 40 }}{% endif %}
        attributes:
          confidence: "{{ states('sensor.krishna_presence_confidence') }}"

      - name: Manisha home likelihood
        unique_id: manisha_home_likelihood
        unit_of_measurement: "%"
        icon: mdi:home-account
        state: >-
          {% set person = states('person.manisha') %}
          {% set confidence = states('sensor.manisha_presence_confidence') %}
          {% if person in ['unknown', 'unavailable'] or confidence == 'unknown' %}50
          {% elif confidence == 'high' %}{{ 98 if person == 'home' else 2 }}
          {% elif confidence == 'medium' %}{{ 80 if person == 'home' else 20 }}
          {% else %}{{ 60 if person == 'home' else 40 }}{% endif %}
        attributes:
          confidence: "{{ states('sensor.manisha_presence_confidence') }}"

      - name: Presence confidence
        unique_id: household_presence_confidence
        icon: mdi:account-check-outline
        state: >-
          {% set values = [states('sensor.abhimanyu_presence_confidence'), states('sensor.krishna_presence_confidence'), states('sensor.manisha_presence_confidence')] %}
          {% set people = [states('person.abhimanyu_saharan'), states('person.krishna'), states('person.manisha')] %}
          {% set home_confidence = [
            states('sensor.abhimanyu_presence_confidence') if is_state('person.abhimanyu_saharan', 'home') else none,
            states('sensor.krishna_presence_confidence') if is_state('person.krishna', 'home') else none,
            states('sensor.manisha_presence_confidence') if is_state('person.manisha', 'home') else none
          ] | reject('eq', none) | list %}
          {% if 'high' in home_confidence %}high{% elif 'medium' in home_confidence %}medium{% elif 'unknown' in people or 'unavailable' in people %}unknown{% elif 'low' in values %}low{% elif 'medium' in values %}medium{% else %}high{% endif %}
        attributes:
          abhimanyu: "{{ states('sensor.abhimanyu_presence_confidence') }}"
          krishna: "{{ states('sensor.krishna_presence_confidence') }}"
          manisha: "{{ states('sensor.manisha_presence_confidence') }}"

      - name: Camera coverage
        unique_id: household_camera_coverage
        icon: mdi:cctv
        state: >-
          {% set cameras = [states('camera.g5_turret_ultra_high_resolution_channel_2'), states('camera.hallway_high_resolution_channel'), states('camera.g5_turret_ultra_high_resolution_channel_3'), states('camera.living_room_high_resolution_channel'), states('camera.g5_turret_ultra_high_resolution_channel')] %}
          {{ cameras | reject('in', ['unknown', 'unavailable']) | list | count }} of 5 online
        attributes:
          kitchen: "{{ states('camera.g5_turret_ultra_high_resolution_channel_2') }}"
          kitchen_balcony: "{{ states('camera.hallway_high_resolution_channel') }}"
          living_room: "{{ states('camera.g5_turret_ultra_high_resolution_channel_3') }}"
          master_bedroom: "{{ states('camera.living_room_high_resolution_channel') }}"
          outside: "{{ states('camera.g5_turret_ultra_high_resolution_channel') }}"
          required_offline: >-
            {{ [
              'Outside' if states('camera.g5_turret_ultra_high_resolution_channel') in ['unknown', 'unavailable'] else none,
              'Kitchen Balcony' if states('camera.hallway_high_resolution_channel') in ['unknown', 'unavailable'] else none
            ] | reject('eq', none) | list }}

      - name: Rack power source
        unique_id: rack_power_source
        icon: mdi:power-plug
        availability: >-
          {{ states('sensor.ups_status_data') not in ['unknown', 'unavailable', ''] }}
        state: >-
          {% set status = states('sensor.ups_status_data').split() %}
          {{ 'Battery' if 'OB' in status else 'Mains' if 'OL' in status else 'Transition' }}
        attributes:
          status_flags: "{{ states('sensor.ups_status_data') }}"
          charge: "{{ states('sensor.ups_battery_charge') }}"
          load: "{{ states('sensor.ups_load') }}"

      - name: House attention level
        unique_id: house_attention_level
        icon: mdi:home-alert-outline
        state: >-
          {% set cameras_offline = states('camera.g5_turret_ultra_high_resolution_channel') in ['unknown', 'unavailable'] or states('camera.hallway_high_resolution_channel') in ['unknown', 'unavailable'] %}
          {% if is_state('binary_sensor.rack_ups_on_battery', 'on') or cameras_offline %}warning{% elif states('sensor.presence_confidence') in ['low', 'unknown'] %}advisory{% else %}clear{% endif %}
        attributes:
          primary_reason: >-
            {% if is_state('binary_sensor.rack_ups_on_battery', 'on') %}Home systems are running on backup power at {{ states('sensor.ups_battery_charge') }}% battery{% elif states('camera.g5_turret_ultra_high_resolution_channel') in ['unknown', 'unavailable'] or states('camera.hallway_high_resolution_channel') in ['unknown', 'unavailable'] %}Perimeter camera coverage is incomplete{% elif states('sensor.presence_confidence') in ['low', 'unknown'] %}Some family location signals are uncertain{% else %}Nothing needs attention{% endif %}

      - name: Household capability coverage
        unique_id: household_capability_coverage
        icon: mdi:shield-home-outline
        state: existing devices
        attributes:
          entry_contacts: not installed
          leak_sensors: not installed
          certified_smoke_co: not installed
          indoor_air_quality: not installed
          bed_occupancy: not installed
          wellbeing: consent required

  - binary_sensor:
      - name: Rack UPS on battery
        unique_id: rack_ups_on_battery
        device_class: power
        icon: mdi:power-plug-battery-outline
        state: >-
          {{ 'OB' in states('sensor.ups_status_data').split() }}
        availability: >-
          {{ states('sensor.ups_status_data') not in ['unknown', 'unavailable', ''] }}
        attributes:
          charge: "{{ states('sensor.ups_battery_charge') }}"
          load: "{{ states('sensor.ups_load') }}"

      - name: House occupied
        unique_id: house_occupied
        device_class: occupancy
        state: >-
          {{ (is_state('person.abhimanyu_saharan', 'home') and states('sensor.abhimanyu_presence_confidence') in ['high', 'medium'])
             or (is_state('person.krishna', 'home') and states('sensor.krishna_presence_confidence') in ['high', 'medium'])
             or (is_state('person.manisha', 'home') and states('sensor.manisha_presence_confidence') in ['high', 'medium']) }}
        availability: >-
          {{ states('sensor.presence_confidence') != 'unknown' }}

script:
  family_household_notify:
    alias: Route household notification
    mode: parallel
    max: 10
    fields:
      recipient:
        required: true
        selector:
          select:
            options: [owner, abhimanyu, krishna, manisha, family, master-camera]
      title:
        required: true
        selector:
          text:
      message:
        required: true
        selector: { text: { multiline: true } }
      severity:
        required: true
        selector:
          select:
            options: [informational, advisory, warning, critical]
      fingerprint:
        required: true
        selector:
          text:
      url:
        selector:
          text:
    sequence:
      - condition: template
        value_template: >-
          {{ severity in ['warning', 'critical'] or not is_state('schedule.quiet_hours', 'on') }}
      - variables:
          payload:
            title: "{{ title }}"
            message: "{{ message }}"
            data:
              tag: "{{ fingerprint }}"
              url: "{{ url | default('/home-tablet/home', true) }}"
              clickAction: "{{ url | default('/home-tablet/home', true) }}"
      - if:
          - condition: template
            value_template: "{{ recipient in ['owner', 'abhimanyu', 'family', 'master-camera'] }}"
        then:
          - action: notify.mobile_app_pixel_8
            data: "{{ payload }}"
      - if:
          - condition: template
            value_template: "{{ recipient in ['krishna', 'family', 'master-camera'] }}"
        then:
          - action: notify.mobile_app_pixel_10_pro
            data: "{{ payload }}"
      - if:
          - condition: template
            value_template: "{{ recipient in ['manisha', 'family'] }}"
        then:
          - action: notify.mobile_app_iphone
            data: "{{ payload }}"

  family_household_incident:
    alias: Record household incident
    mode: queued
    max: 20
    fields:
      recipient:
        required: true
        selector:
          text:
      title:
        required: true
        selector:
          text:
      message:
        required: true
        selector:
          text:
            multiline: true
      severity:
        required: true
        selector:
          text:
      fingerprint:
        required: true
        selector:
          text:
      url:
        selector:
          text:
    sequence:
      - action: input_text.set_value
        target: { entity_id: input_text.last_household_decision }
        data:
          value: "{{ severity }} · {{ title }} · {{ message }}"
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.last_household_evaluation }
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.household_automation_stage
                state: Active
              - condition: state
                entity_id: input_boolean.noncritical_automations_paused
                state: "off"
            sequence:
              - action: script.family_household_notify
                data:
                  recipient: "{{ recipient }}"
                  title: "{{ title }}"
                  message: "{{ message }}"
                  severity: "{{ severity }}"
                  fingerprint: "{{ fingerprint }}"
                  url: "{{ url | default('/home-tablet/home', true) }}"
        default:
          - action: counter.increment
            target: { entity_id: counter.household_shadow_decisions }

automation:
  - id: household_protect_admin_modes
    alias: Household · Protect administrator modes
    description: Revert direct non-owner changes to automation stage or house mode.
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_select.house_mode
          - input_select.household_automation_stage
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.context.user_id not in [none, '9302d11f48c64fe796a3c9e5cb563650'] }}
      - condition: template
        value_template: "{{ trigger.from_state is not none }}"
    actions:
      - action: input_select.select_option
        target: { entity_id: "{{ trigger.entity_id }}" }
        data: { option: "{{ trigger.from_state.state }}" }

  - id: household_protect_admin_pause
    alias: Household · Protect administrator pause
    description: Revert direct non-owner changes to the noncritical automation pause.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.noncritical_automations_paused
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.context.user_id not in [none, '9302d11f48c64fe796a3c9e5cb563650'] }}
      - condition: template
        value_template: "{{ trigger.from_state is not none }}"
    actions:
      - action: >-
          {{ 'input_boolean.turn_on' if trigger.from_state.state == 'on' else 'input_boolean.turn_off' }}
        target: { entity_id: input_boolean.noncritical_automations_paused }

  - id: household_startup_reconciliation
    alias: Household · Settle integrations after startup
    description: Prevent startup unknown and unavailable states from becoming incidents.
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: timer.start
        target: { entity_id: timer.household_startup_settle }

  - id: household_empty_confidence_dwell
    alias: Household · Confirm empty home
    description: Preserve a five-minute, restart-safe dwell before away workflows become eligible.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.house_occupied
        id: evaluate
      - trigger: state
        entity_id: sensor.presence_confidence
        id: evaluate
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.household_startup_settle }
        id: evaluate
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.high_confidence_empty_home }
        id: confirmed
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: confirmed
              - condition: state
                entity_id: binary_sensor.house_occupied
                state: "off"
              - condition: state
                entity_id: sensor.presence_confidence
                state: high
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.empty_home_confirmed }
          - conditions:
              - condition: trigger
                id: evaluate
              - condition: state
                entity_id: binary_sensor.house_occupied
                state: "off"
              - condition: state
                entity_id: sensor.presence_confidence
                state: high
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.empty_home_confirmed }
              - action: timer.start
                target: { entity_id: timer.high_confidence_empty_home }
        default:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.empty_home_confirmed }
          - action: timer.cancel
            target: { entity_id: timer.high_confidence_empty_home }

  - id: household_camera_coverage_timers
    alias: Household · Track camera coverage
    description: Use restoring timers so camera outage dwell survives a Home Assistant restart.
    mode: parallel
    max: 10
    triggers:
      - trigger: state
        entity_id: camera.g5_turret_ultra_high_resolution_channel
        id: outside
      - trigger: state
        entity_id: camera.hallway_high_resolution_channel
        id: hallway
      - trigger: state
        entity_id: camera.g5_turret_ultra_high_resolution_channel_2
        id: kitchen
      - trigger: state
        entity_id: camera.g5_turret_ultra_high_resolution_channel_3
        id: living-room
      - trigger: state
        entity_id: camera.living_room_high_resolution_channel
        id: master-bedroom
    conditions:
      - condition: state
        entity_id: timer.household_startup_settle
        state: idle
    actions:
      - variables:
          timer_entity: >-
            {{ {'outside': 'timer.outside_camera_offline', 'hallway': 'timer.hallway_camera_offline', 'kitchen': 'timer.kitchen_camera_offline', 'living-room': 'timer.living_room_camera_offline', 'master-bedroom': 'timer.master_bedroom_camera_offline'}[trigger.id] }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state in ['unknown', 'unavailable'] }}"
            sequence:
              - action: timer.start
                target: { entity_id: "{{ timer_entity }}" }
                data: { duration: "00:15:00" }
        default:
          - action: timer.cancel
            target: { entity_id: "{{ timer_entity }}" }

  - id: household_camera_coverage_incident
    alias: Household · Report camera outage
    description: Report one policy-routed incident after the camera-specific dwell expires.
    mode: queued
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.outside_camera_offline }
        id: outside
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.hallway_camera_offline }
        id: hallway
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.kitchen_camera_offline }
        id: kitchen
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.living_room_camera_offline }
        id: living-room
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.master_bedroom_camera_offline }
        id: master-bedroom
    actions:
      - variables:
          camera_name: >-
            {{ {'outside': 'Outside', 'hallway': 'Kitchen Balcony', 'kitchen': 'Kitchen', 'living-room': 'Living Room', 'master-bedroom': 'Master Bedroom'}[trigger.id] }}
          camera_recipient: "{{ 'master-camera' if trigger.id == 'master-bedroom' else 'owner' }}"
          camera_entity: >-
            {{ {'outside': 'camera.g5_turret_ultra_high_resolution_channel', 'hallway': 'camera.hallway_high_resolution_channel', 'kitchen': 'camera.g5_turret_ultra_high_resolution_channel_2', 'living-room': 'camera.g5_turret_ultra_high_resolution_channel_3', 'master-bedroom': 'camera.living_room_high_resolution_channel'}[trigger.id] }}
      - condition: template
        value_template: >-
          {{ states(camera_entity) in ['unknown', 'unavailable'] }}
      - action: script.family_household_incident
        data:
          recipient: "{{ camera_recipient }}"
          severity: warning
          fingerprint: "camera-offline-{{ trigger.id }}"
          title: Camera coverage gap
          message: "{{ camera_name }} camera has remained offline."
          url: /home-tablet/security

  - id: household_reconcile_camera_outages
    alias: Household · Reconcile camera outages after startup
    description: Re-evaluate durable camera outage timers after integrations settle.
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.household_startup_settle }
    actions:
      - if:
          - condition: template
            value_template: >-
              {{ states('camera.g5_turret_ultra_high_resolution_channel') in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.outside_camera_offline }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.outside_camera_offline }
      - if:
          - condition: template
            value_template: >-
              {{ states('camera.hallway_high_resolution_channel') in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.hallway_camera_offline }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.hallway_camera_offline }
      - if:
          - condition: template
            value_template: >-
              {{ states('camera.g5_turret_ultra_high_resolution_channel_2') in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.kitchen_camera_offline }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.kitchen_camera_offline }
      - if:
          - condition: template
            value_template: >-
              {{ states('camera.g5_turret_ultra_high_resolution_channel_3') in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.living_room_camera_offline }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.living_room_camera_offline }
      - if:
          - condition: template
            value_template: >-
              {{ states('camera.living_room_high_resolution_channel') in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.master_bedroom_camera_offline }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.master_bedroom_camera_offline }
      - if:
          - condition: state
            entity_id: sensor.g5_turret_ultra_recording_mode
            state: never
          - condition: template
            value_template: >-
              {{ states('camera.g5_turret_ultra_high_resolution_channel') not in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.outside_camera_not_recording }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.outside_camera_not_recording }
      - if:
          - condition: state
            entity_id: sensor.hallway_recording_mode
            state: never
          - condition: template
            value_template: >-
              {{ states('camera.hallway_high_resolution_channel') not in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.hallway_camera_not_recording }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.hallway_camera_not_recording }
      - if:
          - condition: state
            entity_id: sensor.g5_turret_ultra_recording_mode_2
            state: never
          - condition: template
            value_template: >-
              {{ states('camera.g5_turret_ultra_high_resolution_channel_2') not in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.kitchen_camera_not_recording }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.kitchen_camera_not_recording }
      - if:
          - condition: state
            entity_id: sensor.g5_turret_ultra_recording_mode_3
            state: never
          - condition: template
            value_template: >-
              {{ states('camera.g5_turret_ultra_high_resolution_channel_3') not in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.living_room_camera_not_recording }
            data: { duration: "00:15:00" }
        else:
          - action: timer.cancel
            target: { entity_id: timer.living_room_camera_not_recording }
      - if:
          - condition: state
            entity_id: sensor.living_room_recording_mode
            state: never
          - condition: template
            value_template: >-
              {{ states('camera.living_room_high_resolution_channel') not in ['unknown', 'unavailable'] }}
        then:
          - action: timer.start
            target: { entity_id: timer.master_bedroom_camera_not_recording }
            data: { duration: "00:15:00" }
        else:
