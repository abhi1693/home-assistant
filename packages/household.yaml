            target: { entity_id: timer.master_bedroom_camera_not_recording }

  - id: household_camera_recording_timers
    alias: Household · Track camera recording
    description: Start a durable timer only when an online camera explicitly stops recording.
    mode: parallel
    max: 10
    triggers:
      - trigger: state
        entity_id: sensor.g5_turret_ultra_recording_mode
        id: outside
      - trigger: state
        entity_id: sensor.hallway_recording_mode
        id: hallway
      - trigger: state
        entity_id: sensor.g5_turret_ultra_recording_mode_2
        id: kitchen
      - trigger: state
        entity_id: sensor.g5_turret_ultra_recording_mode_3
        id: living-room
      - trigger: state
        entity_id: sensor.living_room_recording_mode
        id: master-bedroom
    conditions:
      - condition: state
        entity_id: timer.household_startup_settle
        state: idle
    actions:
      - variables:
          timer_entity: >-
            {{ {'outside': 'timer.outside_camera_not_recording', 'hallway': 'timer.hallway_camera_not_recording', 'kitchen': 'timer.kitchen_camera_not_recording', 'living-room': 'timer.living_room_camera_not_recording', 'master-bedroom': 'timer.master_bedroom_camera_not_recording'}[trigger.id] }}
          camera_entity: >-
            {{ {'outside': 'camera.g5_turret_ultra_high_resolution_channel', 'hallway': 'camera.hallway_high_resolution_channel', 'kitchen': 'camera.g5_turret_ultra_high_resolution_channel_2', 'living-room': 'camera.g5_turret_ultra_high_resolution_channel_3', 'master-bedroom': 'camera.living_room_high_resolution_channel'}[trigger.id] }}
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.to_state.state == 'never' and states(camera_entity) not in ['unknown', 'unavailable'] }}
            sequence:
              - action: timer.start
                target: { entity_id: "{{ timer_entity }}" }
                data: { duration: "00:15:00" }
        default:
          - action: timer.cancel
            target: { entity_id: "{{ timer_entity }}" }

  - id: household_camera_recording_incident
    alias: Household · Report camera recording stopped
    description: Notify after an online Protect camera has remained out of recording mode.
    mode: queued
    max: 5
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.outside_camera_not_recording }
        id: outside
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.hallway_camera_not_recording }
        id: hallway
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.kitchen_camera_not_recording }
        id: kitchen
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.living_room_camera_not_recording }
        id: living-room
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.master_bedroom_camera_not_recording }
        id: master-bedroom
    actions:
      - variables:
          camera_name: >-
            {{ {'outside': 'Outside', 'hallway': 'Kitchen Balcony', 'kitchen': 'Kitchen', 'living-room': 'Living Room', 'master-bedroom': 'Master Bedroom'}[trigger.id] }}
          camera_recipient: "{{ 'master-camera' if trigger.id == 'master-bedroom' else 'owner' }}"
          camera_entity: >-
            {{ {'outside': 'camera.g5_turret_ultra_high_resolution_channel', 'hallway': 'camera.hallway_high_resolution_channel', 'kitchen': 'camera.g5_turret_ultra_high_resolution_channel_2', 'living-room': 'camera.g5_turret_ultra_high_resolution_channel_3', 'master-bedroom': 'camera.living_room_high_resolution_channel'}[trigger.id] }}
          recording_entity: >-
            {{ {'outside': 'sensor.g5_turret_ultra_recording_mode', 'hallway': 'sensor.hallway_recording_mode', 'kitchen': 'sensor.g5_turret_ultra_recording_mode_2', 'living-room': 'sensor.g5_turret_ultra_recording_mode_3', 'master-bedroom': 'sensor.living_room_recording_mode'}[trigger.id] }}
      - condition: template
        value_template: >-
          {{ states(camera_entity) not in ['unknown', 'unavailable'] and states(recording_entity) == 'never' }}
      - action: script.family_household_incident
        data:
          recipient: "{{ camera_recipient }}"
          severity: warning
          fingerprint: "camera-not-recording-{{ trigger.id }}"
          title: Camera is not recording
          message: "{{ camera_name }} camera has stopped recording for 15 minutes."
          url: /home-tablet/security

  - id: household_ups_on_battery
    alias: Household · Report backup power
    description: Share household impact while Rack Ops remains the only infrastructure actuator.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.rack_ups_on_battery
        to: "on"
        for: "00:00:30"
    conditions:
      - condition: state
        entity_id: timer.household_startup_settle
        state: idle
    actions:
      - action: script.family_household_incident
        data:
          recipient: family
          severity: warning
          fingerprint: rack-ups-on-battery
          title: Home is on backup power
          message: >-
            The rack UPS is at {{ states('sensor.ups_battery_charge') }}% with {{ states('sensor.ups_load') }}% load. Rack protection is automatic.
          url: /home-tablet/home

  - id: household_fan_guard
    alias: Household · Offer to stop fans after departure
    description: Ask rather than control; Atomberg commands remain explicit and quota-aware.
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.high_confidence_empty_home }
    conditions:
      - condition: state
        entity_id: binary_sensor.house_occupied
        state: "off"
      - condition: state
        entity_id: sensor.presence_confidence
        state: high
      - condition: template
        value_template: >-
          {{ expand('fan.master_bedroom_fan', 'fan.bedroom_fan', 'fan.guest_fan', 'fan.office_fan', 'fan.kitchen_fan', 'fan.dining_fan', 'fan.living_room_fan_1', 'fan.living_room_fan_2') | selectattr('state', 'eq', 'on') | list | count > 0 }}
    actions:
      - action: script.family_household_incident
        data:
          recipient: owner
          severity: advisory
          fingerprint: fans-running-away
          title: Fans are still running
          message: One or more available fans remain on after everyone left. Open Rooms to review them.
          url: /home-tablet/rooms

  - id: household_washer_complete
    alias: Household · Washer cycle complete
    description: Treat electrically-off washer entities as normal and notify only on a real completed state.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.front_load_washer_current_status
        to:
          - complete
          - completed
          - finished
          - end
    actions:
      - action: script.family_household_incident
        data:
          recipient: family
          severity: advisory
          fingerprint: washer-complete
          title: Laundry is ready
          message: The washer cycle has finished.
          url: /home-tablet/rooms/guest-room

  - id: household_dishwasher_complete
    alias: Household · Dishwasher cycle complete
    description: Notify the family when Home Connect confirms the program has finished.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.dishwasher_program_finished
        to: present
    actions:
      - action: script.family_household_incident
        data:
          recipient: family
          severity: advisory
          fingerprint: dishwasher-complete
          title: Dishes are ready
          message: The dishwasher cycle has finished.
          url: /home-tablet/rooms/kitchen

  - id: household_dishwasher_supplies
    alias: Household · Dishwasher supplies low
    description: Notify once when dishwasher salt or rinse aid needs refilling.
    mode: queued
    max: 2
    triggers:
      - trigger: state
        entity_id: sensor.dishwasher_salt_nearly_empty
        to: present
        id: salt
      - trigger: state
        entity_id: sensor.dishwasher_rinse_aid_nearly_empty
        to: present
        id: rinse-aid
    actions:
      - action: script.family_household_incident
        data:
          recipient: family
          severity: advisory
          fingerprint: "dishwasher-{{ trigger.id }}"
          title: Dishwasher needs a refill
          message: >-
            Refill dishwasher {{ 'salt' if trigger.id == 'salt' else 'rinse aid' }} before the next cycle.
          url: /home-tablet/rooms/kitchen

  - id: household_low_travel_battery
    alias: Household · Low battery while away
    description: Notify only the affected person when their phone is low away from Home.
    mode: parallel
    max: 3
    triggers:
      - trigger: numeric_state
        entity_id: sensor.pixel_8_battery_level
        below: 20
        id: abhimanyu
      - trigger: numeric_state
        entity_id: sensor.pixel_10_pro_battery_level
        below: 20
        id: krishna
      - trigger: numeric_state
        entity_id: sensor.iphone_battery_level
        below: 20
        id: manisha
    conditions:
      - condition: template
        value_template: >-
          {{ not is_state('person.' ~ ('abhimanyu_saharan' if trigger.id == 'abhimanyu' else trigger.id), 'home') }}
    actions:
      - action: script.family_household_incident
        data:
          recipient: "{{ trigger.id }}"
          severity: advisory
          fingerprint: "travel-battery-{{ trigger.id }}"
          title: Phone battery is low
          message: "{{ trigger.to_state.state }}% remaining while away from Home."
          url: /home-tablet/people

  - id: household_periodic_health_evaluation
    alias: Household · Evaluate health
    description: Keep a small, inspectable heartbeat and suppression reason for owner maintenance.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    actions:
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.last_household_evaluation }
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target: { entity_id: input_text.last_household_decision }
        data:
          value: >-
            {{ states('sensor.house_attention_level') }} · {{ state_attr('sensor.house_attention_level', 'primary_reason') }} · {{ states('input_select.household_automation_stage') }}
