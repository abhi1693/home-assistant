input_boolean:
  abhimanyu_homeward_journey_active:
    name: Abhimanyu homeward journey active
    icon: mdi:car-arrow-right

automation:
  - id: household_announce_abhimanyu_homeward_journey
    alias: Household · Announce Abhimanyu's journey home
    description: Share one fresh ETA per homeward journey and confirm arrival after 30 seconds inside Home.
    mode: queued
    max: 2
    triggers:
      - trigger: state
        entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
        to: towards
        id: departure
        note: A direction change starts the journey only after the outside-Home condition is confirmed.
      - trigger: zone.entered
        target:
          entity_id: person.abhimanyu_saharan
        options:
          zone: zone.home
          for: "00:00:30"
        id: arrival
        note: Require 30 seconds inside Home to reject GPS boundary noise.
      - trigger: homeassistant
        event: start
        id: reconcile
        note: Recover a journey whose arrival overlapped a Home Assistant restart.
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: departure
              - condition: zone.not_in_zone
                target:
                  entity_id: person.abhimanyu_saharan
                options:
                  zone: zone.home
              - condition: state
                entity_id: input_boolean.abhimanyu_homeward_journey_active
                state: "off"
            sequence:
              - action: google_travel_time.get_travel_times
                data:
                  config_entry_id: 01KZYG4SWHRFJBKQPFR4V2HDPV
                  origin: device_tracker.abhimanyu_pixel_8_2
                  destination: zone.home
                  mode: driving
                  units: metric
                  traffic_model: best_guess
                response_variable: departure_travel_home
                note: Fetch a fresh traffic-aware result for the spoken ETA.
              - variables:
                  departure_routes: >-
                    {{ departure_travel_home.get('routes', []) }}
                  departure_minutes: >-
                    {{ ((departure_routes[0].duration | float(0)) / 60)
                       | round(0, 'ceil') | int if departure_routes else 0 }}
              - condition: template
                value_template: "{{ departure_minutes | int(0) > 0 }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.abhimanyu_homeward_journey_active
                note: Persist the journey before speaking so repeated direction updates cannot duplicate it.
              - parallel:
                  - if:
                      - condition: or
                        conditions:
                          - condition: state
                            entity_id: person.krishna
                            state: home
                          - condition: state
                            entity_id: person.manisha
                            state: home
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: notify.abhimanyu_s_echo_dot_announce
                            state: unavailable
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.abhimanyu_s_echo_dot_announce
                        data:
                          message: >-
                            Abhimanyu has left for home. Current travel time is
                            approximately {{ departure_minutes }} minutes.
                        continue_on_error: true
                  - if:
                      - condition: zone.not_in_zone
                        target:
                          entity_id: person.krishna
                        options:
                          zone: zone.home
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.pixel_10_pro
                        data:
                          title: Abhimanyu is coming home
                          message: >-
                            Current travel time is approximately
                            {{ departure_minutes }} minutes.
                          data:
                            tag: abhimanyu-homeward-journey
                        continue_on_error: true
                  - if:
                      - condition: zone.not_in_zone
                        target:
                          entity_id: person.manisha
                        options:
                          zone: zone.home
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.iphone
                        data:
                          title: Abhimanyu is coming home
                          message: >-
                            Current travel time is approximately
                            {{ departure_minutes }} minutes.
                          data:
                            tag: abhimanyu-homeward-journey
                        continue_on_error: true
          - conditions:
              - condition: trigger
                id: arrival
              - condition: state
                entity_id: input_boolean.abhimanyu_homeward_journey_active
                state: "on"
            sequence:
              - parallel:
                  - if:
                      - condition: or
                        conditions:
                          - condition: state
                            entity_id: person.krishna
                            state: home
                          - condition: state
                            entity_id: person.manisha
                            state: home
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: notify.abhimanyu_s_echo_dot_announce
                            state: unavailable
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.abhimanyu_s_echo_dot_announce
                        data:
                          message: Abhimanyu is home.
                        continue_on_error: true
                  - if:
                      - condition: zone.not_in_zone
                        target:
                          entity_id: person.krishna
                        options:
                          zone: zone.home
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.pixel_10_pro
                        data:
                          title: Abhimanyu arrived home
                          message: Abhimanyu is home.
                          data:
                            tag: abhimanyu-homeward-journey
                        continue_on_error: true
                  - if:
                      - condition: zone.not_in_zone
                        target:
                          entity_id: person.manisha
                        options:
                          zone: zone.home
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.iphone
                        data:
                          title: Abhimanyu arrived home
                          message: Abhimanyu is home.
                          data:
                            tag: abhimanyu-homeward-journey
                        continue_on_error: true
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.abhimanyu_homeward_journey_active
                note: Reset only after the confirmed arrival branch finishes.
          - conditions:
              - condition: trigger
                id: reconcile
              - condition: state
                entity_id: input_boolean.abhimanyu_homeward_journey_active
                state: "on"
              - condition: state
                entity_id: person.abhimanyu_saharan
                state: home
            sequence:
              - delay: "00:00:30"
              - condition: state
                entity_id: person.abhimanyu_saharan
                state: home
              - parallel:
                  - if:
                      - condition: or
                        conditions:
                          - condition: state
                            entity_id: person.krishna
                            state: home
                          - condition: state
                            entity_id: person.manisha
                            state: home
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: notify.abhimanyu_s_echo_dot_announce
                            state: unavailable
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.abhimanyu_s_echo_dot_announce
                        data:
                          message: Abhimanyu is home.
                        continue_on_error: true
                  - if:
                      - condition: zone.not_in_zone
                        target:
                          entity_id: person.krishna
                        options:
                          zone: zone.home
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.pixel_10_pro
                        data:
                          title: Abhimanyu arrived home
                          message: Abhimanyu is home.
                          data:
                            tag: abhimanyu-homeward-journey
                        continue_on_error: true
                  - if:
                      - condition: zone.not_in_zone
                        target:
                          entity_id: person.manisha
                        options:
                          zone: zone.home
                    then:
                      - action: notify.send_message
                        target:
                          entity_id: notify.iphone
                        data:
                          title: Abhimanyu arrived home
                          message: Abhimanyu is home.
                          data:
                            tag: abhimanyu-homeward-journey
                        continue_on_error: true
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.abhimanyu_homeward_journey_active
                note: Clear a restored journey after the startup arrival confirmation.

template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/20"
      - trigger: state
        entity_id: person.abhimanyu_saharan
        from: home
      - trigger: state
        entity_id: person.abhimanyu_saharan
        to: home
      - trigger: state
        entity_id: person.abhimanyu_saharan
        to: Work
      - trigger: state
        entity_id: person.abhimanyu_saharan
        from: Work
      - trigger: state
        entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
        to: towards
      - trigger: state
        entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
        from: towards
    actions:
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: person.abhimanyu_saharan
                state: Work
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.abhimanyu_home_to_work
      - choose:
          - conditions:
              - condition: state
                entity_id: person.abhimanyu_saharan
                state: home
            sequence:
              - variables:
                  travel_home:
                    routes:
                      - duration: 0
                        duration_text: 0 min
                        static_duration_text: 0 min
                        distance_meters: 0
                        distance_text: 0 km
          - conditions:
              - condition: state
                entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
                state: towards
              - condition: numeric_state
                entity_id: device_tracker.abhimanyu_pixel_8_2
                attribute: latitude
                above: -91
                below: 91
              - condition: numeric_state
                entity_id: device_tracker.abhimanyu_pixel_8_2
                attribute: longitude
                above: -181
                below: 181
            sequence:
              - action: google_travel_time.get_travel_times
                data:
                  config_entry_id: 01KZYG4SWHRFJBKQPFR4V2HDPV
                  origin: device_tracker.abhimanyu_pixel_8_2
                  destination: zone.home
                  mode: driving
                  units: metric
                  traffic_model: best_guess
                response_variable: travel_home
        default:
          - variables:
              travel_home:
                routes: []
    sensor:
      - name: Abhimanyu to Home
        unique_id: abhimanyu_to_home
        default_entity_id: sensor.abhimanyu_to_home
        device_class: duration
        state_class: measurement
        unit_of_measurement: min
        availability: >-
          {{ travel_home is defined and travel_home.get('routes', []) | count > 0 }}
        state: >-
          {% set routes = travel_home.get('routes', []) if travel_home is defined else [] %}
          {{ (routes[0].duration | float(0) / 60) | round(1) if routes else none }}
        attributes:
          distance: >-
            {% set routes = travel_home.get('routes', []) if travel_home is defined else [] %}
            {{ routes[0].distance_text if routes else none }}
          traffic_time: >-
            {% set routes = travel_home.get('routes', []) if travel_home is defined else [] %}
            {{ routes[0].duration_text if routes else none }}
          static_time: >-
            {% set routes = travel_home.get('routes', []) if travel_home is defined else [] %}
            {{ routes[0].static_duration_text if routes else none }}

