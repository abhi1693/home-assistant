template:
  - binary_sensor:
      - name: Abhimanyu work commute window
        unique_id: abhimanyu_work_commute_window
        default_entity_id: binary_sensor.abhimanyu_work_commute_window
        icon: mdi:briefcase-clock
        state: >-
          {{ is_state('sun.sun', 'above_horizon') and now().weekday() in [0, 1, 2, 3, 4] }}
      - name: Krishna work commute window
        unique_id: krishna_work_commute_window
        default_entity_id: binary_sensor.krishna_work_commute_window
        icon: mdi:briefcase-clock
        state: >-
          {{ is_state('sun.sun', 'above_horizon') and now().weekday() in [0, 1, 2, 3, 4, 5] }}
      - name: Manisha work commute window
        unique_id: manisha_work_commute_window
        default_entity_id: binary_sensor.manisha_work_commute_window
        icon: mdi:briefcase-clock
        state: >-
          {{ is_state('sun.sun', 'above_horizon') and now().weekday() in [0, 1, 2, 3, 4] }}

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/20"
      - trigger: state
        entity_id: person.abhimanyu
        from: home
      - trigger: state
        entity_id: person.abhimanyu
        to: home
      - trigger: state
        entity_id: person.abhimanyu
        to: Work
      - trigger: state
        entity_id: person.abhimanyu
        from: Work
      - trigger: state
        entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
        to: towards
      - trigger: state
        entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
        from: towards
    actions:
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: person.abhimanyu
                state: Work
          - condition: state
            entity_id: binary_sensor.abhimanyu_work_commute_window
            state: "on"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.abhimanyu_home_to_work
      - choose:
          - conditions:
              - condition: state
                entity_id: person.abhimanyu
                state: home
            sequence:
              - variables:
                  travel_home:
                    routes:
                      - duration: 0
                        duration_text: 0 min
                        static_duration_text: 0 min
                        distance_meters: 0
                        distance_text: 0 km
          - conditions:
              - condition: state
                entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
                state: towards
              - condition: numeric_state
                entity_id: device_tracker.abhimanyu_pixel_8_2
                attribute: latitude
                above: -91
                below: 91
              - condition: numeric_state
                entity_id: device_tracker.abhimanyu_pixel_8_2
                attribute: longitude
                above: -181
                below: 181
            sequence:
              - action: google_travel_time.get_travel_times
                data:
                  config_entry_id: 01KZYG4SWHRFJBKQPFR4V2HDPV
                  origin: device_tracker.abhimanyu_pixel_8_2
                  destination: zone.home
                  mode: driving
                  units: metric
                  traffic_model: best_guess
                response_variable: travel_home
        default:
          - variables:
              travel_home:
                routes: []
    sensor:
      - name: Abhimanyu to Home
        unique_id: abhimanyu_to_home
        default_entity_id: sensor.abhimanyu_to_home
        device_class: duration
        state_class: measurement
        unit_of_measurement: min
        availability: >-
          {{ travel_home is defined and travel_home.get('routes', []) | count > 0 }}
        state: >-
          {% set routes = travel_home.get('routes', []) if travel_home is defined else [] %}
          {{ (routes[0].duration | float(0) / 60) | round(1) if routes else none }}
        attributes:
          distance: >-
            {% set routes = travel_home.get('routes', []) if travel_home is defined else [] %}
            {{ routes[0].distance_text if routes else none }}
          traffic_time: >-
            {% set routes = travel_home.get('routes', []) if travel_home is defined else [] %}
            {{ routes[0].duration_text if routes else none }}
          static_time: >-
            {% set routes = travel_home.get('routes', []) if travel_home is defined else [] %}
            {{ routes[0].static_duration_text if routes else none }}


