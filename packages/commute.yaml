automation:
  - id: abhimanyu_work_to_home_alexa_announcement
    alias: Announce Abhimanyu's work commute ETA
    triggers:
      - trigger: state
        entity_id: person.abhimanyu
        from: Work
    actions:
      - variables:
          alexa_announce_targets: >-
            {% set ns = namespace(kitchen=[], other=[]) %}
            {% set kitchen_devices = namespace(ids=[]) %}
            {% for player in ['media_player.abhimanyu_s_echo_dot_2', 'media_player.abhimanyu_s_echo_dot'] %}
              {% set device = device_id(player) %}
              {% if device %}
                {% set kitchen_devices.ids = kitchen_devices.ids + [device] %}
              {% endif %}
            {% endfor %}
            {% for entity in integration_entities('alexa_devices')
              | select('match', '^notify\\..*_announce$') | select('has_value') | list %}
              {% if device_id(entity) in kitchen_devices.ids %}
                {% set ns.kitchen = ns.kitchen + [entity] %}
              {% else %}
                {% set ns.other = ns.other + [entity] %}
              {% endif %}
            {% endfor %}
            {{ (ns.kitchen + ns.other) | join(', ') }}
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
                state: towards
        then:
          - wait_for_trigger:
              - trigger: state
                entity_id: sensor.family_arrivals_abhimanyu_direction_of_travel
                to: towards
            timeout: "00:15:00"
            continue_on_timeout: false
      - action: google_travel_time.get_travel_times
        data:
          config_entry_id: 01KZYG4SWHRFJBKQPFR4V2HDPV
          origin: device_tracker.abhimanyu_pixel_8_2
          destination: zone.home
          mode: driving
          units: metric
          traffic_model: best_guess
        response_variable: commute_eta
      - if:
          - condition: template
            value_template: >-
              {{ commute_eta is defined and commute_eta.get('routes', []) | count > 0 }}
          - condition: template
            value_template: "{{ alexa_announce_targets | trim != '' }}"
        then:
          - action: notify.send_message
            target:
              entity_id: "{{ alexa_announce_targets }}"
            data:
              message: >-
                Abhimanyu has left work and should be home in about
                {{ (commute_eta.routes[0].duration | float(0) / 60) | round(0) | int }}
                minutes.
    mode: single

  - id: abhimanyu_arrives_home_alexa_announcement
    alias: Announce Abhimanyu's arrival home
    triggers:
      - trigger: state
        entity_id: person.abhimanyu
        to: home
    actions:
      - variables:
          alexa_announce_targets: >-
            {% set ns = namespace(kitchen=[], other=[]) %}
            {% set kitchen_devices = namespace(ids=[]) %}
            {% for player in ['media_player.abhimanyu_s_echo_dot_2', 'media_player.abhimanyu_s_echo_dot'] %}
              {% set device = device_id(player) %}
              {% if device %}
                {% set kitchen_devices.ids = kitchen_devices.ids + [device] %}
              {% endif %}
            {% endfor %}
            {% for entity in integration_entities('alexa_devices')
              | select('match', '^notify\\..*_announce$') | select('has_value') | list %}
              {% if device_id(entity) in kitchen_devices.ids %}
                {% set ns.kitchen = ns.kitchen + [entity] %}
              {% else %}
                {% set ns.other = ns.other + [entity] %}
              {% endif %}
            {% endfor %}
            {{ (ns.kitchen + ns.other) | join(', ') }}
      - if:
          - condition: template
            value_template: "{{ alexa_announce_targets | trim != '' }}"
        then:
          - action: notify.send_message
            target:
              entity_id: "{{ alexa_announce_targets }}"
            data:
              message: Abhimanyu has arrived home.
    mode: single
